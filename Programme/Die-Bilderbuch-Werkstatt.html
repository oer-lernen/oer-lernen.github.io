<script>
/* EINWILLIGUNG v1 – Speichern auf diesem Gerät nur mit Einwilligung (wie Silbenexpress und Kommas Zählrahmen)
   Quelle: assets/js/einwilligung.js. Dieser Block steckt wortgleich in jedem Spiel, das etwas speichert,
   damit die Spiele auch einzeln und offline laufen. Nach einer Änderung hier: python3 werkzeuge/einwilligung_einbauen.py

   - Beim ersten Start fragt ein Fenster „Eine Frage an die Erwachsenen“.
   - „Ja, merken“: Die Einwilligung (kommas-einwilligung-v1) gilt für alle Spiele dieser Website.
   - „Nein, nichts speichern“: Es wird nichts gespeichert, auch nicht die Antwort. Beim nächsten Start fragt das Spiel erneut.
   - Widerruf unter „Für Lehrkräfte“ → „Auf diesem Gerät merken: Nicht merken“: Alle Spielstände dieser Website werden gelöscht.
   Rechtsgrundlage: Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TDDDG.

   Für das Spiel: KommaSpeicher.darf() vor jedem Lesen und Schreiben prüfen;
   KommaSpeicher.frage(name, beiJa) einmal beim Start aufrufen;
   KommaSpeicher.setze(true|false) für den Schalter im Lehrkräfte-Menü; KommaSpeicher.beiAenderung(fn). */
(function () {
  'use strict';
  if (window.KommaSpeicher) return;
  var SCHLUESSEL = 'kommas-einwilligung-v1';
  /* Alle Speicherstände der Sprachdetektei: werden beim Widerruf gelöscht */
  var PRAEFIXE = ['kommas-einwilligung', 'abteil7', 'kasusteich', 'zeitfaden', 'wortwurfbude', 'faelscherwerkstatt'];
  var DATENSCHUTZ = 'https://www.kommakatze.de/datenschutz.html';
  var zustand = null;          /* true = ja, false = nein (nur für diesen Aufruf), null = noch nicht gefragt */
  var hoerer = [];

  function lies() { try { return localStorage.getItem(SCHLUESSEL) === 'ja'; } catch (e) { return false; } }
  if (lies()) zustand = true;

  function loescheAlles() {
    try {
      var weg = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        if (PRAEFIXE.some(function (p) { return k.indexOf(p) === 0; })) weg.push(k);
      }
      weg.forEach(function (k) { localStorage.removeItem(k); });
      /* Kommas Bilderbuch-Werkstatt speichert in IndexedDB */
      if (window.indexedDB) indexedDB.deleteDatabase('kommas-bilderbuch-werkstatt');
    } catch (e) { /* ohne Speicher gibt es nichts zu löschen */ }
  }

  function setze(ja) {
    zustand = !!ja;
    if (ja) { try { localStorage.setItem(SCHLUESSEL, 'ja'); } catch (e) {} }
    else loescheAlles();
    hoerer.forEach(function (fn) { try { fn(zustand); } catch (e) {} });
  }

  function stil() {
    if (document.getElementById('komma-einwilligung-stil')) return;
    var s = document.createElement('style');
    s.id = 'komma-einwilligung-stil';
    s.textContent =
      '.ke-hg{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,20,40,.6)}' +
      '.ke-karte{max-width:460px;width:100%;max-height:calc(100% - 32px);overflow:auto;background:#FFFDF6;color:#2A2138;border:4px solid #2A2138;border-radius:18px;box-shadow:6px 6px 0 #2A2138;padding:20px 22px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left}' +
      '.ke-karte h2{margin:0 0 8px;font-size:1.25rem;line-height:1.25}' +
      '.ke-karte p{margin:0 0 10px}' +
      '.ke-reihe{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}' +
      '.ke-knopf{flex:1 1 160px;font:inherit;font-weight:700;padding:10px 14px;border:3px solid #2A2138;border-radius:12px;cursor:pointer;color:#2A2138}' +
      '.ke-ja{background:#BFEBD8}.ke-nein{background:#F7E08A}' +
      '.ke-knopf:focus-visible,.ke-link:focus-visible{outline:3px dashed #D94F5C;outline-offset:3px}.ke-karte:focus{outline:none}' +
      '.ke-link{color:#5A4A9E;font-weight:700}' +
      '.ke-klein{font-size:.85rem;color:#5B5070}';
    (document.head || document.documentElement).appendChild(s);
  }

  /* Fragt einmal, solange nicht eingewilligt wurde; beiJa() läuft nach „Ja, merken“ */
  /* was (optional): was gemerkt wird, z. B. „deine Bücher, Bilder und Einstellungen“ */
  function frage(name, beiJa, was) {
    if (zustand !== null) return;
    var los = function () {
      if (zustand !== null || document.querySelector('.ke-hg')) return;
      stil();
      var vorher = document.activeElement;
      var hg = document.createElement('div');
      hg.className = 'ke-hg';
      hg.innerHTML =
        '<div class="ke-karte" role="dialog" aria-modal="true" aria-labelledby="ke-titel" aria-describedby="ke-text" tabindex="-1">' +
        '<h2 id="ke-titel">Eine Frage an die Erwachsenen</h2>' +
        '<p id="ke-text"></p>' +
        '<p>Die Angaben bleiben im Browser dieses Geräts und gelten für alle Spiele der Sprachdetektei. Es werden keine Cookies gesetzt, keine Namen gespeichert und keine Daten übertragen. Ändern lässt sich das jederzeit unter „Für Lehrkräfte“ bzw. in den Einstellungen.</p>' +
        '<div class="ke-reihe"><button type="button" class="ke-knopf ke-ja">Ja, merken</button><button type="button" class="ke-knopf ke-nein">Nein, nichts speichern</button></div>' +
        '<p class="ke-klein">Ohne Speichern funktioniert alles, der Stand ist aber nach dem Schließen weg. <a class="ke-link" href="' + DATENSCHUTZ + '" target="_blank" rel="noopener">Datenschutzerklärung lesen</a></p>' +
        '</div>';
      hg.querySelector('#ke-text').textContent = 'Darf „' + name + '“ auf diesem Gerät merken, ' + (was || 'wie weit gespielt wurde (Fortschritt, Sticker und Einstellungen)') + '?';
      var zu = function (ja) {
        if (hg.parentNode) hg.parentNode.removeChild(hg);
        setze(ja);
        if (ja && typeof beiJa === 'function') { try { beiJa(); } catch (e) {} }
        if (vorher && vorher.focus && document.contains(vorher)) { try { vorher.focus(); } catch (e) {} }
      };
      hg.querySelector('.ke-ja').addEventListener('click', function () { zu(true); });
      hg.querySelector('.ke-nein').addEventListener('click', function () { zu(false); });
      /* Tab bleibt im Fenster */
      hg.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var f = hg.querySelectorAll('button,a');
        var erst = f[0], letzt = f[f.length - 1];
        if (e.shiftKey && document.activeElement === erst) { e.preventDefault(); letzt.focus(); }
        else if (!e.shiftKey && document.activeElement === letzt) { e.preventDefault(); erst.focus(); }
      });
      document.body.appendChild(hg);
      hg.querySelector('.ke-karte').focus();
    };
    if (document.body) los(); else document.addEventListener('DOMContentLoaded', los);
  }

  window.KommaSpeicher = {
    darf: function () { return zustand === true; },
    gefragt: function () { return zustand !== null; },
    setze: setze,
    frage: frage,
    beiAenderung: function (fn) { hoerer.push(fn); },
    TEXT_AN: 'Merken',
    TEXT_AUS: 'Nicht merken',
    TITEL: 'Auf diesem Gerät merken'
  };
})();
/* EINWILLIGUNG ENDE */
</script>
<!-- /EINWILLIGUNG -->

}

/* ---------- Speichern einer Datei ---------- */
async function saveFile(filename, blob) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        await dl.save({ filename, data: blob });
        return 'saved';
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') return 'declined';
    if (e && e.code && e.code !== 'unavailable' && e.code !== 'not_granted') throw e;
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, style: 'display:none' });
  document.body.append(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 5000);
  return 'saved';
}

/* ---------- IndexedDB: alles bleibt im Browser ---------- */
const DB = {
  db: null, ok: false,
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('kein IndexedDB');
      this.db = await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('timeout')), 5000);
        const r = indexedDB.open('kommas-bilderbuch-werkstatt', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          const stores = { projects: 'id', pages: 'id', blobs: 'key', materials: 'id', folders: 'id', settings: 'key' };
          for (const s in stores) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: stores[s] });
        };
        r.onsuccess = () => { clearTimeout(t); res(r.result); };
        r.onerror = () => { clearTimeout(t); rej(r.error); };
        r.onblocked = () => { clearTimeout(t); rej(new Error('blockiert')); };
      });
      this.ok = true;
    } catch (e) {
      console.warn('Speicher nicht verfügbar', e);
      this.ok = false;
    }
    return this.ok;
  },
  /* Ohne Browser-Speicher (z. B. privates Fenster) arbeitet die Werkstatt im Arbeitsspeicher weiter. */
  mem: { projects: new Map(), pages: new Map(), blobs: new Map(), materials: new Map(), folders: new Map(), settings: new Map() },
  _memKey(store) { return store === 'blobs' || store === 'settings' ? 'key' : 'id'; },
  _memReq(store, op, arg) {
    const m = this.mem[store];
    if (op === 'get') return Promise.resolve(m.get(arg));
    if (op === 'put') { m.set(arg[this._memKey(store)], arg); return Promise.resolve(); }
    if (op === 'del') { m.delete(arg); return Promise.resolve(); }
    if (op === 'all') return Promise.resolve([...m.values()]);
    if (op === 'keys') return Promise.resolve([...m.keys()]);
    if (op === 'clear') { m.clear(); return Promise.resolve(); }
    return Promise.resolve();
  },
  keys(store) { if (!this.ok) return this._memReq(store, 'keys'); return this._req(store, 'readonly', (s) => s.getAllKeys()).then((v) => v || []); },
  _req(store, mode, fn) {
    if (!this.ok) return Promise.resolve(undefined);
    return new Promise((res, rej) => {
      try {
        const tx = this.db.transaction(store, mode);
        const st = tx.objectStore(store);
        const r = fn(st);
        tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error || new Error('abgebrochen'));
      } catch (e) { rej(e); }
    });
  },
  get(store, key) { if (!this.ok) return this._memReq(store, 'get', key); return this._req(store, 'readonly', (s) => s.get(key)); },
  put(store, val) { if (!this.ok) return this._memReq(store, 'put', val); return this._req(store, 'readwrite', (s) => s.put(val)); },
  del(store, key) { if (!this.ok) return this._memReq(store, 'del', key); return this._req(store, 'readwrite', (s) => s.delete(key)); },
  all(store) { if (!this.ok) return this._memReq(store, 'all'); return this._req(store, 'readonly', (s) => s.getAll()).then((v) => v || []); },
  clear(store) { if (!this.ok) return this._memReq(store, 'clear'); return this._req(store, 'readwrite', (s) => s.clear()); },
};

  sweep(dur, f0, f1, vol, when = 0) {

      while (t < c.currentTime + 0.4) {

      const dt = Math.max(1, p.t - dr.last.t);
      const sp = Math.hypot(p.sx - dr.last.sx, p.sy - dr.last.sy) / dt; // Bildschirmpixel pro ms
      let lvl = clamp(sp / 1.2, 0, 1);
      if (dr.pr.jit) lvl *= 1 - dr.pr.jit * Math.random() * 0.7;
      dr.g.gain.setTargetAtTime(dr.pr.v * lvl, now, 0.03);
      dr.f.frequency.setTargetAtTime(dr.pr.f * (0.8 + 0.5 * clamp(sp / 1.5, 0, 1)), now, 0.05);
    }
    dr.last = { sx: p.sx, sy: p.sy, t: p.t };
  },
  drawStop(now) {
    const dr = this.dr; if (!dr) return;
    this.dr = null;
    try {
      const t = this.ctx.currentTime;
      dr.g.gain.cancelScheduledValues(t);
      dr.g.gain.setTargetAtTime(0, t, now ? 0.01 : 0.05);
      dr.src.stop(t + (now ? 0.05 : 0.3));
    } catch (e) { /* */ }
  },
};

  v: '#b9a7da', e: '#f0c9a0', G: '#3f7f52', C: '#f7e7cf', B: '#2f4f80',
};

function pxCanvas(rows, scale = 1, map = PXC) {
  const w = Math.max(...rows.map((r) => r.length)), hh = rows.length;
  const c = mkCanvas(w * scale, hh * scale);
  const x = c.getContext('2d');
  rows.forEach((r, j) => {
    for (let i = 0; i < r.length; i++) {
      const col = map[r[i]];
      if (col) { x.fillStyle = col; x.fillRect(i * scale, j * scale, scale, scale); }
    }
  });
  return c;
}
function padRows(rows, W = 16, H = 16) {
  const w = Math.max(...rows.map((r) => r.length));
  const left = Math.floor((W - w) / 2);
  const out = rows.map((r) => ('.'.repeat(Math.max(0, left)) + r).padEnd(W, '.').slice(0, W));
  while (out.length < H) { if (out.length % 2) out.unshift('.'.repeat(W)); else out.push('.'.repeat(W)); }
  return out.slice(0, H);
}

const dpi = () => S.project.dpi;
const unitK = () => S.project.dpi / 200;
const mm2px = (mm) => (mm * S.project.dpi) / 25.4;
const docW = () => S.project.docW;
const docH = () => S.project.docH;
const bleedPx = () => mm2px(S.project.bleedMm);
function computeGeometry(p) {
  const budget = p.quality === 'hoch' ? 12e6 : 8e6;
  const wIn = (p.wMm + 2 * p.bleedMm) / 25.4, hIn = (p.hMm + 2 * p.bleedMm) / 25.4;
  p.dpi = Math.min(300, Math.floor(Math.sqrt(budget / (wIn * hIn))));
  p.docW = Math.round(wIn * p.dpi);
  p.docH = Math.round(hIn * p.dpi);
  return p;
}
function trimRect() { const b = bleedPx(); return { x: b, y: b, w: docW() - 2 * b, h: docH() - 2 * b }; }

const ASSETS = new Map(); // id -> { id, canvas, w, h, stored }
function registerAsset(canvas, persist = true) {
  const id = uid('A');

  return id;
}

  if (ASSETS.has(id)) return ASSETS.get(id).canvas;
  const rec = await DB.get('blobs', 'a:' + id);

/* ---------- Verlauf (Rückgängig) ---------- */
function histLimits() {
  const kids = S.mode === 'kids';
  return { steps: kids ? 12 : 40, bytes: IS_IOS ? 90e6 : 180e6 };
}
function pushHist(cmd) {
  S.histSerial++;
  cmd.bytes = cmd.bytes || 2000;
  for (const c of S.future) S.histBytes -= c.bytes;
  S.future = [];
  S.history.push(cmd);
  S.histBytes += cmd.bytes;
  const lim = histLimits();
  while (S.history.length > lim.steps || (S.histBytes > lim.bytes && S.history.length > 1)) {
    const c = S.history.shift();
    S.histBytes -= c.bytes;
  }
  markDirty();
  UI.refreshUndo();
  if (S.tool === 'fuellen') prewarmFill();
  TL.schedule();
}
function clearHistory() { S.histSerial++; S.history = []; S.future = []; S.histBytes = 0; if (window.UI) UI.refreshUndo(); }
function undo() {
  finishTextEdit();
  const c = S.history.pop();
  if (!c) { Komma.say('Da gibt es nichts mehr rückgängig zu machen.', { mood: 'wow', time: 2200 }); return; }
  c.undo();
  S.future.push(c);
  Snd.play(Snd.fun() ? 'rewind' : 'undo');
  afterHistoryJump();
}
function redo() {
  finishTextEdit();
  const c = S.future.pop();
  if (!c) return;
  c.redo();
  S.history.push(c);
  Snd.play('redo');
  afterHistoryJump();
}
function afterHistoryJump() {
  S.histSerial++;
  TL.schedule();
  if (!findLayer(S.activeLayerId)) { const top = layers()[layers().length - 1]; S.activeLayerId = top ? top.id : null; }
  if (S.selectedId && !findLayer(S.selectedId)) S.selectedId = null;
  markDirty(true);
  requestRender();
  UI.refreshUndo(); UI.refreshLayers(); UI.refreshProps(); UI.refreshCtx();
}
function snapLayers() { return layers().map((l) => Object.assign({}, l)); }
function structCmd(before, after, sel) {
  const restore = (snap, s) => {
    S.page.layers = snap.map((o) => Object.assign({}, o));
    for (const l of S.page.layers) if (l.type === 'paint') l.dirty = true;
    if (s) { S.activeLayerId = s.active; S.selectedId = s.selected; }
  };
  return {
    bytes: 3000,
    undo() { restore(before, sel && sel.before); },
    redo() { restore(after, sel && sel.after); },
  };
}
/* Ändert die Ebenenstruktur und legt einen Rückgängig-Schritt an. */
function change(fn) {
  const before = snapLayers();
  const selB = { active: S.activeLayerId, selected: S.selectedId };
  const res = fn();
  const after = snapLayers();
  const selA = { active: S.activeLayerId, selected: S.selectedId };
  pushHist(structCmd(before, after, { before: selB, after: selA }));
  requestRender();
  UI.refreshLayers(); UI.refreshProps(); UI.refreshCtx();
  return res;
}
function paintPatchCmd(layer, x, y, before, after) {
  const id = layer.id;
  const get = () => findLayer(id) || layer;
  return {
    bytes: (before.data.length + after.data.length),
    undo() { const L = get(); L.canvas.getContext('2d').putImageData(before, x, y); L.dirty = true; },
    redo() { const L = get(); L.canvas.getContext('2d').putImageData(after, x, y); L.dirty = true; },
  };
}
function compoundCmd(cmds) {
  return {
    bytes: cmds.reduce((a, c) => a + (c.bytes || 0), 0),
    undo() { for (let i = cmds.length - 1; i >= 0; i--) cmds[i].undo(); },
    redo() { for (const c of cmds) c.redo(); },
  };
}
function clampRect(x, y, w, hh, W, H) {
  const x0 = clamp(Math.floor(x), 0, W), y0 = clamp(Math.floor(y), 0, H);
  const x1 = clamp(Math.ceil(x + w), 0, W), y1 = clamp(Math.ceil(y + hh), 0, H);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* ---------- Bildfilter (ohne ctx.filter, damit es auch auf älteren iPads läuft) ---------- */
function filterKey(f) { return f ? [f.b, f.c, f.s, f.warm, f.post, f.gray ? 1 : 0, f.fade].join(',') : ''; }
function hasFilters(f) { return f && (f.b || f.c || f.s || f.warm || f.post || f.gray || f.fade); }
function filteredSource(L) {
  const src = assetCanvas(L.assetId);
  if (!src) return null;
  if (!hasFilters(L.filters)) return src;
  const key = L.assetId + '|' + filterKey(L.filters);
  if (L._fcache && L._fkey === key) return L._fcache;
  const c = cloneCanvas(src);
  const x = c.getContext('2d', { willReadFrequently: true });
  const id = x.getImageData(0, 0, c.width, c.height);
  applyFilters(id.data, L.filters);
  x.putImageData(id, 0, 0);
  L._fcache = c; L._fkey = key;
  return c;
}
function applyFilters(d, f) {
  const b = (f.b || 0) * 1.6;            // Helligkeit −100..100
  const cf = 1 + (f.c || 0) / 100;       // Kontrast
  const sf = 1 + (f.s || 0) / 100;       // Sättigung
  const warm = (f.warm || 0) * 0.5;      // Wärme
  const lv = f.post ? Math.max(2, f.post) : 0;
  const fade = (f.fade || 0) / 100;      // verblasst
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    let r = d[i], g = d[i + 1], bl = d[i + 2];
    r = (r - 128) * cf + 128 + b; g = (g - 128) * cf + 128 + b; bl = (bl - 128) * cf + 128 + b;
    const l = 0.299 * r + 0.587 * g + 0.114 * bl;
    if (f.gray) { r = g = bl = l; }
    else { r = l + (r - l) * sf; g = l + (g - l) * sf; bl = l + (bl - l) * sf; }
    r += warm; bl -= warm;
    if (fade) { r = r + (236 - r) * fade * 0.5; g = g + (226 - g) * fade * 0.5; bl = bl + (205 - bl) * fade * 0.5; }
    if (lv) { const q = 255 / (lv - 1); r = Math.round(r / q) * q; g = Math.round(g / q) * q; bl = Math.round(bl / q) * q; }
    d[i] = r < 0 ? 0 : r > 255 ? 255 : r; d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g; d[i + 2] = bl < 0 ? 0 : bl > 255 ? 255 : bl;
  }

/* Collage-Stück zuschneiden */
function cutImage(L, polyDoc, style) {
  const src = assetCanvas(L.assetId);
  if (!src) return false;
  const k = src.width / L.w;
  const mmPx = mm2px(1) * k;
  const poly = polyDoc.map((p) => { const q = imgCoords(L, src, p.x, p.y); return { x: q.u, y: q.v }; });
  const { inner, fringe } = edgePaths(poly, style, mmPx, (Math.random() * 1e6) | 0);
  const m = Math.ceil(mmPx * 3);
  const c = mkCanvas(src.width + 2 * m, src.height + 2 * m);
  const x = c.getContext('2d');
  x.translate(m, m);
  if (fringe) {
    x.save(); pathPoly(x, fringe); x.clip();
    x.fillStyle = PAPER_EDGE; x.fillRect(-m, -m, c.width, c.height);
    // die weiße Papierkante nur dort, wo auch Bild ist
    x.globalCompositeOperation = 'destination-in';
    x.drawImage(blurAlpha(src, Math.max(2, mmPx * 1.6)), 0, 0);
    x.restore();
  }
  x.save(); pathPoly(x, inner); x.clip(); x.drawImage(src, 0, 0); x.restore();

  const crop = mkCanvas(b.w, b.h);

  freeCanvas(c);

  // 1) das ausgeschnittene Teil wird ein neues Stück (gleiche Lage, Drehung, Filter)

  piece.assetId = registerAsset(crop);
  cropAdjust(piece, src.width, src.height, b.x - m, b.y - m, b.w, b.h);
  // 2) das Foto behält ein Loch in Form des Schnitts (wie bei echter Schere und Papier)

  if (!rb) ls.splice(idx, 1); // nichts übrig
  else {
    const rc = mkCanvas(rb.w, rb.h);
    rc.getContext('2d').drawImage(rest, rb.x, rb.y, rb.w, rb.h, 0, 0, rb.w, rb.h);
    const rid = registerAsset(rc);
    cropAdjust(L, src.width, src.height, rb.x, rb.y, rb.w, rb.h);
    L.assetId = rid; L._fcache = null;

}

function blurAlpha(src, r) {

/* Zeichnung aus einer Malebene als Stück herauslösen */

  if (rc.w < 2 || rc.h < 2) return false;

  if (!content) { Komma.say('Da ist nichts gemalt, was ich ausschneiden könnte.', { mood: 'wow' }); return false; }

  const id = registerAsset(crop);

/* Papier-Schnipsel aus Farbe, Muster oder Material reißen */
async function makeSchnipsel(polyDoc, opt = {}) {
  const o = S.opts.schnipsel;
  if (S.source.kind === 'material' && S.source.materialId) await MatCache.load(S.source.materialId);
  let bb = polyBounds(polyDoc);
  const maxSide = 4000;
  const sc = Math.min(1, maxSide / Math.max(bb.w, bb.h));
  const pts = polyDoc.map((p) => ({ x: (p.x - bb.x) * sc, y: (p.y - bb.y) * sc }));
  const mmPx = mm2px(1) * sc;
  const { inner, fringe } = edgePaths(pts, o.edge, mmPx, (Math.random() * 1e6) | 0);
  const m = Math.ceil(mmPx * 3);
  const c = mkCanvas(bb.w * sc + 2 * m, bb.h * sc + 2 * m);
  const x = c.getContext('2d');
  x.translate(m, m);
  if (fringe) { pathPoly(x, fringe); x.fillStyle = PAPER_EDGE; x.fill(); }
  x.save();
  pathPoly(x, inner); x.clip();
  const kind = S.source.kind;
  const W = c.width, H = c.height;
  if (kind === 'color') {
    x.fillStyle = S.color; x.fillRect(-m, -m, W, H);
    // leichte Papierstruktur
    x.globalAlpha = 0.5; x.globalCompositeOperation = 'multiply';
    x.fillStyle = x.createPattern(paperGrainTile(), 'repeat'); x.fillRect(-m, -m, W, H);
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  } else if (kind === 'pattern') {
    x.fillStyle = PAPER_EDGE; x.fillRect(-m, -m, W, H);
    const tile = makePatternTile(S.source.pattern, S.color, unitK() * 1.6 * S.source.scale * sc);
    x.fillStyle = x.createPattern(tile, 'repeat'); x.fillRect(-m, -m, W, H);
  } else {
    const mat = MatCache.get(S.source.materialId);
    if (mat) {
      const s2 = (mm2px(70) * S.source.scale * sc) / mat.width;
      x.save(); x.scale(s2, s2); x.fillStyle = x.createPattern(mat, 'repeat'); x.fillRect(-m / s2, -m / s2, W / s2, H / s2); x.restore();
    } else { x.fillStyle = S.color; x.fillRect(-m, -m, W, H); }
  }
  x.restore();
  const b = alphaBounds(c);
  if (!b) return;
  const crop = mkCanvas(b.w, b.h);
  crop.getContext('2d').drawImage(c, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);
  freeCanvas(c);
  const id = registerAsset(crop);
  const cx = bb.x + (b.x - m + b.w / 2) / sc, cy = bb.y + (b.y - m + b.h / 2) / sc;
  change(() => {
    const nl = newImageLayer(id, cx, cy, b.w / sc, b.h / sc, kind === 'material' ? 'Papierstück' : 'Schnipsel');
    nl.shadow = !!o.shadow;
    insertObjectLayer(nl);
    setActive(nl.id);
  });
  Snd.play(Snd.fun() ? 'rip' : 'snip');
  if (!opt.noSwitch) {
    setTool('select', true);
    Komma.tipOnce('schnipsel-move', 'Dein Schnipsel ist ausgewählt: Du kannst ihn gleich verschieben, drehen oder größer machen. Mit „Weiter" oben geht es zurück zum Reißen.');
  }
  if (S.mode === 'kids') Komma.cheer();
}

/* Ebene mit der darunter zusammenfügen (die untere muss eine Malebene sein) */
function mergeDown(A) {
  if (!A) return;
  const i = layerIndex(A.id);
  const B = layers()[i - 1];
  if (!B || B.type !== 'paint') { Komma.say('Zusammenfügen geht nur, wenn direkt darunter eine Malebene liegt.', { mood: 'wow' }); return; }
  if (B.locked || A.locked) { Komma.say('Eine der Ebenen ist gesperrt.', { mood: 'wow' }); return; }
  let rc;
  if (A.type === 'paint') { const b = alphaBounds(A.canvas); if (!b) rc = null; else rc = b; }
  else { if (A.type === 'text') layoutText(A); const bb = polyBounds(layerCorners(A)); rc = clampRect(bb.x - mm2px(2), bb.y - mm2px(2), bb.w + mm2px(4), bb.h + mm2px(4), docW(), docH()); }
  const before = snapLayers();
  let patch = null;
  if (rc && rc.w > 0 && rc.h > 0) {
    const bc = B.canvas.getContext('2d');
    const pb = bc.getImageData(rc.x, rc.y, rc.w, rc.h);
    bc.save();
    if (B.alphaLock) bc.globalCompositeOperation = 'source-atop';
    drawLayer(bc, A, 1, { export: true });
    bc.restore();
    patch = paintPatchCmd(B, rc.x, rc.y, pb, bc.getImageData(rc.x, rc.y, rc.w, rc.h));
    B.dirty = true;
  }
  S.page.layers = layers().filter((l) => l.id !== A.id);
  setActive(B.id);
  const st = structCmd(before, snapLayers(), null);
  pushHist(patch ? compoundCmd([patch, st]) : st);

  requestRender(); UI.refreshLayers(); UI.refreshCtx();
}

  if (!A || A.type !== 'paint') { Komma.say('Leeren geht bei Malebenen. Collage-Stücke löschst du mit dem Papierkorb.', { mood: 'wow' }); return; }

/* ============================================================
   Baukasten: Häuser, Kirche, Bäume, Wolken, Mond … im Tuschestil
   ============================================================ */
function inkPath(ctx, pts, o) {
  const k = o.k || unitK();
  const width = (o.width || 4) * k;
  const wob = o.wobble == null ? 0.5 : o.wobble;
  const seed = o.seed || 1;
  let path = pts.slice();
  if (o.closed) path.push(pts[0], pts[1] || pts[0]);
  path = densify(path, 2.2 * k);
  ctx.save();
  ctx.fillStyle = o.color || '#1d1a1a';
  let L = 0, last = null, nx = 0, ny = 0;
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    if (i) L += Math.hypot(p.x - path[i - 1].x, p.y - path[i - 1].y);
    const q = path[Math.min(path.length - 1, i + 1)], pr = path[Math.max(0, i - 1)];
    const dx = q.x - pr.x, dy = q.y - pr.y, l = Math.hypot(dx, dy) || 1;
    nx = -dy / l; ny = dx / l;
    const off = fbm1(L / (24 * k), seed) * wob * (1.6 * k + width * 0.3);
    let r = (width / 2) * (1 + 0.15 * noise1(L / (9 * k), seed + 3));
    const ends = Math.min(L, 9999);
    if (!o.closed && ends < width * 2) r *= 0.6 + 0.4 * (ends / (width * 2));
    const cur = { x: p.x + nx * off, y: p.y + ny * off, r };
    if (!last) stampDot(ctx, cur.x, cur.y, r);
    else stampSeg(ctx, last.x, last.y, last.r, cur.x, cur.y, r, 0, null);
    last = cur;
  }
  ctx.restore();
}

  ctx.save();
  ctx.fillStyle = col;
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x + (off ? off.x : 0), p.y + (off ? off.y : 0)) : ctx.moveTo(p.x + (off ? off.x : 0), p.y + (off ? off.y : 0))));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function rectPts(x, y, w, hh) { return [{ x, y }, { x: x + w, y }, { x: x + w, y: y + hh }, { x, y: y + hh }]; }
function trimCanvas(c) {
  const b = alphaBounds(c, 2);
  if (!b) return c;
  const o = mkCanvas(b.w + 4, b.h + 4);
  o.getContext('2d').drawImage(c, b.x, b.y, b.w, b.h, 2, 2, b.w, b.h);
  freeCanvas(c);
  return o;
}

function enableColorDrop(btn, color, onTap) {
  let st = null;
  btn.addEventListener('pointerdown', (e) => {
    st = { x: e.clientX, y: e.clientY, id: e.pointerId, ghost: null };
    try { btn.setPointerCapture(e.pointerId); } catch (err) { /* */ }
  });
  btn.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    if (!st.ghost && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 12) {
      st.ghost = h('div', { class: 'dropghost', style: { background: color } });
      document.body.append(st.ghost);
    }
    if (st.ghost) { st.ghost.style.left = e.clientX + 'px'; st.ghost.style.top = e.clientY + 'px'; }
  });
  const end = async (e) => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (!s.ghost) { if (e.type === 'pointerup') onTap(); return; }
    s.ghost.remove();
    if (e.type !== 'pointerup') return;
    const r = R.cv.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    const p = screenToDoc(e.clientX - r.left, e.clientY - r.top);
    if (p.x < 0 || p.y < 0 || p.x >= docW() || p.y >= docH()) return;
    setColor(color);
    const keep = S.source.kind; S.source.kind = 'color';
    const L = drawTarget('fuellen');
    if (L) {
      UI.busy(true); await nextFrame();
      try { if (await floodFillAt(L, p.x, p.y)) { Snd.play(Snd.fun() ? 'glug' : 'plop'); Komma.tipOnce('colordrop', 'Farbe aufs Blatt gezogen – so füllst du Flächen ganz schnell.'); } }
      catch (err) { console.error(err); }
      UI.busy(false); UI.refreshLayers();
    }
    S.source.kind = keep;
  };
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
}

const QS = {

      tr.addEventListener('pointerdown', (e) => {
        e.preventDefault(); e.stopPropagation();
        try { tr.setPointerCapture(e.pointerId); } catch (err) { /* */ }
        set(fromEv(e)); this.showPreview(true);
        const mv = (ev) => set(fromEv(ev));
        const up = () => { tr.removeEventListener('pointermove', mv); tr.removeEventListener('pointerup', up); tr.removeEventListener('pointercancel', up); this.showPreview(false); if (UI.sideTab === 'props') UI.refreshProps(); Store.saveSettings(); };
        tr.addEventListener('pointermove', mv); tr.addEventListener('pointerup', up); tr.addEventListener('pointercancel', up);
      });
      tr.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); set(this.getFrac(key) + (e.key === 'ArrowUp' ? 0.04 : -0.04)); } });

  else if (hh < 240) [r, g, b] = [0, x, c]; else if (hh < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];

function openColorPicker() {
  let [hh, s, v] = rgbToHsv(...hexToRgb(S.color));
  const old = S.color;
  const sq = h('canvas', { class: 'cp-sq', width: 300, height: 220, 'aria-label': 'Sättigung und Helligkeit' });
  const hue = h('canvas', { class: 'cp-hue', width: 300, height: 28, 'aria-label': 'Farbton' });
  const swOld = h('div', { class: 'cp-sw', style: { background: old }, title: 'vorher' });
  const swNew = h('div', { class: 'cp-sw' });
  const hex = h('input', { class: 'field', type: 'text', id: 'cp-hex', maxlength: '7', style: { width: '110px', fontFamily: 'var(--font-ui)' } });
  const draw = () => {
    const x = sq.getContext('2d');
    x.fillStyle = hsvToHex(hh, 1, 1); x.fillRect(0, 0, 300, 220);
    let g = x.createLinearGradient(0, 0, 300, 0); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 300, 220);
    g = x.createLinearGradient(0, 0, 0, 220); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000'); x.fillStyle = g; x.fillRect(0, 0, 300, 220);
    x.lineWidth = 3; x.strokeStyle = v > 0.5 && s < 0.5 ? '#3a2e2a' : '#fff';
    x.beginPath(); x.arc(s * 300, (1 - v) * 220, 9, 0, 7); x.stroke();
    const y = hue.getContext('2d');
    const hg = y.createLinearGradient(0, 0, 300, 0);
    for (let i = 0; i <= 6; i++) hg.addColorStop(i / 6, hsvToHex(i * 60 % 360, 1, 1));
    y.fillStyle = hg; y.fillRect(0, 0, 300, 28);
    y.lineWidth = 3; y.strokeStyle = '#3a2e2a'; y.strokeRect((hh / 360) * 300 - 4, 1, 8, 26);
    const col = hsvToHex(hh, s, v);
    swNew.style.background = col;
    if (document.activeElement !== hex) hex.value = col;
  };
  const drag = (cv, fn) => {
    cv.style.touchAction = 'none';
    cv.addEventListener('pointerdown', (e) => {
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      const at = (ev) => { const r = cv.getBoundingClientRect(); fn(clamp((ev.clientX - r.left) / r.width, 0, 1), clamp((ev.clientY - r.top) / r.height, 0, 1)); draw(); };
      at(e);
      const mv = (ev) => at(ev);
      const up = () => { cv.removeEventListener('pointermove', mv); cv.removeEventListener('pointerup', up); };
      cv.addEventListener('pointermove', mv); cv.addEventListener('pointerup', up);
    });
  };
  drag(sq, (fx, fy) => { s = fx; v = 1 - fy; });
  drag(hue, (fx) => { hh = Math.min(359.9, fx * 360); });
  hex.addEventListener('input', () => { if (/^#[0-9a-f]{6}$/i.test(hex.value)) { [hh, s, v] = rgbToHsv(...hexToRgb(hex.value)); draw(); } });
  const recent = h('div', { class: 'seg' });
  for (const c of S.recent.slice(0, 10)) { const b = h('button', { class: 'sw', type: 'button', style: { background: c, width: '30px', height: '30px' }, 'aria-label': 'zuletzt ' + c }); b.addEventListener('click', () => { [hh, s, v] = rgbToHsv(...hexToRgb(c)); draw(); }); recent.append(b); }
  draw();
  const d = openDialog({
    title: 'Farbe', cls: 'cpdlg',
    body: h('div', { class: 'sec' }, sq, hue, h('div', { class: 'row' }, swOld, swNew, h('label', { for: 'cp-hex', class: 'check' }, 'Code'), hex), S.recent.length ? h('div', { class: 'sec' }, h('h3', null, 'Zuletzt benutzt'), recent) : null),
    foot: [h('button', { class: 'key', type: 'button', onclick: () => d.close() }, 'Abbrechen'), h('button', { class: 'key primary', type: 'button', onclick: () => { setColor(hsvToHex(hh, s, v)); d.close(); } }, 'Übernehmen')],
  });
}

      setTimeout(blink, 2600 + Math.random() * 3500);

      'Bei den Stickern rechts findest du Häuser, Bäume und mich!',
      'Mit dem Pfeil zurück machst du den letzten Schritt rückgängig.',
    ] : [
      'Tipp: Linien auf eine Ebene, Farben auf eine Ebene darunter – dann bleibt alles sauber.',
      'Mit der Schere kannst du auch deine Zeichnung als eigenes Stück herauslösen.',
      'Leertaste gedrückt halten und ziehen verschiebt das Blatt.',
      'Unter „Drucken & Export" bekommst du ein Druck-PDF mit 3 mm Beschnitt.',
      'Eigene Papiere und Stoffe fotografierst du einfach und legst sie in die Ablage.',
      'Sichere fertige Bücher als Projektdatei – der Browser-Speicher kann gelöscht werden.',
    ];
    this.say(tips[Math.floor(Math.random() * tips.length)], { mood: 'happy' });

      const row = h('div', { class: 'bact' });

      b.append(row);

    let n = 0;

      drawKomma(this.cv, n % 2 ? 'talk' : (this.mood === 'happy' ? 'happy' : this.mood === 'wow' ? 'wow' : 'idle'));
      if (++n > 7) { clearInterval(this.talkT); this.talkT = null; drawKomma(this.cv, this.mood === 'happy' ? 'happy' : 'idle'); }
    }, 130);

const _dlgStack = [];
function openDialog({ title, body, foot, cls = '', onClose }) {
  const scrim = h('div', { class: 'scrim' });
  const xb = h('button', { class: 'xb', type: 'button', 'aria-label': 'Schließen' }, icon('close', 16));
  const win = h('div', { class: 'win dlg ' + cls, role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'tbar' }, xb, h('div', { class: 'tt' }, pxTextImg(title, 2, getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#3a2e2a'))),
    h('div', { class: 'dbody' }, body),
    foot && foot.length ? h('div', { class: 'dfoot' }, foot) : null);
  scrim.append(win);
  $('#modals').append(scrim);
  const d = {
    el: win, scrim,
    close() { scrim.remove(); const i = _dlgStack.indexOf(d); if (i >= 0) _dlgStack.splice(i, 1); if (onClose) onClose(); },
  };
  xb.addEventListener('click', () => { Snd.play('click'); d.close(); });
  win.addEventListener('keydown', (e) => { if (e.key === 'Escape' && _dlgStack[_dlgStack.length - 1] === d) { e.preventDefault(); e.stopPropagation(); d.close(); } });
  scrim.addEventListener('pointerdown', (e) => { if (e.target === scrim) d.close(); });
  _dlgStack.push(d);
  setTimeout(() => { const f = win.querySelector('input:not([type=range]):not([type=checkbox]), .dfoot .primary'); if (f && !matchMedia('(pointer: coarse)').matches) f.focus(); }, 40);
  return d;
}
function confirmDialog(text, okLabel = 'Ja', danger = false, title = 'Sicher?') {

    let done = false;

    const d = openDialog({
      title, cls: '',
      body: h('div', { class: 'row', style: { alignItems: 'flex-start', flexWrap: 'nowrap' } }, kommaCanvas(3, 'wow'), h('p', null, text)),
      foot: [h('button', { class: 'key', type: 'button', onclick: () => fin(false) }, 'Abbrechen'), h('button', { class: 'key ' + (danger ? 'danger' : 'primary'), type: 'button', onclick: () => fin(true) }, okLabel)],
      onClose: () => { if (!done) { done = true; res(false); } },
    });
  });
}
function promptDialog(title, label, value, okLabel = 'OK') {
  return new Promise((res) => {
    let done = false;
    const inp = h('input', { class: 'field', type: 'text', value: value || '', id: 'prompt-field', maxlength: '60' });
    const fin = (v) => { if (done) return; done = true; d.close(); res(v); };

const RUNTIME_KEYS = ['canvas', '_fcache', '_fkey', '_edit', '_lay', '_layKey', '_editing', 'dirty'];
function serializeLayer(L) {
  const o = {};
  for (const k in L) if (!RUNTIME_KEYS.includes(k)) o[k] = L[k];
  if (L.type === 'paint') o.blobKey = 'p:' + L.id;
  return o;
}
function defaultLayers(kids) {
  if (kids) { const a = newPaintLayer('Malen'); return [a]; }
  const a = newPaintLayer('Farben'), b = newPaintLayer('Linien');
  a.role = 'colors'; b.role = 'lines';
  return [a, b];
}

      if (v.seen) Komma.seen = new Set(v.seen);

    Snd.applyMode();

  /* ----- Bilder ----- */
  async saveAsset(id) {
    const a = ASSETS.get(id);
    if (!a || a.stored) return;
    try {
      const blob = await canvasToStoreBlob(a.canvas);
      await DB.put('blobs', { key: 'a:' + id, blob });
      a.stored = true;
    } catch (e) { console.warn(e); this.quotaWarn(e); }
  },
  quotaWarn(e) {
    if (e && /quota|space/i.test(String(e.name || e.message))) toast('Der Browser-Speicher ist voll. Bitte Projektdateien sichern und alte Bücher löschen.', true);

  /* ----- Bücher ----- */
  async listProjects() { const ps = await DB.all('projects'); return ps.sort((a, b) => b.updated - a.updated); },
  async createProject(o) {
    const p = computeGeometry({
      id: uid('P'), name: o.name || 'Neues Bilderbuch', formatId: o.format.id, wMm: o.format.w, hMm: o.format.h, spread: o.format.spread,
      bleedMm: o.bleed ? 3 : 0, quality: o.quality || 'normal', kids: !!o.kids, flip: !!o.flip, fps: 6, pageIds: [], created: Date.now(), updated: Date.now(), thumb: null,
    });
    const prev = S.project; S.project = p;
    const pg = { id: uid('G'), projectId: p.id, bg: '#ffffff', layers: defaultLayers(p.kids) };
    p.pageIds.push(pg.id);
    await this.writePage(pg, true);
    await DB.put('projects', p);
    S.project = prev;
    return p;
  },
  async writePage(pg, all) {
    for (const L of pg.layers) {
      if (L.type === 'paint' && (L.dirty || all)) {
        const blob = await canvasToBlob(L.canvas, 'image/png');
        await DB.put('blobs', { key: 'p:' + L.id, blob });
        L.dirty = false;
      }
    }
    const rec = { id: pg.id, projectId: S.project.id, bg: pg.bg, layers: pg.layers.map(serializeLayer), thumb: pg.thumb || null, persp: pg.persp || null, bgChecked: !!pg.bgChecked };
    const old = await DB.get('pages', pg.id);
    if (old) {
      const keep = new Set(rec.layers.filter((l) => l.type === 'paint').map((l) => l.blobKey));
      for (const l of old.layers) if (l.type === 'paint' && !keep.has(l.blobKey)) DB.del('blobs', l.blobKey);
    }
    await DB.put('pages', rec);
  },
  async openProject(id, pageIndex = 0) {
    if (S.project) await this.saveCurrent();
    const p = await DB.get('projects', id);
    if (!p) { toast('Dieses Buch wurde nicht gefunden.', true); return false; }
    computeGeometry(p);
    this.releasePage();
    S.project = p;
    blankThumb.u = null;
    const metas = [];
    for (const pid of p.pageIds) { const r = await DB.get('pages', pid); metas.push({ id: pid, thumb: r ? r.thumb : null }); }
    this.pageMetas = metas;
    S.pageIndex = -1;
    await this.openPage(clamp(pageIndex, 0, p.pageIds.length - 1), true);
    this.lastProject = p.id;
    this.saveSettings();
    UI.buildMenubar();
    UI.refreshTitle();
    fitView();
    return true;
  },
  releasePage() {
    if (!S.page) return;
    for (const L of S.page.layers) if (L.type === 'paint') freeCanvas(L.canvas);
    S.page = null;
    clearHistory();
    for (const [id, a] of ASSETS) { if (a.stored) { freeCanvas(a.canvas); ASSETS.delete(id); } }
  },
  async openPage(i, skipSave) {
    if (!S.project) return;
    finishTextEdit();
    if (!skipSave && S.page) await this.saveCurrent();
    UI.busy(true);
    this.releasePage();
    const pid = S.project.pageIds[i];
    const rec = await DB.get('pages', pid);
    const pg = { id: pid, bg: (rec && rec.bg) || '#ffffff', layers: [], thumb: rec ? rec.thumb : null, persp: rec ? rec.persp || null : null };
    if (rec) {
      for (const o of rec.layers) {
        const L = Object.assign({}, o);
        delete L.blobKey;
        if (L.type === 'paint') {
          L.canvas = mkCanvas(docW(), docH());
          const b = await DB.get('blobs', o.blobKey);
          if (b && b.blob) { try { const img = await loadImageFromBlob(b.blob); L.canvas.getContext('2d').drawImage(img, 0, 0); } catch (e) { console.warn(e); } }
          L.dirty = false;
        } else if (L.type === 'image') {
          try { await ensureAsset(L.assetId); } catch (e) { console.warn('Bild fehlt', e); }
          if (!assetCanvas(L.assetId)) continue;
        }
        pg.layers.push(L);
      }
    }
    if (!pg.layers.some((l) => l.type === 'paint')) pg.layers.push(newPaintLayer(S.project.kids ? 'Malen' : 'Linien'));
    // ältere Seiten: ganzseitige Hintergrundbilder ganz unten feststecken (einmalig)
    if (!(rec && rec.bgChecked)) {
      const L0 = pg.layers[0];
      if (L0 && L0.type === 'image' && !L0.locked && L0.w * L0.h >= docW() * docH() * 0.9) { L0.locked = true; if (!/Hintergrund/.test(L0.name)) L0.name += ' (Hintergrund)'; }
      pg.bgChecked = true; pg.dirty = true;
    } else pg.bgChecked = true;
    S.page = pg;
    S.pageIndex = i;
    TL.load(pid);
    Flip.buildOnion();
    const top = [...pg.layers].reverse().find((l) => l.type === 'paint') || pg.layers[pg.layers.length - 1];
    S.activeLayerId = top ? top.id : null;
    S.selectedId = null;
    UI.busy(false);
    UI.setDisk('saved');
    UI.refreshPages(); UI.refreshLayers(); UI.refreshProps(); UI.refreshCtx();
    requestRender();
  },
  async saveCurrent(manual) {
    if (!S.project || !S.page) return;
    if (this.saving) { this.pending = true; return; }
    this.saving = true;
    clearTimeout(_saveTimer);
    UI.setDisk('saving');
    try {
      finishTextEdit();
      for (const L of S.page.layers) if (L.type === 'image') await this.saveAsset(L.assetId);
      const tw = 320;
      const sc = tw / docW();
      const th = renderRegion(layers(), 0, 0, docW(), docH(), sc, S.page.bg || '#ffffff');
      S.page.thumb = th.toDataURL('image/jpeg', 0.75);
      freeCanvas(th);
      await this.writePage(S.page);
      if (this.pageMetas[S.pageIndex]) this.pageMetas[S.pageIndex].thumb = S.page.thumb;
      S.project.updated = Date.now();
      if (S.pageIndex === 0 || !S.project.thumb) S.project.thumb = S.page.thumb;
      await DB.put('projects', S.project);
      S.dirty = false;
      UI.setDisk('saved');
      const pt = $$('.pthumb img')[S.pageIndex];
      if (pt) pt.src = S.page.thumb;
      if (manual) { Snd.play('save'); toast(DB.ok ? 'Gespeichert.' : 'Gespeichert – aber nur für diese Sitzung.'); }
    } catch (e) {
      console.error(e);
      UI.setDisk('dirty');
      this.quotaWarn(e);
      if (manual) toast('Speichern hat nicht geklappt.', true);
    }
    this.saving = false;
    if (this.pending) { this.pending = false; this.saveCurrent(); }
  },
  async addPage(opts = {}) {
    if (!S.project) return;
    if (S.project.flip) opts.blank = true;
    const tpl = opts.blank ? null : await PageTpl.choose();
    if (!opts.blank && !tpl) return;
    await this.saveCurrent();
    const pg = { id: uid('G'), projectId: S.project.id, bg: '#ffffff', layers: defaultLayers(S.project.kids) };
    await this.writePage(pg, true);
    for (const L of pg.layers) freeCanvas(L.canvas);
    const at = S.pageIndex + 1;
    S.project.pageIds.splice(at, 0, pg.id);
    this.pageMetas.splice(at, 0, { id: pg.id, thumb: null });
    await DB.put('projects', S.project);
    await this.openPage(at, true);
    Snd.play(Snd.fun() ? 'page' : 'pop');
    if (tpl && tpl.id !== 'leer') { await PageTpl.apply(tpl); clearHistory(); await this.saveCurrent(); }
  },
  async duplicatePage() {
    await this.saveCurrent();
    const src = await DB.get('pages', S.project.pageIds[S.pageIndex]);
    if (!src) return;
    const rec = { id: uid('G'), projectId: S.project.id, bg: src.bg, thumb: src.thumb, persp: src.persp || null, layers: [] };
    for (const l of src.layers) {
      const n = Object.assign({}, l, { id: uid('L') });
      if (l.type === 'paint') { const b = await DB.get('blobs', l.blobKey); n.blobKey = 'p:' + n.id; if (b) await DB.put('blobs', { key: n.blobKey, blob: b.blob }); }
      rec.layers.push(n);
    }
    await DB.put('pages', rec);
    const at = S.pageIndex + 1;
    S.project.pageIds.splice(at, 0, rec.id);
    this.pageMetas.splice(at, 0, { id: rec.id, thumb: rec.thumb });
    await DB.put('projects', S.project);
    await this.openPage(at, true);
    toast('Seite verdoppelt.');
  },
  async deletePage() {
    if (S.project.pageIds.length <= 1) { Komma.say('Ein Buch braucht mindestens eine Seite.', { mood: 'wow' }); return; }
    if (!(await confirmDialog('Diese Seite mit allem, was darauf ist, löschen?', 'Seite löschen', true))) return;
    const i = S.pageIndex;
    const pid = S.project.pageIds[i];
    const rec = await DB.get('pages', pid);
    this.releasePage();
    if (rec) for (const l of rec.layers) if (l.type === 'paint') await DB.del('blobs', l.blobKey);
    await DB.del('pages', pid);
    await DB.del('blobs', 'tl:' + pid);
    S.project.pageIds.splice(i, 1);
    this.pageMetas.splice(i, 1);
    await DB.put('projects', S.project);
    Snd.play('trash');
    await this.openPage(Math.max(0, i - 1), true);
  },
  async movePage(dir) {
    const i = S.pageIndex, j = i + dir;
    if (j < 0 || j >= S.project.pageIds.length) return;
    await this.saveCurrent();
    const ids = S.project.pageIds, m = this.pageMetas;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    [m[i], m[j]] = [m[j], m[i]];
    S.pageIndex = j;
    await DB.put('projects', S.project);
    UI.refreshPages();
  },
  async deleteProject(id) {
    const p = await DB.get('projects', id);
    if (!p) return;
    for (const pid of p.pageIds) {
      await DB.del('blobs', 'tl:' + pid);
      const r = await DB.get('pages', pid);
      if (r) for (const l of r.layers) if (l.type === 'paint') await DB.del('blobs', l.blobKey);
      await DB.del('pages', pid);
    }
    await DB.del('projects', id);
  },
  async gc() {
    // verwaiste Bilder aufräumen (nur beim Start, bevor etwas Neues entsteht)
    try {
      const keys = await DB.keys('blobs');
      const pages = await DB.all('pages');
      const used = new Set();
      for (const pg of pages) for (const l of pg.layers) { if (l.type === 'paint') used.add(l.blobKey); if (l.type === 'image') used.add('a:' + l.assetId); }
      for (const m of this.materials) used.add('m:' + m.id);
      const pageIds = new Set(pages.map((pg) => pg.id));
      for (const k of keys) {
        if ((k.startsWith('a:') || k.startsWith('p:')) && !used.has(k)) await DB.del('blobs', k);
        if (k.startsWith('tl:') && !pageIds.has(k.slice(3))) await DB.del('blobs', k);
      }
    } catch (e) { console.warn(e); }
  },
  async wipeAll() {
    for (const s of ['projects', 'pages', 'blobs', 'materials', 'folders', 'settings']) await DB.clear(s);
    toast('Alles gelöscht. Die Werkstatt startet neu.');
    setTimeout(() => location.reload(), 1200);
  },

  /* ----- Projektdatei (.json) ----- */
  async exportProjectFile() {
    await this.saveCurrent();
    UI.busy(true);
    try {
      const p = S.project;
      const parts = [];
      const meta = Object.assign({}, p); delete meta.thumb;
      parts.push('{"app":"kommas-bilderbuch-werkstatt","version":1,"project":', JSON.stringify(meta), ',"pages":[');
      const assetIds = new Set();
      for (let i = 0; i < p.pageIds.length; i++) {
        const r = await DB.get('pages', p.pageIds[i]);
        if (!r) continue;
        const layersOut = [];
        for (const l of r.layers) {
          const o = Object.assign({}, l);
          if (l.type === 'paint') { const b = await DB.get('blobs', l.blobKey); o.data = b ? await blobToDataURL(b.blob) : null; delete o.blobKey; }
          if (l.type === 'image') assetIds.add(l.assetId);
          layersOut.push(o);
        }
        parts.push((i ? ',' : '') + JSON.stringify({ bg: r.bg, layers: layersOut }));
      }
      parts.push('],"assets":{');
      let first = true;
      for (const id of assetIds) {
        let b = await DB.get('blobs', 'a:' + id);
        if (!b && ASSETS.has(id)) b = { blob: await canvasToStoreBlob(assetCanvas(id)) };
        if (!b) continue;
        parts.push((first ? '' : ',') + JSON.stringify(id) + ':' + JSON.stringify(await blobToDataURL(b.blob)));
        first = false;
      }
      parts.push('}}');
      const blob = new Blob(parts, { type: 'application/json' });
      const r = await saveFile(safeName(p.name) + '.bilderbuch.json', blob);
      if (r === 'saved') toast('Projektdatei gesichert.');
    } catch (e) { console.error(e); toast('Die Projektdatei konnte nicht erstellt werden.', true); }
    UI.busy(false);
  },
  importProjectFile(after) {
    const fi = h('input', { type: 'file', accept: '.json,application/json' });
    fi.addEventListener('change', async () => {
      const f = fi.files[0];
      if (!f) return;
      UI.busy(true);
      try {
        const data = JSON.parse(await blobToText(f));
        if (data.app !== 'kommas-bilderbuch-werkstatt' || !data.project) throw new Error('Das ist keine Projektdatei der Bilderbuch-Werkstatt.');
        if (S.project) await this.saveCurrent();
        const amap = {};
        for (const id in data.assets || {}) { const nid = uid('A'); amap[id] = nid; await DB.put('blobs', { key: 'a:' + nid, blob: dataURLToBlob(data.assets[id]) }); }
        const p = Object.assign({}, data.project, { id: uid('P'), pageIds: [], updated: Date.now(), name: data.project.name + ' (geladen)' });
        computeGeometry(p);
        for (const pg of data.pages) {
          const rec = { id: uid('G'), projectId: p.id, bg: pg.bg || '#ffffff', layers: [], thumb: null };
          for (const l of pg.layers) {
            const n = Object.assign({}, l, { id: uid('L') });
            if (l.type === 'paint') { n.blobKey = 'p:' + n.id; if (l.data) await DB.put('blobs', { key: n.blobKey, blob: dataURLToBlob(l.data) }); delete n.data; }
            if (l.type === 'image') n.assetId = amap[l.assetId] || l.assetId;
            rec.layers.push(n);
          }
          await DB.put('pages', rec);
          p.pageIds.push(rec.id);
        }
        await DB.put('projects', p);
        if (after) after();
        await this.openProject(p.id);
        for (let i = 0; i < p.pageIds.length; i++) { /* Vorschaubilder entstehen beim Öffnen der Seiten */ }
        toast('Projekt geladen.');
      } catch (e) { console.error(e); toast(e.message || 'Die Datei konnte nicht geladen werden.', true); }
      UI.busy(false);
    });
    fi.click();
  },

      { p: { floors: 3, cols: 3, roof: 'spitz', wall: '#3e5a7e', roofc: '#2e3f5c', light: 0.4 }, x: 0.6 },
      { p: { floors: 6, cols: 4, roof: 'flach', wall: '#4a5f86', light: 0.25 }, x: 0.72 },
      { p: { floors: 4, cols: 2, roof: 'walm', wall: '#38507a', roofc: '#2e3f5c', light: 0.3 }, x: 0.84 },
      { p: { floors: 7, cols: 3, roof: 'flach', wall: '#3e5a7e', light: 0.2 }, x: 0.94 },
    ];
    let seed = 40;
    const groundY = H - bleedPx() - 46 * u;
    for (const hs of houses) {
      const c = buildItem(hs.cat || 'haus', hs.p, seed += 17);
      const id = registerAsset(c);
      const L = newImageLayer(id, W * hs.x, groundY - c.height / 2 + (seed % 5) * u, c.width, c.height, hs.cat === 'kirche' ? 'Kirche' : 'Haus');
      ls.push(L);
    }
    // Mond
    const moon = buildItem('mond', { size: 1.6 }, 7);
    ls.push(newImageLayer(registerAsset(moon), W * 0.86, H * 0.2, moon.width, moon.height, 'Mond'));
    // Bettdecke als gerissenes Papier
    const blanket = [];
    for (let i = 0; i <= 40; i++) { const t = i / 40; blanket.push({ x: -10 * u + t * (W * 0.52), y: H - 60 * u + Math.sin(t * Math.PI * 3) * 10 * u }); }
    blanket.push({ x: W * 0.52, y: H + 10 * u }, { x: -10 * u, y: H + 10 * u });
    const keepColor = S.color, keepSrc = S.source.kind, keepEdge = S.opts.schnipsel.edge;
    S.color = '#fbf7ee'; S.source.kind = 'color'; S.opts.schnipsel.edge = 'gerissen';
    S.activeLayerId = ls[ls.length - 1].id;
    await makeSchnipsel(blanket, { noSwitch: true });
    S.color = keepColor; S.source.kind = keepSrc; S.opts.schnipsel.edge = keepEdge;
    const bl = selectedLayer(); if (bl) bl.name = 'Bettdecke';
    // Komma auf der Decke
    const k = buildItem('komma', { size: 34, kind: 'idle' });
    const kl = newImageLayer(registerAsset(k), W * 0.16, H - 62 * u, k.width, k.height, 'Katze Komma');
    layers().push(kl);
    // Text
    const t = newTextLayer(W * 0.75, H * 0.78, W * 0.2);
    t.text = 'Es ist Nacht in der Stadt.\nKomma liegt unter der Decke und kann nicht schlafen.\nWie viele Katzen wohl jetzt noch wach sind?';
    t.sizePt = 15; t.color = '#1d1a1a';
    layoutText(t);
    // Textfeld auf hellem Papier
    const note = [];
    const nx = W * 0.75, ny = H * 0.78, nw = W * 0.24, nh = t.h + 18 * u;
    note.push({ x: nx - nw / 2, y: ny - nh / 2 }, { x: nx + nw / 2, y: ny - nh / 2 }, { x: nx + nw / 2, y: ny + nh / 2 }, { x: nx - nw / 2, y: ny + nh / 2 });
    S.color = '#fbf7ee'; S.activeLayerId = kl.id;
    await makeSchnipsel(note, { noSwitch: true });
    S.color = keepColor;
    const nl = selectedLayer(); if (nl) { nl.name = 'Notizzettel'; nl.rot = -0.02; }
    layers().push(t);
    const top = layers().find((l) => l.type === 'paint' && l.name === 'Linien');
    if (top) { const i = layerIndex(top.id); layers().splice(i, 1); layers().push(top); S.activeLayerId = top.id; }
    const far = layers().find((l) => l.type === 'paint' && l.name === 'Farben');
    if (far) { const i = layerIndex(far.id); layers().splice(i, 1); layers().splice(1, 0, far); }
    S.selectedId = null;
    clearHistory();
    markDirty(true);
    await this.saveCurrent();
    UI.refreshLayers(); requestRender();
  },
};

/* ============================================================
   Ablage: eigene Materialien in Ordnern
   ============================================================ */
const DEFAULT_FOLDERS = ['Papier', 'Stoff', 'Tapete', 'Natur & Stadt', 'Himmel', 'Fotos', 'Figuren', 'Gebäude', 'Sonstiges'];
const Ablage = {
  async load() {
    Store.folders = (await DB.all('folders')).sort((a, b) => a.order - b.order);
    Store.materials = (await DB.all('materials')).sort((a, b) => a.created - b.created);
    if (!Store.folders.length) {
      Store.folders = DEFAULT_FOLDERS.map((n, i) => ({ id: uid('F'), name: n, order: i }));
      for (const f of Store.folders) await DB.put('folders', f);
    }
  },
  /* Startmaterialien im Hintergrund anlegen bzw. nachrüsten (neue Versionen bringen neue Texturen) */
  ensureStarter() {
    if (!this._starterP) this._starterP = this._ensureStarter().finally(() => { this._starterP = null; });
    return this._starterP;
  },
  async _ensureStarter() {
    const flag = await DB.get('settings', 'starter');
    const ver = flag ? (flag.value === true ? 1 : flag.value) : 0;
    if (ver >= STARTER_VERSION) return;
    await this.restoreStarter();
    await DB.put('settings', { key: 'starter', value: STARTER_VERSION });
    if (ver > 0) Komma.say('Neu in der Ablage: viele weitere Papiere, Stoffe, Tapeten und Himmel!', { mood: 'happy', time: 6000 });
  },
  folderId(name) {
    let f = Store.folders.find((x) => x.name === name);
    return f ? f.id : (Store.folders[0] && Store.folders[0].id);
  },
  async ensureFolder(name) {
    let f = Store.folders.find((x) => x.name === name);
    if (!f) { f = { id: uid('F'), name, order: Store.folders.length }; Store.folders.push(f); await DB.put('folders', f); }
    return f.id;
  },
  async restoreStarter() {
    const has = (name) => Store.materials.some((x) => x.builtin && x.name === name);
    const list = makeStarterMaterials();
    for (const m of list) { if (!has(m.name)) await this.addCanvas(m.canvas, m.name, m.folder, true); }
    for (const m of STARTER2) {
      if (has(m.name)) continue;
      try { await this.addCanvas(m.make(), m.name, m.folder, true); } catch (e) { console.warn(m.name, e); }
      await nextFrame();
    }
  },
  async addCanvas(c, name, folderName, builtin) {
    const id = uid('M');
    const folder = await this.ensureFolder(folderName || 'Sonstiges');
    const th = thumbOf(c, 160, 160);
    const rec = { id, name: name || 'Material', folder, thumb: th.toDataURL('image/png'), w: c.width, h: c.height, created: Date.now(), builtin: !!builtin };
    try {
      const blob = await canvasToStoreBlob(c);
      await DB.put('blobs', { key: 'm:' + id, blob });
      await DB.put('materials', rec);
      Store.materials.push(rec);
      if (!builtin) MatCache.map.set(id, c);
    } catch (e) { console.warn(e); Store.quotaWarn(e); }
    return rec;
  },
  async addFiles(files, folderId) {
    UI.busy(true);
    let n = 0;
    for (const f of files) {
      try {
        const c = await blobToCanvas(f, 2400);
        const folder = Store.folders.find((x) => x.id === folderId);
        await this.addCanvas(c, (f.name || 'Foto').replace(/\.[^.]+$/, '').slice(0, 40), folder ? folder.name : 'Fotos');
        n++;
      } catch (e) { toast('Nicht lesbar: ' + (f.name || 'Bild'), true); }
    }
    UI.busy(false);
    if (n) { Snd.play('save'); toast(n === 1 ? '1 Bild in der Ablage.' : n + ' Bilder in der Ablage.'); }
  },
  async remove(id) {
    await DB.del('materials', id);
    await DB.del('blobs', 'm:' + id);
    Store.materials = Store.materials.filter((m) => m.id !== id);
    MatCache.map.delete(id);
    if (S.source.materialId === id) S.source.materialId = null;

  async exportBackup() {

    try {
      const parts = ['{"app":"kommas-bilderbuch-werkstatt","type":"ablage","version":1,"folders":', JSON.stringify(Store.folders), ',"materials":['];
      let first = true;
      for (const m of Store.materials) {
        if (m.builtin) continue;
        const b = await DB.get('blobs', 'm:' + m.id);
        if (!b) continue;
        parts.push((first ? '' : ',') + JSON.stringify({ name: m.name, folder: (Store.folders.find((f) => f.id === m.folder) || {}).name || 'Sonstiges', data: await blobToDataURL(b.blob) }));
        first = false;
      }
      parts.push(']}');

/* ============================================================
   Export: Druck-PDF mit Beschnitt, Bildschirm-PDF, PNG, Projektdatei
   (eigener kleiner PDF-Schreiber, keine fremde Bibliothek)
   ============================================================ */
function utf16hex(s) {
  let out = 'FEFF';
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (c > 0xffff) { const v = c - 0x10000; out += (0xd800 + (v >> 10)).toString(16).padStart(4, '0') + (0xdc00 + (v & 0x3ff)).toString(16).padStart(4, '0'); }
    else out += c.toString(16).padStart(4, '0');
  }
  return '<' + out.toUpperCase() + '>';
}
function buildPDF(pages, title) {
  const enc = new TextEncoder();
  const chunks = [];
  let off = 0;
  const offsets = [];
  const push = (d) => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); off += b.length; };
  const f = (v) => v.toFixed(2);
  push('%PDF-1.4\n');
  push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const n = pages.length;
  const obj = (id, body) => { offsets[id] = off; push(`${id} 0 obj\n${body}\nendobj\n`); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, k) => `${4 + 3 * k} 0 R`).join(' ')}] /Count ${n} >>`);
  obj(3, `<< /Title ${utf16hex(title)} /Creator (Kommas Bilderbuch-Werkstatt) /Producer (Kommas Bilderbuch-Werkstatt) >>`);
  pages.forEach((p, k) => {
    const pid = 4 + 3 * k, cid = 5 + 3 * k, iid = 6 + 3 * k;
    const slug = p.marks ? 34 : 0; // 12 mm Rand für Schnittmarken
    const MW = p.wPt + 2 * slug, MH = p.hPt + 2 * slug, b = p.bleedPt;
    const trim = [slug + b, slug + b, MW - slug - b, MH - slug - b];
    const bleed = [slug, slug, MW - slug, MH - slug];
    let cs = `q ${f(p.wPt)} 0 0 ${f(p.hPt)} ${f(slug)} ${f(slug)} cm /Im0 Do Q\n`;
    if (p.marks) {
      const L = 14, gapM = b + 3;
      cs += '0 0 0 RG 0.3 w\n';
      const [x0, y0, x1, y1] = trim;
      const lines = [
        [x0 - gapM - L, y0, x0 - gapM, y0], [x0, y0 - gapM - L, x0, y0 - gapM],
        [x1 + gapM, y0, x1 + gapM + L, y0], [x1, y0 - gapM - L, x1, y0 - gapM],
        [x0 - gapM - L, y1, x0 - gapM, y1], [x0, y1 + gapM, x0, y1 + gapM + L],
        [x1 + gapM, y1, x1 + gapM + L, y1], [x1, y1 + gapM, x1, y1 + gapM + L],
      ];
      for (const [a, bb, c, d] of lines) cs += `${f(a)} ${f(bb)} m ${f(c)} ${f(d)} l S\n`;
    }
    obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(MW)} ${f(MH)}] /BleedBox [${bleed.map(f).join(' ')}] /TrimBox [${trim.map(f).join(' ')}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const content = enc.encode(cs);
    offsets[cid] = off; push(`${cid} 0 obj\n<< /Length ${content.length} >>\nstream\n`); push(content); push('\nendstream\nendobj\n');
    offsets[iid] = off; push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.pxW} /Height ${p.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`); push(p.jpeg); push('\nendstream\nendobj\n');
  });
  const total = 4 + 3 * n;
  const xref = off;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

const Export = {
  /* Seite mit allen Bildern laden, ohne die geöffnete Seite zu verlassen */
  async pageRuntime(i) {
    if (i === S.pageIndex) return { page: S.page, temp: [] };
    const rec = await DB.get('pages', S.project.pageIds[i]);
    const page = { bg: (rec && rec.bg) || '#ffffff', layers: [] };
    const temp = [];
    if (!rec) return { page, temp };
    for (const o of rec.layers) {
      const L = Object.assign({}, o);
      if (L.type === 'paint') {
        L.canvas = mkCanvas(docW(), docH());
        temp.push(L.canvas);
        const b = await DB.get('blobs', o.blobKey);
        if (b) { try { const img = await loadImageFromBlob(b.blob); L.canvas.getContext('2d').drawImage(img, 0, 0); } catch (e) { /* */ } }
      } else if (L.type === 'image') {
        const had = ASSETS.has(L.assetId);
        await ensureAsset(L.assetId);
        if (!had) temp.push({ asset: L.assetId });
        if (!assetCanvas(L.assetId)) continue;
      }
      page.layers.push(L);
    }
    return { page, temp };
  },
  releaseTemp(temp) {
    const keep = new Set(layers().filter((l) => l.type === 'image').map((l) => l.assetId));
    for (const t of temp) {
      if (t instanceof HTMLCanvasElement) freeCanvas(t);
      else if (t.asset && !keep.has(t.asset)) { const a = ASSETS.get(t.asset); if (a && a.stored) { freeCanvas(a.canvas); ASSETS.delete(t.asset); } }
    }
  },
  /* Ausschnitt in der gewünschten Auflösung; bleibt unter der Safari-Grenze */
  renderArea(page, rx, ry, rw, rh, targetDpi) {
    let s = targetDpi / dpi();
    let reduced = false;
    if (rw * s * rh * s > MAX_CANVAS_PX * 0.95) { s = Math.sqrt((MAX_CANVAS_PX * 0.95) / (rw * rh)); reduced = true; }
    const c = renderRegion(page.layers, rx, ry, rw, rh, s, page.bg || '#ffffff');
    return { c, dpiOut: Math.round(s * dpi()), reduced };
  },
  regions(kind) {
    const W = docW(), H = docH(), b = bleedPx();
    if (kind === 'print') {
      if (S.project.spread) return [{ x: 0, y: 0, w: W / 2 + b, h: H }, { x: W / 2 - b, y: 0, w: W / 2 + b, h: H }];
      return [{ x: 0, y: 0, w: W, h: H }];
    }
    return [{ x: b, y: b, w: W - 2 * b, h: H - 2 * b }];
  },
  async pdf(kind, range, marks, prog) {
    await Store.saveCurrent();
    const p = S.project;
    const idx = range === 'one' ? [S.pageIndex] : p.pageIds.map((_, i) => i);
    const regs = this.regions(kind);
    const targetDpi = kind === 'print' ? 300 : 150;
    const out = [];
    let reduced = false, minDpi = 999;
    const total = idx.length * regs.length;
    let done = 0;
    for (const i of idx) {
      const { page, temp } = await this.pageRuntime(i);
      for (const r of regs) {
        const { c, dpiOut, reduced: red } = this.renderArea(page, r.x, r.y, r.w, r.h, targetDpi);
        reduced = reduced || red; minDpi = Math.min(minDpi, dpiOut);
        const blob = await canvasToBlob(c, 'image/jpeg', kind === 'print' ? 0.92 : 0.85);
        const jpeg = new Uint8Array(await blobToArrayBuffer(blob));
        const ptPerPx = 72 / dpi();
        out.push({ jpeg, pxW: c.width, pxH: c.height, wPt: r.w * ptPerPx, hPt: r.h * ptPerPx, bleedPt: kind === 'print' ? (p.bleedMm * 72) / 25.4 : 0, marks: kind === 'print' && marks });
        freeCanvas(c);
        done++; prog(done / total);
        await nextFrame();
      }
      this.releaseTemp(temp);
    }
    const blob = buildPDF(out, p.name);
    const name = safeName(p.name) + (kind === 'print' ? '-druck.pdf' : '-bildschirm.pdf');
    const res = await saveFile(name, blob);
    return { res, reduced, minDpi, size: blob.size };
  },
  async png(scope, prog) {
    await Store.saveCurrent();
    const b = bleedPx();
    let c;
    if (scope === 'screen') {
      const r = { x: b, y: b, w: docW() - 2 * b, h: docH() - 2 * b };
      c = renderRegion(layers(), r.x, r.y, r.w, r.h, 2400 / r.w, S.page.bg || '#ffffff');
    } else {
      const r = scope === 'print-bleed' ? { x: 0, y: 0, w: docW(), h: docH() } : { x: b, y: b, w: docW() - 2 * b, h: docH() - 2 * b };
      c = this.renderArea(S.page, r.x, r.y, r.w, r.h, 300).c;
    }
    prog(0.6);
    const blob = await canvasToBlob(c, 'image/png');
    freeCanvas(c);
    prog(1);
    const n = S.project.spread ? `${S.pageIndex * 2 + 1}-${S.pageIndex * 2 + 2}` : `${S.pageIndex + 1}`;
    return saveFile(`${safeName(S.project.name)}-seite-${n}.png`, blob);
  },
  async objectPNG() {
    const L = selectedLayer();
    if (!L) return;
    let s = 1;
    if (L.type === 'image') { const src = assetCanvas(L.assetId); s = src ? src.width / L.w : 1; }
    else s = 300 / dpi();
    const cs = layerCorners(L);
    const bb = polyBounds(cs);
    s = Math.min(s, Math.sqrt((MAX_CANVAS_PX * 0.8) / (bb.w * bb.h)));
    const c = mkCanvas(bb.w * s, bb.h * s);
    const x = c.getContext('2d');
    x.setTransform(s, 0, 0, s, -bb.x * s, -bb.y * s);
    const keepShadow = L.shadow; L.shadow = false;
    drawLayer(x, L, s, { export: true });
    L.shadow = keepShadow;
    const blob = await canvasToBlob(c, 'image/png');
    freeCanvas(c);
    return saveFile(safeName(L.name || 'stueck') + '.png', blob);
  },
  async quickPNG() {
    Snd.play('shutter');
    try { const r = await this.png('screen', () => {}); if (r === 'saved') { toast('Bild gespeichert!'); Komma.say('Juhu, dein Bild ist gespeichert!', { mood: 'happy', time: 2500 }); } }
    catch (e) { toast('Das Bild konnte nicht gespeichert werden.', true); }
  },
  open() {
    const p = S.project;
    const hasBleed = p.bleedMm > 0;
    let choice = 'print', range = 'all', marks = false, pngScope = 'screen';
    const bar = h('div', { class: 'progress', hidden: true }, h('div'));
    const status = h('p', { class: 'note' });
    const nPages = p.pageIds.length * (p.spread ? 2 : 1);
    const opt = (id, title, desc) => {
      const inp = h('input', { type: 'radio', name: 'exp', value: id, id: 'exp-' + id });
      if (id === choice) inp.checked = true;
      inp.addEventListener('change', () => { choice = id; refresh(); });
      return h('label', { class: 'opt', for: 'exp-' + id }, inp, h('b', null, title), h('span', null, desc));
    };
    const extra = h('div', { class: 'sec' });
    const refresh = () => {
      extra.innerHTML = '';
      if (choice === 'print' || choice === 'screen') {
        extra.append(segRow([['all', `Ganzes Buch (${p.pageIds.length} ${p.spread ? 'Doppelseiten' : 'Seiten'})`], ['one', 'Nur diese Seite']], range, (v) => { range = v; refresh(); }, 'Umfang'));
        if (choice === 'print' && hasBleed) extra.append(checkRow('Schnittmarken hinzufügen', marks, (v) => { marks = v; }, 'exp-marks'));
      }
      if (choice === 'png') extra.append(segRow([['screen', 'Bildschirm (2400 px)'], ['print', 'Druck 300 dpi'], ['print-bleed', 'Druck mit Beschnitt']], pngScope, (v) => { pngScope = v; refresh(); }, 'Größe'));
    };
    refresh();
    const sel = selectedLayer();
    const choices = h('div', { class: 'choice' },
      opt('print', hasBleed ? 'Druck-PDF mit Beschnitt' : 'Druck-PDF', p.spread
        ? `Jede Seite einzeln, 300 dpi${hasBleed ? ', 3 mm Beschnitt rundherum' : ''} – so wie Druckereien es wünschen. Das sind ${nPages} PDF-Seiten.`
        : `Jede Seite in 300 dpi${hasBleed ? ' mit 3 mm Beschnitt rundherum' : ''}.`),
      opt('screen', 'PDF für den Bildschirm', p.spread ? 'Doppelseiten nebeneinander, 150 dpi, ohne Beschnitt. Kleinere Datei.' : 'Seiten in 150 dpi, ohne Beschnitt. Kleinere Datei.'),
      opt('png', 'Diese Seite als Bild (PNG)', 'Zum Einfügen in Arbeitsblätter oder Präsentationen.'),
      sel ? opt('obj', 'Gewähltes Stück als PNG', 'Mit durchsichtigem Hintergrund, z. B. eine Figur zum Wiederverwenden.') : null,
      opt('json', 'Projektdatei sichern', 'Das ganze Buch zum Weiterarbeiten auf einem anderen Gerät oder als Sicherung.'));
    const go = h('button', { class: 'key primary', type: 'button' }, 'Exportieren');
    const d = openDialog({
      title: 'Drucken & Export', cls: 'mid',
      body: h('div', { class: 'sec' }, choices, extra, bar, status,
        h('p', { class: 'note' }, 'Farben werden als RGB gespeichert; Druckereien wandeln sie selbst um. Für ein gebundenes Buch fragt die Druckerei oft nach einer durch 4 teilbaren Seitenzahl.')),
      foot: [keyBtn('Projektdatei laden', 'mappe', () => { d.close(); Store.importProjectFile(); }), h('div', { style: { flex: 1 } }), h('button', { class: 'key', type: 'button', onclick: () => d.close() }, 'Schließen'), go],
    });
    go.addEventListener('click', async () => {
      go.disabled = true;
      bar.hidden = false;
      const prog = (v) => { bar.firstChild.style.width = Math.round(v * 100) + '%'; };
      prog(0.02);
      status.textContent = 'Komma rechnet …';
      try {
        if (choice === 'print' || choice === 'screen') {
          const r = await this.pdf(choice, range, marks, prog);
          status.textContent = r.res === 'declined' ? 'Abgebrochen.' : `Fertig: PDF mit ${(r.size / 1e6).toFixed(1).replace('.', ',')} MB.` + (r.reduced ? ` Hinweis: Wegen der Gerätegrenze mit ${r.minDpi} dpi gerechnet.` : '');
        } else if (choice === 'png') { await this.png(pngScope, prog); status.textContent = 'Fertig.'; }
        else if (choice === 'obj') { await this.objectPNG(); prog(1); status.textContent = 'Fertig.'; }
        else if (choice === 'json') { prog(0.3); await Store.exportProjectFile(); prog(1); status.textContent = 'Fertig.'; }
        Snd.play('save');
      } catch (e) { console.error(e); status.textContent = 'Das hat nicht geklappt: ' + (e.message || e.code || 'unbekannter Fehler'); Snd.play('error'); }
      go.disabled = false;
    });
  },
};

/* ============================================================
   Baukasten-Fenster
   ============================================================ */
const Builder = {
  cat: 'haus', params: {}, seed: 1234, canvas: null, timer: null,
  open() {
    this.params = Object.assign({}, BUILD[this.cat].defaults, this.params[this.cat] ? this.params[this.cat] : {});
    const cats = h('div', { class: 'bcats' });
    const prev = h('div', { class: 'bprev' });
    const opts = h('div', { class: 'bopts' });
    const drawCats = () => {
      cats.innerHTML = '';
      for (const k in BUILD) {
        const b = h('button', { type: 'button', class: 'folder' + (k === this.cat ? ' on' : '') }, BUILD[k].name);
        b.addEventListener('click', () => { this.cat = k; this.params = Object.assign({}, BUILD[k].defaults); this.seed = (Math.random() * 1e6) | 0; Snd.play('click'); drawCats(); drawOpts(); render(); });
        cats.append(b);
      }
    };
    const render = () => {
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        freeCanvas(this.canvas);
        this.canvas = buildItem(this.cat, this.params, this.seed);
        const show = thumbOf(this.canvas, 560, 420);
        show.style.cssText = 'max-width:100%;height:auto';
        prev.innerHTML = '';
        prev.append(show);
      }, 90);
    };
    const drawOpts = () => {
      opts.innerHTML = '';
      const def = BUILD[this.cat];
      if (def.presets) {
        const row = h('div', { class: 'seg' });
        for (const pr of def.presets) row.append(h('button', { class: 'key', type: 'button', onclick: () => { Object.assign(this.params, pr.p); Snd.play('click'); drawOpts(); render(); } }, pr.name));
        opts.append(sec('Vorlagen', row));
      }
      for (const o of def.opts) {
        const v = this.params[o.key];
        if (o.type === 'range') opts.append(sliderRow(o.label, v, o.min, o.max, o.step, (nv) => { this.params[o.key] = nv; render(); }, o.fmt, 'b-' + o.key));
        else if (o.type === 'seg') opts.append(sec(o.label, segRow(o.options, v, (nv) => { this.params[o.key] = nv; drawOpts(); render(); }, o.label)));
        else if (o.type === 'check') opts.append(checkRow(o.label, v, (nv) => { this.params[o.key] = nv; render(); }, 'b-' + o.key));
        else if (o.type === 'color') {
          const row = h('div', { class: 'seg' });
          for (const c of o.colors) {
            const b = h('button', { class: 'sw' + (c === v ? ' on' : ''), type: 'button', style: { background: c, width: '30px', height: '30px' }, 'aria-label': o.label + ' ' + c });
            b.addEventListener('click', () => { this.params[o.key] = c; Snd.play('click'); drawOpts(); render(); });
            row.append(b);
          }
          const ci = h('input', { type: 'color', value: v, 'aria-label': o.label + ': eigene Farbe', style: { width: '34px', height: '30px', border: '2px solid var(--line)', padding: 0 } });
          ci.addEventListener('input', () => { this.params[o.key] = ci.value; render(); });
          row.append(ci);
          opts.append(sec(o.label, row));
        }
      }
    };
    drawCats(); drawOpts(); render();
    const d = openDialog({
      title: 'Baukasten', cls: 'wide',
      body: h('div', { class: 'sec' },
        h('div', { class: 'builder' }, cats, prev, opts),
        h('p', { class: 'note' }, 'Alle Teile haben echte Größen in Millimetern. So passen Fenster und Türen verschiedener Häuser zusammen.')),
      foot: [
        keyBtn('Neu würfeln', 'star', () => { this.seed = (Math.random() * 1e6) | 0; render(); }),
        keyBtn('In die Ablage', 'ablage', async () => { if (!this.canvas) return; await Ablage.addCanvas(cloneCanvas(this.canvas), BUILD[this.cat].name, 'Gebäude'); toast('In der Ablage unter „Gebäude".'); Snd.play('save'); }),
        h('div', { style: { flex: 1 } }),
        h('button', { class: 'key', type: 'button', onclick: () => d.close() }, 'Schließen'),
        h('button', { class: 'key primary', type: 'button', onclick: () => {
          if (!this.canvas) return;
          const c = cloneCanvas(this.canvas);
          d.close();
          placeCanvasAsLayer(c, BUILD[this.cat].name, 0, { native: true, fit: 0.9 });
          Snd.play('pop');
          setTool('select', true);
          this.seed = (Math.random() * 1e6) | 0;
        } }, 'Ins Bild setzen'),
      ],
    });
  },
};

  gate() {

      e.preventDefault();
      start = performance.now();
      clearInterval(t);
