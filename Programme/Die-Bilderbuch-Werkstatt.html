/* Explosion über dem Blatt */
function boomFx() {
  const wrap = $('#stagewrap');
  const r = wrap.getBoundingClientRect();
  const c = mkCanvas(r.width, r.height);
  c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;image-rendering:pixelated';
  wrap.append(c);
  const x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctr = docToScreen(docW() / 2, docH() / 2), cx = ctr.x, cy = ctr.y;
  const cols = ['#f6d64a', '#e8913a', '#d8452f', '#ffffff', '#3a2e2a', '#f2a7b8'];
  const parts = reduce ? [] : Array.from({ length: 140 }, () => { const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 11; return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, s: 4 + Math.floor(Math.random() * 3) * 4, c: cols[Math.floor(Math.random() * cols.length)] }; });
  const word = pxText('BUMM!', 10, '#d8452f', '#3a2e2a');
  const t0 = performance.now();
  const step = () => {
    const t = (performance.now() - t0) / 900;
    x.clearRect(0, 0, c.width, c.height);
    if (t < 0.25) { x.fillStyle = `rgba(255,250,230,${0.85 * (1 - t / 0.25)})`; x.fillRect(0, 0, c.width, c.height); }
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.35; x.fillStyle = p.c; x.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s); }
    if (!reduce && t < 0.8) { const sc = 0.5 + Math.min(1, t * 4) * 0.6; x.drawImage(word, cx - (word.width * sc) / 2, cy - (word.height * sc) / 2, word.width * sc, word.height * sc); }
    if (t < 1) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
  if (!reduce) { wrap.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-6px,4px)' }, { transform: 'translate(5px,-3px)' }, { transform: 'translate(0,0)' }], { duration: 300 }); }
}

/* ============================================================
   Referenzbild-Fenster: schwebt über dem Blatt, zum Abzeichnen
   ============================================================ */
const RefWin = {
  el: null, cv: null, img: null, name: '', v: { s: 1, x: 0, y: 0 }, ptrs: new Map(), pinch: null, hold: null,
  toggle() { if (this.el && !this.el.hidden) this.close(); else this.open(); },
  open(img, name) {
    if (!this.el) this.build();
    if (img) { this.img = img; this.name = name || 'Referenz'; this.v = { s: 1, x: 0, y: 0 }; }
    this.el.hidden = false;
    this.layout();
    this.draw();
    Komma.tipOnce('refwin', 'Das Referenzfenster schwebt über dem Blatt. Oben ziehen = verschieben, Ecke unten rechts = Größe, im Bild zoomen und schieben. Mit der Pipette (oder gedrückt halten) nimmst du Farben aus dem Bild.');
  },
  close() { if (this.el) this.el.hidden = true; },
  async fromMaterial(id) {
    const m = Store.materials.find((x) => x.id === id);
    const c = await MatCache.load(id);
    if (c) this.open(c, m ? m.name : 'Referenz');
  },
  build() {
    const pos = Object.assign({ x: 24, y: 70, w: 300, h: 240 }, S.settings.refwin || {});
    const title = h('div', { class: 'rw-title' }, h('span', null, 'Referenz'));
    const fk = fileKey('', 'foto', 'Bild aus Datei oder Kamera', async (files) => {
      try { const c = await blobToCanvas(files[0], 2400); this.open(c, files[0].name || 'Foto'); } catch (e) { toast('Das Bild konnte nicht gelesen werden.', true); }
    }, 'icon');
    const bar = h('div', { class: 'rw-bar' }, title,
      keyBtn('', 'ablage', () => Ablage.open({ forRef: true }), 'icon', 'Bild aus der Ablage'), fk,
      keyBtn('', 'close', () => this.close(), 'icon', 'Referenzfenster schließen'));
    this.cv = h('canvas', { class: 'rw-cv', 'aria-label': 'Referenzbild' });
    const empty = h('div', { class: 'rw-empty' }, 'Wähle ein Bild aus der Ablage oder eine Datei.');
    const grip = h('div', { class: 'rw-grip', 'aria-hidden': 'true' });
    this.el = h('div', { class: 'win refwin', hidden: true, style: { left: pos.x + 'px', top: pos.y + 'px', width: pos.w + 'px', height: pos.h + 'px' } }, bar, h('div', { class: 'rw-body' }, this.cv, empty), grip);
    this.empty = empty;
    $('#stagewrap').append(this.el);
    // Fenster verschieben
    this.dragBy(title, (dx, dy, o) => { this.el.style.left = clamp(o.x + dx, 0, R.w - 80) + 'px'; this.el.style.top = clamp(o.y + dy, 0, R.h - 40) + 'px'; });
    // Größe ändern
    this.dragBy(grip, (dx, dy, o) => { this.el.style.width = clamp(o.w + dx, 180, R.w - 10) + 'px'; this.el.style.height = clamp(o.h + dy, 150, R.h - 10) + 'px'; this.layout(); this.draw(); });
    // Bild zoomen, schieben, Farbe aufnehmen
    const cv = this.cv;
    cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(); this.zoom(Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (S.tool === 'pipette' || e.altKey) { this.pick(e); if (S.prevTool && S.tool === 'pipette') setTool(S.prevTool, true); return; }
      if (this.ptrs.size === 2) { const p = [...this.ptrs.values()]; this.pinch = { d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, s0: this.v.s }; clearTimeout(this.hold); return; }
      this.panStart = { x: e.clientX, y: e.clientY, vx: this.v.x, vy: this.v.y, moved: 0 };
      clearTimeout(this.hold);
      this.hold = setTimeout(() => { if (this.panStart && this.panStart.moved < 6) { this.pick(e); this.panStart = null; } }, 550);
    });
    cv.addEventListener('pointermove', (e) => {
      if (!this.ptrs.has(e.pointerId)) return;
      this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pinch && this.ptrs.size >= 2) {
        const p = [...this.ptrs.values()]; const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
        const r = cv.getBoundingClientRect();
        this.zoom((this.pinch.s0 * d / this.pinch.d0) / this.v.s, (p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top);
        return;
      }
      const ps = this.panStart; if (!ps) return;
      ps.moved = Math.max(ps.moved, Math.hypot(e.clientX - ps.x, e.clientY - ps.y));
      this.v.x = ps.vx + (e.clientX - ps.x); this.v.y = ps.vy + (e.clientY - ps.y);
      this.draw();
    });
    const up = (e) => { this.ptrs.delete(e.pointerId); if (this.ptrs.size < 2) this.pinch = null; if (!this.ptrs.size) { this.panStart = null; clearTimeout(this.hold); } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('dblclick', () => { this.v = { s: 1, x: 0, y: 0 }; this.draw(); });
  },
  dragBy(handle, fn) {
    handle.style.touchAction = 'none';
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, label')) return;
      e.preventDefault(); e.stopPropagation();
      const o = { x: this.el.offsetLeft, y: this.el.offsetTop, w: this.el.offsetWidth, h: this.el.offsetHeight }, sx = e.clientX, sy = e.clientY;
      try { handle.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      const mv = (ev) => fn(ev.clientX - sx, ev.clientY - sy, o);
      const end = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', end); handle.removeEventListener('pointercancel', end); this.savePos(); };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
    });
  },
  savePos() { S.settings.refwin = { x: this.el.offsetLeft, y: this.el.offsetTop, w: this.el.offsetWidth, h: this.el.offsetHeight }; Store.saveSettings(); },
  layout() {
    const b = this.cv.parentElement.getBoundingClientRect();
    const d = Math.min(2, window.devicePixelRatio || 1);
    this.cv.width = Math.max(10, Math.round(b.width * d)); this.cv.height = Math.max(10, Math.round(b.height * d));
    this.dpr = d;
  },
  base() {
    const W = this.cv.width / this.dpr, H = this.cv.height / this.dpr, im = this.img;
    const f = Math.min(W / im.width, H / im.height);
    return { W, H, f };
  },
  zoom(k, sx, sy) {
    if (!this.img) return;
    const ns = clamp(this.v.s * k, 0.5, 16);
    const { W, H } = this.base();
    const cx = W / 2 + this.v.x, cy = H / 2 + this.v.y;
    this.v.x += (sx - cx) * (1 - ns / this.v.s); this.v.y += (sy - cy) * (1 - ns / this.v.s);
    this.v.s = ns;
    this.draw();
  },
  draw() {
    if (!this.cv) return;
    this.empty.hidden = !!this.img;
    const x = this.cv.getContext('2d');
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, this.cv.width, this.cv.height);
    if (!this.img) return;
    const { W, H, f } = this.base();
    const s = f * this.v.s;
    x.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    x.imageSmoothingQuality = 'high';
    x.drawImage(this.img, W / 2 + this.v.x - (this.img.width * s) / 2, H / 2 + this.v.y - (this.img.height * s) / 2, this.img.width * s, this.img.height * s);
  },
  pick(e) {
    if (!this.img) return;
    const r = this.cv.getBoundingClientRect();
    const px = Math.round((e.clientX - r.left) * this.dpr), py = Math.round((e.clientY - r.top) * this.dpr);
    const d = this.cv.getContext('2d').getImageData(px, py, 1, 1).data;
    if (d[3] < 10) return;
    setColor(rgbToHex(d[0], d[1], d[2]));
    Snd.play('click');
    toast('Farbe aus der Referenz übernommen.');
  },
};

/* ============================================================
   Zeitraffer: jede Änderung wird klein mitgeschnitten,
   abspielbar mit Musik und als Video speicherbar
   ============================================================ */
const TL = {
  pageId: null, frames: [], timer: null, saveT: null, busy: false, max: 720,
  async load(pageId) {
    await this.flush();
    this.pageId = pageId;
    this.frames = [];
    try { const rec = await DB.get('blobs', 'tl:' + pageId); if (rec && rec.frames) this.frames = rec.frames.slice(); } catch (e) { /* */ }
  },
  schedule() {
    if (!S.page || S.page.id !== this.pageId) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.capture(), 700);
  },
  frameSize() { const b = bleedPx(); return { x: b, y: b, w: docW() - 2 * b, h: docH() - 2 * b }; },
  async capture() {
    if (this.busy || !S.page || S.page.id !== this.pageId || Brush.active() || Ptr.mode) { if (!this.busy) this.schedule(); return; }
    this.busy = true;
    try {
      const r = this.frameSize();
      const sc = 960 / r.w;
      if (!this.frames.length) {
        // erstes Bild: leeres Blatt, damit der Film am Anfang beginnt
        const e = mkCanvas(r.w * sc, r.h * sc); const ex = e.getContext('2d'); ex.fillStyle = S.page.bg || '#ffffff'; ex.fillRect(0, 0, e.width, e.height);
        this.frames.push(await canvasToBlob(e, 'image/jpeg', 0.72)); freeCanvas(e);
      }
      const c = renderRegion(layers().filter((l) => !l.template), r.x, r.y, r.w, r.h, sc, S.page.bg || '#ffffff');
      const blob = await canvasToBlob(c, 'image/jpeg', 0.72);
      freeCanvas(c);
      this.frames.push(blob);
      if (this.frames.length > this.max) this.frames = this.frames.filter((f, i) => i % 2 === 0 || i === this.frames.length - 1);
      clearTimeout(this.saveT);
      this.saveT = setTimeout(() => this.flush(), 2500);
    } catch (e) { console.warn(e); }
    this.busy = false;
  },
  async flush() {
    clearTimeout(this.saveT);
    if (!this.pageId) return;
    try { await DB.put('blobs', { key: 'tl:' + this.pageId, frames: this.frames }); } catch (e) { /* Speicher voll: Zeitraffer ist nicht wichtig */ }
  },
  async clear() { this.frames = []; await this.flush(); },

  /* ---------- Abspielen ---------- */
  async open() {
    await this.capture();
    const n = this.frames.length;
    if (n < 2) { Komma.say('Für einen Zeitraffer brauche ich noch ein paar Malschritte. Mal weiter – ich filme mit!', { mood: 'wow' }); return; }
    const r = this.frameSize();
    const cv = mkCanvas(960, Math.round((960 * r.h) / r.w));
    cv.style.cssText = 'width:100%;height:auto;border:2px solid var(--line);background:#fff;display:block';
    const x = cv.getContext('2d');
    let i = 0, playing = true, speed = 1, raf = null, last = 0, music = true;
    const imgs = new Map();
    const getImg = async (k) => { if (imgs.has(k)) return imgs.get(k); const im = await loadImageFromBlob(this.frames[k]); imgs.set(k, im); if (imgs.size > 40) imgs.delete(imgs.keys().next().value); return im; };
    const bar = h('input', { type: 'range', min: 0, max: n - 1, value: 0, id: 'tl-pos', 'aria-label': 'Position im Zeitraffer' });
    const info = h('span', { class: 'note', style: { fontVariantNumeric: 'tabular-nums' } }, '');
    const show = async (k) => { const im = await getImg(k); x.drawImage(im, 0, 0, cv.width, cv.height); bar.value = k; info.textContent = `${k + 1} / ${n}`; };
    const tick = async (t) => {
      if (!playing) return;
      if (t - last > 90 / speed) { last = t; await show(i); i++; if (i >= n) { i = n - 1; playing = false; playBtn.textContent = 'Nochmal'; Snd.stopMelody(); } }
      raf = requestAnimationFrame(tick);
    };
    const playBtn = h('button', { class: 'key primary', type: 'button' }, 'Pause');
    playBtn.addEventListener('click', () => {
      Snd.play('click');
      if (playing) { playing = false; playBtn.textContent = 'Abspielen'; Snd.stopMelody(); return; }
      if (i >= n - 1) i = 0;
      playing = true; playBtn.textContent = 'Pause'; if (music) Snd.startMelody(); raf = requestAnimationFrame(tick);
    });
    bar.addEventListener('input', () => { i = parseInt(bar.value, 10); show(i); });
    const videoBtn = h('button', { class: 'key', type: 'button' }, 'Als Video speichern');
    const status = h('p', { class: 'note' });
    videoBtn.addEventListener('click', async () => {
      playing = false; Snd.stopMelody(); playBtn.textContent = 'Abspielen';
      videoBtn.disabled = true;
      try { const res = await this.video(music, (p) => { status.textContent = `Video wird erstellt … ${Math.round(p * 100)} %`; }); status.textContent = res; }
      catch (e) { console.error(e); status.textContent = 'Das Video konnte nicht erstellt werden: ' + (e.message || e); }
      videoBtn.disabled = false;
    });
    const d = openDialog({
      title: 'Zeitraffer', cls: 'mid',
      body: h('div', { class: 'sec' }, cv,
        h('div', { class: 'row' }, playBtn, segRow([[1, '1×'], [2, '2×'], [4, '4×']], 1, (v) => { speed = v; $$('.seg .key', segWrap).forEach((b) => b.classList.toggle('on', b.textContent === v + '×')); }, 'Tempo'), checkRow('Musik', music, (v) => { music = v; if (!v) Snd.stopMelody(); else if (playing) Snd.startMelody(); }, 'tl-music'), info),
        bar, status,
        S.mode === 'kids' ? null : h('p', { class: 'note' }, 'Der Zeitraffer entsteht automatisch für jede Seite und bleibt nur in diesem Browser.')),
      foot: [S.mode === 'kids' ? null : keyBtn('Zeitraffer löschen', 'trash', async () => { if (await confirmDialog('Den Zeitraffer dieser Seite löschen? Dein Bild bleibt erhalten.', 'Löschen', true)) { await this.clear(); d.close(); } }, 'danger'), h('div', { style: { flex: 1 } }), videoBtn, h('button', { class: 'key', type: 'button', onclick: () => d.close() }, 'Schließen')].filter(Boolean),
      onClose: () => { playing = false; cancelAnimationFrame(raf); Snd.stopMelody(); },
    });
    const segWrap = d.el;
    if (music) Snd.startMelody();
    raf = requestAnimationFrame(tick);
  },
  async video(withMusic, prog) {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error('Dieser Browser kann keine Videos aufnehmen.');
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mime = types.find((t) => MediaRecorder.isTypeSupported(t));
    if (!mime) throw new Error('Kein passendes Videoformat verfügbar.');
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const r = this.frameSize();
    const cv = mkCanvas(960, Math.round((960 * r.h) / r.w) & ~1);
    const x = cv.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);
    const stream = cv.captureStream(30);
    let dest = null;
    if (withMusic) { Snd.init(); if (Snd.ctx) { dest = Snd.ctx.createMediaStreamDestination(); dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t)); } }
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4000000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise((res) => { rec.onstop = res; });
    rec.start(250);
    if (dest) Snd.startMelody(dest);
    const n = this.frames.length;
    const per = Math.max(50, Math.min(140, 9000 / n)); // Film dauert höchstens etwa 9 bis 20 Sekunden
    for (let k = 0; k < n; k++) {
      const im = await loadImageFromBlob(this.frames[k]);
      x.drawImage(im, 0, 0, cv.width, cv.height);
      prog(k / n);
      await sleep(per);
    }
    // Abspann mit Katze Komma
    const k2 = kommaCanvas(6, 'happy');
    x.fillStyle = 'rgba(251,245,234,.92)'; x.fillRect(0, cv.height - 170, cv.width, 170);
    x.imageSmoothingEnabled = false;
    x.drawImage(k2, 30, cv.height - 160, k2.width, k2.height);
    const t1 = pxText(S.project.name.slice(0, 34), 3, '#3a2e2a');
    x.drawImage(t1, 190, cv.height - 120);
    const t2 = pxText('Kommas Bilderbuch-Werkstatt', 2, '#8d6440');
    x.drawImage(t2, 190, cv.height - 70);
    await sleep(2200);
    if (dest) Snd.stopMelody();
    rec.stop();
    await done;
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const res = await saveFile(`${safeName(S.project.name)}-zeitraffer.${ext}`, blob);
    return res === 'declined' ? 'Abgebrochen.' : `Fertig: Video (${ext.toUpperCase()}, ${(blob.size / 1e6).toFixed(1).replace('.', ',')} MB).`;
  },
};

/* ============================================================
   Perspektiv-Hilfslinien mit 1 oder 2 Fluchtpunkten
   und „Einrasten" für gerade Häuserkanten
   ============================================================ */
const Persp = {
  get() { return S.page && S.page.persp; },
  set(n) {
    const pg = S.page; if (!pg) return;
    if (!n) { if (pg.persp) pg.persp.on = false; }
    else {
      const W = docW(), H = docH();
      const old = pg.persp || {};
      const hy = old.hy != null ? old.hy : H * 0.42;
      let vps = old.vps;
      if (!vps || vps.length !== n) vps = n === 1 ? [{ x: W / 2, y: hy }] : [{ x: W * 0.12, y: hy }, { x: W * 0.88, y: hy }];
      pg.persp = { on: true, n, hy, vps, assist: old.assist != null ? old.assist : true };
      Komma.tipOnce('persp', 'Perspektive: Die runden Fluchtpunkte kannst du verschieben. Mit „Striche einrasten" laufen Linien automatisch senkrecht, waagerecht oder zum Fluchtpunkt.');
    }
    markDirty(true); requestRender(); UI.refreshProps();
  },
  active() { const p = this.get(); return !!(p && p.on && S.mode !== 'kids'); },
  /* Fluchtpunkt unter dem Finger? */
  hit(sx, sy) {
    if (!this.active()) return -1;
    const p = this.get();
    for (let i = 0; i < p.vps.length; i++) { const s = docToScreen(p.vps[i].x, p.vps[i].y); if (Math.hypot(s.x - sx, s.y - sy) < 18) return i; }
    return -1;
  },
  drag(i, d) {
    const p = this.get();
    p.vps[i].x = d.x; p.vps[i].y = d.y;
    p.hy = d.y;
    for (const v of p.vps) v.y = d.y; // gemeinsamer Horizont
    requestRender();
  },
  /* Richtung für das Einrasten wählen: senkrecht, waagerecht oder zu einem Fluchtpunkt */
  chooseDir(start, cur) {
    const p = this.get();
    const mx = cur.x - start.x, my = cur.y - start.y, ml = Math.hypot(mx, my) || 1;
    const cands = [{ x: 0, y: 1 }];
    if (p.n === 1) cands.push({ x: 1, y: 0 });
    for (const v of p.vps) { const dx = v.x - start.x, dy = v.y - start.y, l = Math.hypot(dx, dy); if (l > 1) cands.push({ x: dx / l, y: dy / l }); }
    let best = cands[0], bd = -1;
    for (const c of cands) { const d = Math.abs((mx * c.x + my * c.y) / ml); if (d > bd) { bd = d; best = c; } }
    return best;
  },
  project(start, dir, q) { const t = (q.x - start.x) * dir.x + (q.y - start.y) * dir.y; return { x: start.x + dir.x * t, y: start.y + dir.y * t }; },
};
function drawPerspective(ctx, s) {
  const p = Persp.get();
  if (!p || !p.on || S.mode === 'kids') return;
  const W = docW(), H = docH(), px = 1 / s;
  ctx.save();
  // Hilfslinien nur auf dem Blatt (Fluchtpunkte dürfen auch daneben liegen)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.lineWidth = px;
  ctx.strokeStyle = 'rgba(63,143,138,.42)';
  ctx.setLineDash([]);
  for (const v of p.vps) {
    const n = 28;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(v.x, v.y); ctx.lineTo(v.x + Math.cos(a) * W * 2, v.y + Math.sin(a) * W * 2); ctx.stroke();
    }
  }
  if (p.n === 1) {
    ctx.strokeStyle = 'rgba(63,143,138,.25)';
    for (let x = 0; x <= W; x += W / 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  }
  ctx.strokeStyle = 'rgba(200,67,47,.7)'; ctx.lineWidth = 2 * px; ctx.setLineDash([10 * px, 6 * px]);
  ctx.beginPath(); ctx.moveTo(0, p.hy); ctx.lineTo(W, p.hy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  for (const v of p.vps) {
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#3f8f8a'; ctx.lineWidth = 3 * px;
    ctx.beginPath(); ctx.arc(v.x, v.y, 11 * px, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3f8f8a'; ctx.beginPath(); ctx.arc(v.x, v.y, 4 * px, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   Seitenvorlagen: fertige Hintergründe zum Weiterbauen
   Alles besteht aus normalen Collage-Stücken – frei verschieb- und löschbar.
   ============================================================ */
async function matCanvasByName(name) {
  const m = Store.materials.find((x) => x.builtin && x.name === name);
  if (m) { const c = await MatCache.load(m.id); if (c) return c; }
  const all = STARTER2.concat(makeStarterMaterials().map((q) => ({ name: q.name, make: () => q.canvas })));
  const def = all.find((q) => q.name === name);
  return def ? def.make() : null;
}
/* Fläche mit Material füllen und mit (gerissener) Kante als Stück anlegen. pts in Dokumentpixeln. */
async function texturedPiece(pts, matName, name, o = {}) {
  const mat = await matCanvasByName(matName);
  const bb = polyBounds(pts);
  const sc = Math.min(1, 2600 / Math.max(bb.w, bb.h));
  const mmPx = mm2px(1) * sc;
  const lp = pts.map((p) => ({ x: (p.x - bb.x) * sc, y: (p.y - bb.y) * sc }));
  const edge = o.edge || 'glatt';
  const { inner, fringe } = edge === 'glatt' ? { inner: lp, fringe: null } : edgePaths(lp, edge, mmPx, (Math.random() * 1e6) | 0);
  const m = Math.ceil(mmPx * 3);
  const c = mkCanvas(bb.w * sc + 2 * m, bb.h * sc + 2 * m);
  const x = c.getContext('2d');
  x.translate(m, m);
  if (fringe) { pathPoly(x, fringe); x.fillStyle = PAPER_EDGE; x.fill(); }
  x.save(); pathPoly(x, inner); x.clip();
  if (mat) {
    const s2 = o.stretch ? Math.max((bb.w * sc + 2 * m) / mat.width, (bb.h * sc + 2 * m) / mat.height) : (mm2px(o.tileMm || 70) * sc) / mat.width;
    x.save(); x.translate(-m, -m); x.scale(s2, s2);
    if (o.stretch) x.drawImage(mat, 0, 0);
    else { x.fillStyle = x.createPattern(mat, 'repeat'); x.fillRect(0, 0, c.width / s2, c.height / s2); }
    x.restore();
  } else { x.fillStyle = o.color || '#ccc'; x.fillRect(-m, -m, c.width, c.height); }
  x.restore();
  const id = registerAsset(c);
  const L = newImageLayer(id, bb.x + (bb.w * sc + 2 * m) / sc / 2 - m / sc, bb.y + (bb.h * sc + 2 * m) / sc / 2 - m / sc, c.width / sc, c.height / sc, name);
  L.shadow = !!o.shadow;
  if (o.bg) { L.locked = true; L.name = name + ' (Hintergrund)'; }
  return L;
}
function builderPiece(cat, params, cx, baseY, name, scale = 1) {
  const c = buildItem(cat, params);
  const id = registerAsset(c);
  const w = c.width * scale, hh = c.height * scale;
  return newImageLayer(id, cx, baseY - hh / 2, w, hh, name || BUILD[cat].name);
}
function textPlaceholder(cx, cy, w, txt) {
  const t = newTextLayer(cx, cy, w);
  t.text = txt; t.sizePt = 16; t.color = '#1d1a1a';
  layoutText(t);
  return t;
}
function wavy(x0, x1, y, amp, waves, below) {
  const pts = [];
  for (let i = 0; i <= 60; i++) { const t = i / 60; pts.push({ x: x0 + (x1 - x0) * t, y: y - Math.sin(t * Math.PI * waves) * amp }); }
  pts.push({ x: x1, y: below }, { x: x0, y: below });
  return pts;
}

/* ============================================================
   Wischfinger: verschmiert oder verwischt Farbe (wie in Procreate)
   – findet selbst die Ebene unter dem Finger (Malebene oder Foto)
   – Stiftdruck steuert die Stärke
   – große Spitzen rechnen intern kleiner (flüssig auch auf dem iPad)
   ============================================================ */
function copyClipped(dctx, src, sx, sy, w, hh, dw, dh) {
  // kopiert einen Ausschnitt, auch wenn er über den Rand ragt (Safari zeichnet sonst nichts)
  dw = dw || w; dh = dh || hh;
  const kx = dw / w, ky = dh / hh;
  const x0 = Math.max(0, sx), y0 = Math.max(0, sy);
  const x1 = Math.min(src.width, sx + w), y1 = Math.min(src.height, sy + hh);
  if (x1 <= x0 || y1 <= y0) return;
  dctx.drawImage(src, x0, y0, x1 - x0, y1 - y0, (x0 - sx) * kx, (y0 - sy) * ky, (x1 - x0) * kx, (y1 - y0) * ky);
}
const Smudge = {
  st: null,
  active() { return !!this.st; },
  /* Ziel finden: gewählte Malebene mit Farbe unter dem Finger, sonst die oberste Ebene mit Inhalt */
  target(p) {
    const r = Math.max(mm2px(4), (S.opts.wischen.size * unitK()) / 2);
    const pick = pickContentLayer({ x: p.x, y: p.y, r, min: 0.005 });
    if (pick && pick.locked) { offerUnlock(pick.locked); return null; }
    if (pick) return pick;
    const A = activeLayer();
    if (A && A.type === 'paint' && !A.locked) return A;
    Komma.say('Unter deinem Finger ist nichts zum Verwischen. Mal zuerst etwas oder leg ein Foto aufs Blatt.', { mood: 'wow' });
    return null;
  },
  begin(L, p) {
    const o = S.opts.wischen;
    const rDoc = Math.max(2, (o.size * unitK()) / 2);
    let canvas, map, k = 1, before = null;
    if (L.type === 'image') {
      const src = assetCanvas(L.assetId);
      if (!src) return false;
      L._edit = cloneCanvas(src);
      canvas = L._edit;
      k = src.width / L.w;
      map = (q) => { const t = imgCoords(L, src, q.x, q.y); return { x: t.u, y: t.v }; };
      before = snapLayers();
    } else {
      canvas = L.canvas;
      map = (q) => ({ x: q.x, y: q.y });
    }
    const r = rDoc * k;                      // Radius im Zielbild
    const D = Math.max(4, Math.ceil(r * 2));
    const Ds = Math.min(D, 128);             // interne Größe (große Spitzen: kleiner rechnen)
    const mk = () => mkCanvas(Ds, Ds);
    const tmp = mk(), mask = mk(), rd = mk();
    const mx = mask.getContext('2d');
    const g = mx.createRadialGradient(Ds / 2, Ds / 2, 0, Ds / 2, Ds / 2, Ds / 2);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.5, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    mx.fillStyle = g; mx.fillRect(0, 0, Ds, Ds);
    this.st = {
      L, canvas, ctx: canvas.getContext('2d'), map, k, r, D, Ds, tmp, mask, rd, rdx: rd.getContext('2d', { willReadFrequently: true }),
      mode: o.mode || 'schmieren', base: o.strength, strength: o.strength, last: map(p), tiles: new Map(), before, bd: null, isImage: L.type === 'image',
    };
    this.pressure(p);
    this.dab(this.st.last);
    return true;
  },
  pressure(p) {
    const st = this.st;
    if (p && p.type === 'pen' && p.pressure > 0) st.strength = clamp(st.base * (0.35 + 0.9 * p.pressure), 0.05, 0.98);
  },
  saveTiles(x0, y0, x1, y1) {
    const st = this.st; if (st.isImage) return;
    const T = 256, W = st.canvas.width, H = st.canvas.height;
    for (let ty = Math.max(0, Math.floor(y0 / T)); ty <= Math.min(Math.floor((H - 1) / T), Math.floor(y1 / T)); ty++) {
      for (let tx = Math.max(0, Math.floor(x0 / T)); tx <= Math.min(Math.floor((W - 1) / T), Math.floor(x1 / T)); tx++) {
        const key = tx + ',' + ty;
        if (st.tiles.has(key)) continue;
        const x = tx * T, y = ty * T, w = Math.min(T, W - x), hh = Math.min(T, H - y);
        st.tiles.set(key, { x, y, w, h: hh, before: st.ctx.getImageData(x, y, w, hh) });
      }
    }
  },
  move(p) {
    const st = this.st; if (!st) return;
    this.pressure(p);
    const q = st.map(p);
    const d = Math.hypot(q.x - st.last.x, q.y - st.last.y);
    const step = Math.max(1, st.r * 0.18);
    if (d < step) return;
    const n = Math.ceil(d / step);
    for (let i = 1; i <= n; i++) this.dab({ x: st.last.x + ((q.x - st.last.x) * i) / n, y: st.last.y + ((q.y - st.last.y) * i) / n });
    st.last = q;
    if (!st.isImage) st.L.dirty = true;
    requestRender();
  },
  readPatch(q) {
    const st = this.st, { r, D, Ds, rdx } = st;
    rdx.clearRect(0, 0, Ds, Ds);
    copyClipped(rdx, st.canvas, Math.floor(q.x - r), Math.floor(q.y - r), D, D, Ds, Ds);
    return rdx.getImageData(0, 0, Ds, Ds);
  },
  stamp(q, img) {
    const st = this.st, { r, D, Ds, tmp, mask, ctx } = st;
    const tx = tmp.getContext('2d');
    tx.putImageData(img, 0, 0);
    tx.globalCompositeOperation = 'destination-in'; tx.drawImage(mask, 0, 0);
    tx.globalCompositeOperation = 'source-over';
    ctx.save();
    if (st.L.alphaLock) ctx.globalCompositeOperation = 'source-atop';
    ctx.globalAlpha = st.strength;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(tmp, 0, 0, Ds, Ds, Math.floor(q.x - r), Math.floor(q.y - r), D, D);
    ctx.restore();
  },
  dab(q) {
    const st = this.st;
    this.saveTiles(q.x - st.r, q.y - st.r, q.x + st.r, q.y + st.r);
    if (st.mode === 'weich') {
      // Verwischen: weichzeichnen, was unter dem Finger liegt
      const src = this.readPatch(q);
      const b = blurImageData(src, Math.max(1, Math.round(st.Ds / 14)));
      const keep = st.strength; st.strength = keep * 0.6;
      this.stamp(q, b);
      st.strength = keep;
      return;
    }
    if (!st.bd) { st.bd = this.readPatch(q); return; }
    // 1) aufgenommene Farbe weich auftragen
    this.stamp(q, st.bd);
    // 2) Farbe unter dem Finger mit der aufgenommenen mischen (auch Durchsichtiges – so läuft der Strich aus)
    const l = this.readPatch(q).data, b = st.bd.data;
    const t = 0.16 + (1 - st.strength) * 0.5;
    for (let i = 0; i < b.length; i += 4) {
      const ba = b[i + 3] / 255, la = l[i + 3] / 255;
      const na = ba + (la - ba) * t;
      if (na < 0.004) { b[i + 3] = 0; continue; }
      b[i] = (b[i] * ba + (l[i] * la - b[i] * ba) * t) / na;

  end() {

      L._edit = null;
      const id = registerAsset(edited);
      L.assetId = id; L._fcache = null;
      pushHist(structCmd(st.before, snapLayers(), null));
      UI.refreshLayers();
    } else {
      const cmds = [];
      for (const t of st.tiles.values()) cmds.push(paintPatchCmd(st.L, t.x, t.y, t.before, st.ctx.getImageData(t.x, t.y, t.w, t.h)));

/* einfacher Weichzeichner (Kasten, zweimal) – ohne ctx.filter, läuft auch auf älteren iPads */
function blurImageData(img, rad) {
  const w = img.width, hh = img.height, s = img.data;
  const a = new Float32Array(w * hh * 4), b = new Float32Array(w * hh * 4);
  // vormultipliziert, damit Ränder nicht dunkel werden
  for (let i = 0; i < s.length; i += 4) { const al = s[i + 3] / 255; a[i] = s[i] * al; a[i + 1] = s[i + 1] * al; a[i + 2] = s[i + 2] * al; a[i + 3] = s[i + 3]; }
  const pass = (src, dst, horiz) => {
    const len = horiz ? w : hh, lines = horiz ? hh : w;
    for (let l = 0; l < lines; l++) {
      for (let c = 0; c < 4; c++) {
        let acc = 0, n = 0;
        const idx = (p) => (horiz ? (l * w + p) : (p * w + l)) * 4 + c;
        for (let p = -rad; p <= rad; p++) if (p >= 0 && p < len) { acc += src[idx(p)]; n++; }
        for (let p = 0; p < len; p++) {
          dst[idx(p)] = acc / n;
          const add = p + rad + 1, rem = p - rad;
          if (add < len) { acc += src[idx(add)]; n++; }
          if (rem >= 0) { acc -= src[idx(rem)]; n--; }
        }
      }
    }
  };
  pass(a, b, true); pass(b, a, false); pass(a, b, true); pass(b, a, false);
  const out = new ImageData(w, hh), d = out.data;
  for (let i = 0; i < d.length; i += 4) { const al = a[i + 3]; d[i + 3] = al; if (al > 0.5) { const f = 255 / al; d[i] = a[i] * f; d[i + 1] = a[i + 1] * f; d[i + 2] = a[i + 2] * f; } }
  return out;
}

let _stampGrain = null;
function stampGrain() {
  if (_stampGrain) return _stampGrain;
  const S0 = 192, n = tileFbm(S0, S0, 10, 777, 3), r = rng(778);
  const c = mkCanvas(S0, S0), x = c.getContext('2d'), id = x.createImageData(S0, S0);
  for (let i = 0; i < S0 * S0; i++) { const v = n[i] + (r() - 0.5) * 0.25; id.data[i * 4 + 3] = v > 0.24 ? 255 : (v > 0.17 ? 120 : 0); }
  x.putImageData(id, 0, 0);
  _stampGrain = c;

}
/* einen Stempelabdruck erzeugen (Farbe, leichte Unregelmäßigkeit, Kartoffeldruck-Struktur) */
function stampImprint(shape, col, size, rot, seed) {
  const D = Math.max(8, Math.ceil(size * 1.2));
  const c = mkCanvas(D, D), x = c.getContext('2d');
  const r = rng(seed);
  x.translate(D / 2, D / 2); x.rotate(rot); x.scale(size / 2, size / 2);
  x.beginPath(); (STAMP_SHAPES[shape] || STAMP_SHAPES.herz).draw(x);
  x.fillStyle = col; x.fill('nonzero');
  x.setTransform(1, 0, 0, 1, 0, 0);
  // Struktur: Farbe hält nicht überall gleich
  x.globalCompositeOperation = 'destination-in';
  const g = stampGrain(), off = r() * g.width;
  x.save(); x.translate(-off, -off * 0.7); x.fillStyle = x.createPattern(g, 'repeat'); x.fillRect(0, 0, D + g.width, D + g.width); x.restore();
  x.globalCompositeOperation = 'source-over';
  return c;
}
function shapePreviewURL(shape, col = '#3a2e2a') {
  const c = stampImprint(shape, col, 52, 0, 5);
  const o = mkCanvas(64, 64), x = o.getContext('2d');
  x.fillStyle = '#fffaf0'; x.fillRect(0, 0, 64, 64);
  x.drawImage(c, (64 - c.width) / 2, (64 - c.height) / 2);
  return o.toDataURL();
}

/* Kachel-Rückgängig für Werkzeuge, die direkt auf die Ebene malen */
function tileUndo(L) {
  const tiles = new Map(), lc = L.canvas.getContext('2d'), T = 256;
  return {
    save(x0, y0, x1, y1) {
      const W = L.canvas.width, H = L.canvas.height;
      for (let ty = Math.max(0, Math.floor(y0 / T)); ty <= Math.min(Math.floor((H - 1) / T), Math.floor(y1 / T)); ty++)
        for (let tx = Math.max(0, Math.floor(x0 / T)); tx <= Math.min(Math.floor((W - 1) / T), Math.floor(x1 / T)); tx++) {
          const key = tx + ',' + ty; if (tiles.has(key)) continue;
          const x = tx * T, y = ty * T, w = Math.min(T, W - x), hh = Math.min(T, H - y);
          tiles.set(key, { x, y, w, h: hh, before: lc.getImageData(x, y, w, hh) });
        }
    },
    commit() {
      const cmds = [];
      for (const t of tiles.values()) cmds.push(paintPatchCmd(L, t.x, t.y, t.before, lc.getImageData(t.x, t.y, t.w, t.h)));
      if (cmds.length) pushHist(compoundCmd(cmds));
    },
  };
}

const Stamp = {
  st: null,
  begin(L, p) {
    const o = S.opts.stempel;
    this.st = { L, undo: tileUndo(L), last: null, size: o.size * unitK(), n: 0 };
    this.place(p);
  },
  place(p) {
    const st = this.st, o = S.opts.stempel;
    const kids = S.mode === 'kids';
    const size = st.size * (0.92 + Math.random() * 0.16);
    const rot = o.rotate ? (Math.random() - 0.5) * 0.5 : 0;
    let col = S.color;
    if (o.rainbow) col = hsvToHex((st.n * 47 + Math.random() * 20) % 360, 0.75, 0.92);
    const img = stampImprint(o.shape, col, size, rot, (Math.random() * 1e6) | 0);
    const x0 = Math.round(p.x - img.width / 2), y0 = Math.round(p.y - img.height / 2);
    st.undo.save(x0, y0, x0 + img.width, y0 + img.height);
    const lc = st.L.canvas.getContext('2d');
    lc.save();
    if (st.L.alphaLock) lc.globalCompositeOperation = 'source-atop';
    lc.globalAlpha = 0.86 + Math.random() * 0.14;
    lc.drawImage(img, x0, y0);
    lc.restore();
    freeCanvas(img);
    st.last = { x: p.x, y: p.y }; st.n++;
    st.L.dirty = true;
    Snd.play(kids || Snd.fun() ? 'stamp' : 'click');
    requestRender();
  },
  move(p) {
    const st = this.st; if (!st || !st.last) return;
    const gap = st.size * (S.opts.stempel.gap || 1.15);
    if (Math.hypot(p.x - st.last.x, p.y - st.last.y) >= gap) this.place(p);
  },
  end() { const st = this.st; if (!st) return; this.st = null; st.undo.commit(); UI.layerThumbLater(); if (S.mode === 'kids') Komma.cheer(); },
};

/* ---------- Zauberpinsel: Effekt-Stempeln entlang des Strichs ---------- */
const EFFECTS = [['regenbogen', 'Regenbogen'], ['glitzer', 'Glitzer'], ['konfetti', 'Konfetti'], ['sterne', 'Sterne'], ['herzen', 'Herzen']];
BRUSH_LIB.effekt = EFFECTS;
const CONFETTI = ['#d8452f', '#f6d64a', '#5aa25a', '#4a7fc1', '#e0577a', '#7b5aa6', '#e8913a', '#8fc3e8'];
function effectStamp(st, c, ax, ay, ar, bx, by, br, first) {
  const P = st.P, rand = st.rand, k = P.k;
  const d = first ? 0 : Math.hypot(bx - ax, by - ay);
  const at = (t) => ({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, r: ar + (br - ar) * t });
  if (st.hue0 == null) { const [hh] = rgbToHsv(...hexToRgb(S.color)); st.hue0 = hh; st.acc = 0; }
  switch (P.effect) {
    case 'regenbogen': {
      c.fillStyle = `hsl(${(st.hue0 + st.L / (k * 3)) % 360},85%,55%)`;
      if (first) stampDot(c, bx, by, br); else stampSeg(c, ax, ay, ar, bx, by, br, 0, rand);
      return;
    }
    case 'glitzer': {
      const n = first ? 6 : Math.max(1, Math.round((d * br) / (k * k * 9)));
      const cols = ['#f6d64a', '#fff3b0', '#e8b04a', '#ffffff', '#f2e6d0', S.color];
      for (let i = 0; i < n; i++) {
        const q = at(rand()), a = rand() * Math.PI * 2, rr = q.r * Math.sqrt(rand());
        const x = q.x + Math.cos(a) * rr, y = q.y + Math.sin(a) * rr;
        c.fillStyle = cols[Math.floor(rand() * cols.length)];
        if (rand() < 0.06) { // kleines Funkeln
          const s = q.r * (0.25 + rand() * 0.25);
          c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + s * 0.18, y - s * 0.18); c.lineTo(x + s, y); c.lineTo(x + s * 0.18, y + s * 0.18); c.lineTo(x, y + s); c.lineTo(x - s * 0.18, y + s * 0.18); c.lineTo(x - s, y); c.lineTo(x - s * 0.18, y - s * 0.18); c.closePath(); c.fill();
        } else { c.beginPath(); c.arc(x, y, (0.35 + rand() * 0.9) * k, 0, Math.PI * 2); c.fill(); }
      }
      return;
    }
    default: {
      // Konfetti, Sterne, Herzen: in Abständen entlang des Strichs
      const spacing = P.effect === 'konfetti' ? br * 0.45 : br * 1.5;
      st.acc += d;
      const places = [];
      if (first) places.push(1);
      while (st.acc >= spacing) { st.acc -= spacing; places.push(d ? 1 - st.acc / d : 1); }
      for (const t of places) {
        const q = at(clamp(t, 0, 1));
        if (P.effect === 'konfetti') {
          for (let j = 0; j < 2; j++) {
            const a = rand() * Math.PI * 2, rr = q.r * Math.sqrt(rand());
            const x = q.x + Math.cos(a) * rr, y = q.y + Math.sin(a) * rr, s = q.r * (0.14 + rand() * 0.16);
            c.save(); c.translate(x, y); c.rotate(rand() * Math.PI); c.fillStyle = CONFETTI[Math.floor(rand() * CONFETTI.length)];
            const f = rand();
            c.beginPath();
            if (f < 0.45) c.rect(-s, -s * 0.45, s * 2, s * 0.9);
            else if (f < 0.75) c.arc(0, 0, s * 0.7, 0, Math.PI * 2);
            else { c.moveTo(0, -s); c.lineTo(s, s * 0.8); c.lineTo(-s, s * 0.8); c.closePath(); }
            c.fill(); c.restore();
          }
        } else {
          const s = q.r * (0.55 + rand() * 0.5);
          const [hh, sv, vv] = rgbToHsv(...hexToRgb(S.color));
          c.save(); c.translate(q.x + (rand() - 0.5) * q.r * 0.6, q.y + (rand() - 0.5) * q.r * 0.6); c.rotate((rand() - 0.5) * 0.8); c.scale(s, s);
          c.fillStyle = S.mode === 'kids' ? hsvToHex(rand() * 360, 0.7, 0.95) : hsvToHex(hh, sv, clamp(vv + (rand() - 0.5) * 0.3, 0.15, 1));
          c.beginPath(); STAMP_SHAPES[P.effect === 'sterne' ? 'stern' : 'herz'].draw(c); c.fill(); c.restore();
        }
      }
    }
  }
}

/* ============================================================
   Daumenkino: Bilder nacheinander malen (das vorige scheint durch)

const Flip = {
  is() { return !!(S.project && S.project.flip); },
  async create(kids) {

  },
  /* vorheriges Bild blass unter das aktuelle legen */

  },

  },
  async open() {
    await Store.saveCurrent();

    const bar = h('div', { class: 'progress' }, h('div'));

    const w = 720, sc = w / docW();
    for (let i = 0; i < n; i++) {
      const { page, temp } = await Export.pageRuntime(i);
      frames.push(renderRegion(page.layers, 0, 0, docW(), docH(), sc, page.bg || '#ffffff'));
      Export.releaseTemp(temp);
      bar.firstChild.style.width = Math.round(((i + 1) / n) * 100) + '%';
      await nextFrame();
    }
    wait.close();
    const cv = mkCanvas(frames[0].width, frames[0].height);
    cv.style.cssText = 'width:100%;height:auto;border:2px solid var(--line);background:#fff;display:block';
    const x = cv.getContext('2d');
    let fps = S.project.fps || 6, pingpong = !!S.project.pingpong, playing = true, i = 0, dir = 1, last = 0, raf = null;
    const info = h('span', { class: 'note', style: { fontVariantNumeric: 'tabular-nums' } });
    const show = (k) => { x.drawImage(frames[k], 0, 0); info.textContent = `Bild ${k + 1} / ${n}`; };
    const tick = (t) => {
      if (!playing) return;
      if (t - last >= 1000 / fps) {
        last = t; show(i);
        if (Snd.fun() || S.mode === 'kids') Snd.noise(0.018, 0.035, 3200);
        if (pingpong) { if (i + dir >= n || i + dir < 0) dir = -dir; i += dir; }
        else i = (i + 1) % n;
      }
      raf = requestAnimationFrame(tick);
    };
    const playBtn = h('button', { class: 'key primary', type: 'button' }, 'Pause');
    playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Abspielen'; Snd.play('click'); if (playing) raf = requestAnimationFrame(tick); });
    const fpsRow = sliderRow('Tempo (Bilder pro Sekunde)', fps, 1, 15, 1, (v) => { fps = v; S.project.fps = v; markDirty(true); }, (v) => v, 'flip-fps');
    const pp = checkRow('Hin und zurück', pingpong, (v) => { pingpong = v; S.project.pingpong = v; markDirty(true); }, 'flip-pp');

    });

    raf = requestAnimationFrame(tick);
  },
  async video(frames, fps, pingpong, prog) {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error('Dieser Browser kann keine Videos aufnehmen.');
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mime = types.find((t) => MediaRecorder.isTypeSupported(t));
    if (!mime) throw new Error('Kein passendes Videoformat verfügbar.');
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const cv = mkCanvas(frames[0].width & ~1, frames[0].height & ~1), x = cv.getContext('2d');
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 3000000 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise((r) => { rec.onstop = r; });
    const seq = frames.map((_, k) => k);
    if (pingpong) for (let k = frames.length - 2; k > 0; k--) seq.push(k);
    const loops = Math.max(2, Math.ceil((5 * fps) / seq.length)); // mindestens etwa 5 Sekunden
    x.drawImage(frames[0], 0, 0);
    rec.start(250);
    const total = loops * seq.length;
    for (let l = 0, c = 0; l < loops; l++) for (const k of seq) { x.drawImage(frames[k], 0, 0); prog(++c / total); await sleep(1000 / fps); }
    rec.stop(); await done;
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const res = await saveFile(`${safeName(S.project.name)}-daumenkino.${ext}`, blob);
    return res === 'declined' ? 'Abgebrochen.' : `Fertig: Video (${ext.toUpperCase()}, ${(blob.size / 1e6).toFixed(1).replace('.', ',')} MB).`;
  },
};

/* ============================================================
   Start
   ============================================================ */
async function boot() {
  initRender();
  Komma.init();
  UI.buildStageExtras();
  QS.build();
  initInput();
  /* Speichern im Browser nur mit Einwilligung (wie alle Spiele der Sprachdetektei); sonst arbeitet die Werkstatt im Arbeitsspeicher */
  if (window.KommaSpeicher && KommaSpeicher.darf()) await DB.open(); else DB.ok = false;
  if (window.KommaSpeicher) KommaSpeicher.frage('Kommas Bilderbuch-Werkstatt', () => location.reload(), 'was du gestaltet hast (Bücher, Bilder und Einstellungen)');
  await Store.loadSettings();
  applyTheme();
  UI.refreshAll();
  await Ablage.load();
  await Store.gc();
  const ps = await Store.listProjects();
  let fresh = false;
  if (!ps.length) { await Store.createSample(); fresh = true; }
  else {
    const werk = ps.filter((p) => !p.kids);
    const pickFrom = werk.length ? werk : ps;
    const last = pickFrom.find((p) => p.id === Store.lastProject);
    await Store.openProject((last || pickFrom[0]).id);
  }
  setTool(S.tool, true);
  UI.refreshAll();
  fitView();
  if (fresh) Komma.say('Hallo, ich bin Komma! Das ist ein Beispielbuch. Probier alles aus – oder leg in der Mappe ein eigenes Bilderbuch an.', { mood: 'happy', time: 10000 });
  else if (!DB.ok) Komma.say('Hier kann ich nichts im Browser speichern (vielleicht ein privates Fenster). Sichere dein Buch als Projektdatei!', { mood: 'wow', time: 10000 });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.saveCurrent(); });
  window.addEventListener('pagehide', () => Store.saveCurrent());
  window.__werkstattReady = true;
  // kleine Prüfhilfe (verändert nichts)
  window.__wdbg = { act: () => activeLayer(), sel: () => selectedLayer(), toScreen: (x, y) => docToScreen(x, y), handles: (L) => selectionHandles(L), build: (k, p, s) => BUILD[k].draw(p, s) };
  setTimeout(() => Ablage.ensureStarter().catch((e) => console.warn(e)), 600);
}
window.addEventListener('error', (e) => { console.error(e.error || e.message); });
boot().catch((e) => { console.error(e); toast('Beim Starten ist etwas schiefgegangen: ' + (e.message || e), true); });

})();
</script>
