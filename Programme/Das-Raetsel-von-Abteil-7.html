<script>
/* EINWILLIGUNG v1 – Speichern auf diesem Gerät nur mit Einwilligung (wie Silbenexpress und Kommas Zählrahmen)
   Quelle: assets/js/einwilligung.js. Dieser Block steckt wortgleich in jedem Spiel, das etwas speichert,
   damit die Spiele auch einzeln und offline laufen. Nach einer Änderung hier: python3 werkzeuge/einwilligung_einbauen.py

   - Beim ersten Start fragt ein Fenster „Eine Frage an die Erwachsenen“.
   - „Ja, merken“: Die Einwilligung (kommas-einwilligung-v1) gilt für alle Spiele dieser Website.
   - „Nein, nichts speichern“: Es wird nichts gespeichert, auch nicht die Antwort. Beim nächsten Start fragt das Spiel erneut.
   - Widerruf unter „Für Lehrkräfte“ → „Auf diesem Gerät merken: Nicht merken“: Alle Spielstände dieser Website werden gelöscht.
   Rechtsgrundlage: Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TDDDG.

   Für das Spiel: KommaSpeicher.darf() vor jedem Lesen und Schreiben prüfen;
   KommaSpeicher.frage(name, beiJa) einmal beim Start aufrufen;
   KommaSpeicher.setze(true|false) für den Schalter im Lehrkräfte-Menü; KommaSpeicher.beiAenderung(fn). */
(function () {
  'use strict';
  if (window.KommaSpeicher) return;
  var SCHLUESSEL = 'kommas-einwilligung-v1';
  /* Alle Speicherstände der Sprachdetektei: werden beim Widerruf gelöscht */
  var PRAEFIXE = ['kommas-einwilligung', 'abteil7', 'kasusteich', 'zeitfaden', 'wortwurfbude', 'faelscherwerkstatt'];
  var DATENSCHUTZ = 'https://www.kommakatze.de/datenschutz.html';
  var zustand = null;          /* true = ja, false = nein (nur für diesen Aufruf), null = noch nicht gefragt */
  var hoerer = [];

  function lies() { try { return localStorage.getItem(SCHLUESSEL) === 'ja'; } catch (e) { return false; } }
  if (lies()) zustand = true;

  function loescheAlles() {
    try {
      var weg = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i) || '';
        if (PRAEFIXE.some(function (p) { return k.indexOf(p) === 0; })) weg.push(k);
      }
      weg.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) { /* ohne Speicher gibt es nichts zu löschen */ }
  }

  function setze(ja) {
    zustand = !!ja;
    if (ja) { try { localStorage.setItem(SCHLUESSEL, 'ja'); } catch (e) {} }
    else loescheAlles();
    hoerer.forEach(function (fn) { try { fn(zustand); } catch (e) {} });
  }

  function stil() {
    if (document.getElementById('komma-einwilligung-stil')) return;
    var s = document.createElement('style');
    s.id = 'komma-einwilligung-stil';
    s.textContent =
      '.ke-hg{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,20,40,.6)}' +
      '.ke-karte{max-width:460px;width:100%;max-height:calc(100% - 32px);overflow:auto;background:#FFFDF6;color:#2A2138;border:4px solid #2A2138;border-radius:18px;box-shadow:6px 6px 0 #2A2138;padding:20px 22px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left}' +
      '.ke-karte h2{margin:0 0 8px;font-size:1.25rem;line-height:1.25}' +
      '.ke-karte p{margin:0 0 10px}' +
      '.ke-reihe{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}' +
      '.ke-knopf{flex:1 1 160px;font:inherit;font-weight:700;padding:10px 14px;border:3px solid #2A2138;border-radius:12px;cursor:pointer;color:#2A2138}' +
      '.ke-ja{background:#BFEBD8}.ke-nein{background:#F7E08A}' +
      '.ke-knopf:focus-visible,.ke-link:focus-visible{outline:3px dashed #D94F5C;outline-offset:3px}.ke-karte:focus{outline:none}' +
      '.ke-link{color:#5A4A9E;font-weight:700}' +
      '.ke-klein{font-size:.85rem;color:#5B5070}';
    (document.head || document.documentElement).appendChild(s);
  }

  /* Fragt einmal, solange nicht eingewilligt wurde; beiJa() läuft nach „Ja, merken“ */
  function frage(name, beiJa) {
    if (zustand !== null) return;
    var los = function () {
      if (zustand !== null || document.querySelector('.ke-hg')) return;
      stil();
      var vorher = document.activeElement;
      var hg = document.createElement('div');
      hg.className = 'ke-hg';
      hg.innerHTML =
        '<div class="ke-karte" role="dialog" aria-modal="true" aria-labelledby="ke-titel" aria-describedby="ke-text" tabindex="-1">' +
        '<h2 id="ke-titel">Eine Frage an die Erwachsenen</h2>' +
        '<p id="ke-text"></p>' +
        '<p>Die Angaben bleiben im Browser dieses Geräts und gelten für alle Spiele der Sprachdetektei. Es werden keine Cookies gesetzt, keine Namen gespeichert und keine Daten übertragen. Ändern lässt sich das jederzeit unter „Für Lehrkräfte“.</p>' +
        '<div class="ke-reihe"><button type="button" class="ke-knopf ke-ja">Ja, merken</button><button type="button" class="ke-knopf ke-nein">Nein, nichts speichern</button></div>' +
        '<p class="ke-klein">Ohne Speichern funktioniert alles, der Stand ist aber nach dem Schließen weg. <a class="ke-link" href="' + DATENSCHUTZ + '" target="_blank" rel="noopener">Datenschutzerklärung lesen</a></p>' +
        '</div>';
      hg.querySelector('#ke-text').textContent = 'Darf „' + name + '“ auf diesem Gerät merken, wie weit gespielt wurde (Fortschritt, Sticker und Einstellungen)?';
      var zu = function (ja) {
        if (hg.parentNode) hg.parentNode.removeChild(hg);
        setze(ja);
        if (ja && typeof beiJa === 'function') { try { beiJa(); } catch (e) {} }
        if (vorher && vorher.focus && document.contains(vorher)) { try { vorher.focus(); } catch (e) {} }
      };
      hg.querySelector('.ke-ja').addEventListener('click', function () { zu(true); });
      hg.querySelector('.ke-nein').addEventListener('click', function () { zu(false); });
      /* Tab bleibt im Fenster */
      hg.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var f = hg.querySelectorAll('button,a');
        var erst = f[0], letzt = f[f.length - 1];
        if (e.shiftKey && document.activeElement === erst) { e.preventDefault(); letzt.focus(); }
        else if (!e.shiftKey && document.activeElement === letzt) { e.preventDefault(); erst.focus(); }
      });
      document.body.appendChild(hg);
      hg.querySelector('.ke-karte').focus();
    };
    if (document.body) los(); else document.addEventListener('DOMContentLoaded', los);
  }

  window.KommaSpeicher = {
    darf: function () { return zustand === true; },
    gefragt: function () { return zustand !== null; },
    setze: setze,
    frage: frage,
    beiAenderung: function (fn) { hoerer.push(fn); },
    TEXT_AN: 'Merken',
    TEXT_AUS: 'Nicht merken',
    TITEL: 'Auf diesem Gerät merken'
  };
})();
/* EINWILLIGUNG ENDE */
</script>

  /* ---------- Schleife ---------- */
  loop(now){

    if (document.hidden || now - this.last < (this.run || this.v > 0 ? 40 : 90)) return;

    const spec = LOKS[save.bahn.lok] || LOKS.aurora;
    if (save.sound && this.v > 1){
      this.chug += ds; this.clack += ds;
      if (spec.smoke && !spec.sparkle && this.chug > 6.5){ this.chug = 0; Snd.noise(.07, .16 + .1 * this.v / vmax, 0, 'lowpass', spec.dark ? 400 : 700); }
      if (this.clack > 16){ this.clack = 0; Snd.noise(.03, .3, 0, 'bandpass', 1900); Snd.noise(.03, .22, .11, 'bandpass', 1500); }

  consist(){ const spec = LOKS[save.bahn.lok] || LOKS.aurora, n = Math.min(5, 2 + ((save.free && save.free.cards) || 0)), cars = [{spec, len:spec.len}];
    for (let i = 0; i < n; i++) cars.push({wagon:i, len:15}); return cars; },
  trainNear(a, b){ const cars = this.consist(); let len = 0; cars.forEach(c => len += c.len + 1.6); const head = this.pos, tail = this.pos - len;
    for (let s = tail; s <= head; s += 3){ const m = bMod(s); if (m >= a && m <= b) return true; } return false; },
  puff(n){ const spec = LOKS[save.bahn.lok] || LOKS.aurora; if (!spec.smoke) return; for (let i = 0; i < n; i++) this.emit(spec, i * .05); },
  emit(spec, age){ const L = this.lokPose(); if (!L) return; const ux = Math.cos(L.th), uy = Math.sin(L.th), a = spec.smoke[0];

    this.smoke.forEach(p => { p.age += dt; p.z += 8 * dt; p.x += p.dx * dt; p.y += p.dy * dt; }); this.smoke = this.smoke.filter(p => p.age < p.life);

  },
  lokPose(){ const spec = LOKS[save.bahn.lok] || LOKS.aurora; return this.pose(this.pos - spec.len / 2, spec.len); },
  pose(s, len){ const f = trackAt(s + len * .38), r = trackAt(s - len * .38); return {x:(f.x + r.x) / 2, y:(f.y + r.y) / 2, th:Math.atan2(f.y - r.y, f.x - r.x), s:bMod(s)}; },

  /* ---------- Zeichnen ---------- */
  draw(t, now){

  },
  /* Hintergrund, Tisch, Boden, Gleis und flache Teile: nur bei Änderungen neu */

    }
    // flache Teile unter dem Gleis

    this.drawTrack();

      R(p[0], p[1] - 4, 1, 4, '#7a5340'); R(p[0] - 2, p[1] - 7, 5, 4, '#7a5340'); R(p[0] - 1, p[1] - 6, 3, 2, '#f3e6c8'); R(p[0], p[1] - 6, 1, 1, '#c9773a'); });

  },
  drawTrack(){
    const R = this.R.bind(this), W = this.winter;

      for (let b = -4; b <= 4; b += 1.2){ const P = bP(p.x + vx * b, p.y + vy * b); const hsh = Math.floor(P[0] * 7 + P[1] * 13) % 5; R(P[0], P[1], 1, 1, W ? (hsh ? '#f4f7fb' : '#cfd8e3') : (hsh ? '#b8b0a8' : '#9d948c')); } }
    for (let s = 0; s < BTLEN; s += 2.6){ const p = trackAt(s), q = trackAt(s + .5), ux = q.x - p.x, uy = q.y - p.y, l = Math.hypot(ux, uy) || 1, vx = -uy / l, vy = ux / l;
      for (let b = -3.2; b <= 3.2; b += .4){ const P = bP(p.x + vx * b, p.y + vy * b); R(P[0], P[1], 1, 1, '#7a5340'); } }
    for (let s = 0; s < BTLEN; s += .25){ const p = trackAt(s), q = trackAt(s + .5), ux = q.x - p.x, uy = q.y - p.y, l = Math.hypot(ux, uy) || 1, vx = -uy / l, vy = ux / l;
      [-1.8, 1.8].forEach(b => { const P = bP(p.x + vx * b, p.y + vy * b); R(P[0], P[1], 1, 1, '#d9d3e2'); R(P[0], P[1] + 1, 1, 1, '#5d566b'); }); }
  },
  /* flache Bauteile (im Hintergrundbild) */
  flatItem(id){

      if (W){ R(126, 58, 5, 1, '#ffffff'); R(134, 61, 4, 1, '#ffffff'); } else { R(128, 57, 3, 1, '#a9d4ec'); R(136, 61, 4, 1, '#a9d4ec'); } }
    if (id === 'bach'){ const pts = [[143, 66], [152, 70], [166, 74], [178, 80], [186, 92], [190, 108], [193, 140]];
      for (let i = 0; i < pts.length - 1; i++){ const a = pts[i], b = pts[i + 1], n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 2);
        for (let k = 0; k <= n; k++){ const X = a[0] + (b[0] - a[0]) * k / n, Y = a[1] + (b[1] - a[1]) * k / n; for (let w = -1.6; w <= 1.6; w += .8){ const P = bP(X + w, Y); R(P[0], P[1], 1, 1, W ? '#cfe0ea' : (Math.abs(w) > 1 ? '#7fb6d6' : '#5f9fc9')); } } } }

    if (id === 'bahnhof'){ const P = bP(80, 21), Q = bP(122, 27); R(P[0], P[1], Q[0] - P[0], Q[1] - P[1], W ? '#e3e8ef' : '#c8bfd4'); R(P[0], Q[1] - 1, Q[0] - P[0], 1, '#e2b95c'); R(P[0], P[1], Q[0] - P[0], 1, '#a49cb1'); }

  /* ---------- 3D-Teile mit Tiefe ---------- */

    if (id === 'tannen') BTREES.forEach((p, i) => at(p[0], p[1], P => this.tanne(P[0], P[1], i % 3)));
    if (id === 'signal') at(128, 24, P => this.signal(P[0], P[1]));

      if (this.winter) at(70, 60, P => this.snowman(P[0], P[1])); else { at(66, 54, P => this.cow(P[0], P[1], 1, t)); at(76, 66, P => this.cow(P[0], P[1], -1, t + 2)); } }
    if (id === 'teich'){ if (!this.winter) for (let i = 0; i < 3; i++){ const a = t * .25 + i * 2.1, X = 134 + Math.cos(a) * 6, Y = 62 + Math.sin(a) * 8; at(X, Y, P => this.duck(P[0], P[1], Math.sin(a) > 0 ? -1 : 1)); }
      at(141, 70, P => this.boat(P[0], P[1])); }
    if (id === 'muehle') at(170, 134, P => this.muehle(P[0], P[1]));
    if (id === 'schranke'){ at(93, 85, P => this.schranke(P[0], P[1], -1, now)); at(107, 95, P => this.schranke(P[0], P[1], 1, now)); }

    const a0 = Math.max(p.a0, aMin), a1 = p.a1; if (a1 <= a0) return;
    const hw = p.w / 2, bo = p.b || 0, cx = car.x + vx * bo, cy = car.y + vy * bo;
    const C = (a, b) => [cx + ux * a + vx * b, cy + uy * a + vy * b];
    const c0 = C(a0, -hw), c1 = C(a1, -hw), c2 = C(a1, hw), c3 = C(a0, hw);
    const faces = [[c0, c1, uy * 1, -ux * 1, 'L'], [c1, c2, ux, uy, 'F'], [c2, c3, -uy, ux, 'L'], [c3, c0, -ux, -uy, 'B']];
    faces.forEach(f => { const nx = f[2], ny = f[3]; if (ny <= .02) return;
      const col = ny >= Math.abs(nx) * .9 ? p.c[1] : p.c[2], A = f[0], B = f[1];
      this.poly([bP(A[0], A[1], p.z0), bP(B[0], B[1], p.z0), bP(B[0], B[1], p.z1), bP(A[0], A[1], p.z1)], col);
      if (f[4] === 'L'){
        const fwd = f === faces[0], frac = a => fwd ? (a - a0) / (a1 - a0) : (a1 - a) / (a1 - a0);
        const along = (aS, aE, z0, z1, colr) => { let t0 = frac(aS), t1 = frac(aE); if (t0 > t1){ const x = t0; t0 = t1; t1 = x; } t0 = Math.max(0, t0); t1 = Math.min(1, t1); if (t1 <= t0) return;
          const P = [A[0] + (B[0] - A[0]) * t0, A[1] + (B[1] - A[1]) * t0], Q = [A[0] + (B[0] - A[0]) * t1, A[1] + (B[1] - A[1]) * t1];
          this.poly([bP(P[0], P[1], z0), bP(Q[0], Q[1], z0), bP(Q[0], Q[1], z1), bP(P[0], P[1], z1)], colr); };
        if (p.win){ const n = p.win.n, span = (p.a1 - p.a0) - 2.4, step = span / n, ww = Math.max(1.1, step * .62);
          for (let k = 0; k < n; k++){ const a = p.a0 + 1.2 + k * step + (step - ww) / 2; along(a, a + ww, p.win.z0, p.win.z1, '!win'); } }
        if (p.door) along(-1.2, 1.2, 2.2, 6.8, p.c[2]);
        if (p.bands) p.bands.forEach(b => along(b, b + .6, p.z0, p.z1, p.band));
        if (p.wheels){ const n = p.wheels.n, span = (p.a1 - p.a0) - 3; for (let k = 0; k < n; k++){ const a = p.a0 + 1.5 + span * (n === 1 ? .5 : k / (n - 1)); along(a - .9, a + .9, 0, 1.8, p.wheels.col); } }
      }
    });
    this.poly([bP(c0[0], c0[1], p.z1), bP(c1[0], c1[1], p.z1), bP(c2[0], c2[1], p.z1), bP(c3[0], c3[1], p.z1)], p.c[0]);
    if (p.lamp && a1 > aMin){ const L = bP(cx + ux * (a1 + .1), cy + uy * (a1 + .1), p.lamp); this.R(L[0], L[1] - 1, 1, 1, '!lamp'); if (this.night) (this.lights = this.lights || []).push([L[0], L[1], 1, ux, uy]); }
  },
  drawSmoke(){ const spec = LOKS[save.bahn.lok] || LOKS.aurora;
    this.smoke.forEach(p => { const P = bP(p.x, p.y, p.z), k = p.age / p.life;
      if (spec.sparkle){ const c = k < .5 ? '!#fff3c4' : '!#f2c94c'; this.R(P[0], P[1] - 1, 1, 3, c); this.R(P[0] - 1, P[1], 3, 1, c); return; }
      const s = k < .25 ? 3 : k < .6 ? 2 : 1, col = spec.dark ? (this.night ? '#4f4a5e' : '#8e8a96') : (k < .5 ? '#f6f3fa' : '#d9d3e2'); this.R(P[0] - (s >> 1), P[1] - (s >> 1), s, s, col); }); },
  drawLights(){
    const L = this.lights || []; this.lights = []; if (!this.night) return; const g = this.g;
    L.forEach(l => { g.fillStyle = 'rgba(255,214,120,.16)';
      if (l[2]){ const x = l[0] + l[3] * 8, y = l[1] + 4 + l[4] * 4; g.fillRect(Math.round(x - 6), Math.round(y - 2), 12, 4); g.fillRect(Math.round(x - 4), Math.round(y - 3), 8, 6); return; }
      g.fillRect(l[0] - 3, l[1] - 3, 7, 7); g.fillRect(l[0] - 5, l[1] - 1, 11, 3); g.fillStyle = 'rgba(255,214,120,.1)'; g.fillRect(l[0] - 6, l[1] + 9, 13, 4); });
  }
};

function hbTrain(ex){
  const wheels = '<div class="wheels"><i></i><i></i></div>';
  return '<div class="hb-train" role="img" aria-label="Beispielsatz: ' + esc(ex.map(t => t.w + (t.anh ? ' ' + t.anh : '')).join(' ')) + '">' + ex.map(t => {
    if (t.t === 'lok') return '<div class="unit lok"><div class="car"><i class="chim"></i><i class="lampf"></i><span class="wd">' + esc(t.w) + '</span></div>' + wheels + '</div>';
    if (t.t === 'sl') return '<div class="unit sl"><div class="car"><i class="lampr"></i><span class="wd">' + esc(t.w) + '</span></div>' + wheels + '</div>';
    if (t.t === 'klapp') return '<div class="unit wagon klapp"><div class="car"><span class="roof">' + esc(t.roof) + '</span><span class="wds"><span class="wd">' + esc(t.w) + '</span></span></div>' + wheels + '</div>';
    const ty = t.t === 'g' ? TYPES[t.ty] : null;
    const words = '<span class="wd">' + esc(t.w) + '</span>' + (t.anh ? '<span class="wd anh">' + icon('anh') + esc(t.anh) + '</span>' : '');
    return '<div class="unit wagon' + (ty ? ' done' : ' hb-plain') + '"' + (ty ? ' style="--stripe:' + ty.col + '"' : '') + '><div class="car"><span class="roof">' + (ty ? icon(t.ty) + esc(ty.short) : '') + '</span><span class="wds">' + words + '</span></div>' + wheels + '</div>';
  }).join('') + '</div>';
}
function hbChecks(list){
  return '<div class="hb-checks">' + list.map(c => '<div class="hb-check"><span class="hb-mark' + (c[2] ? '' : ' no') + '" role="img" aria-label="' + (c[2] ? 'klappt' : 'klappt nicht') + '">' + (c[2] ? '✓' : '×') + '</span>' +
    (c[0] ? '<span class="pn">' + esc(c[0]) + '</span>' : '') + '<span class="ln">' + esc(c[1]) + '</span></div>').join('') + '</div>';
}
function hbKinds(k){ return k && k.length ? '<div class="hb-kinds">' + k.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : ''; }
function hbTip(t){ return '<div class="hb-tip">' + icon('cat') + '<div><p class="k">Kommas Tipp: Vorsicht!</p><p>' + esc(t) + '</p></div></div>'; }
function hbBadge(d){ return '<span class="hb-badge" style="--tc:' + d.col + '">' + (d.icon ? icon(d.icon) : esc(d.glyph || '')) + '</span>'; }
function hbGlied(d){
  return '<div class="hb-head">' + hbBadge(d) + '<div class="hb-hd"><div class="hb-title">' + esc(d.name) + '</div><div class="hb-sub">' + esc(d.tag) + (d.meister ? ' · für Meister' : '') + '</div></div>' +
    '<div class="hb-q"><span>Frage</span><b>' + esc(d.q) + '</b></div></div>' +
    '<p class="hb-text">' + esc(d.text) + '</p>' + hbKinds(d.kinds) +
    '<p class="hb-lab">Beispiel aus dem Zug</p>' + hbTrain(d.ex) +

  const who = T.s.who, spk = '<span class="tag light">' + (PORTRAIT[who] ? icon(PORTRAIT[who]) : '') + '<span>' + esc(who === 'erz' ? 'Erzählung' : PEOPLE[who] + ' sagt:') + '</span></span>';
  const team = save.mode === 'team' && T.step !== 'indiz' && T.step !== 'stamp' ? '<span class="tag">' + icon(save.team % 2 === 0 ? 'lat' : 'kof') + '<span>' + teamName() + ' ist dran</span></span>' : '';
  hd.innerHTML = spk + team + (T.rueck ? '<span class="tag">' + icon('uhr') + '<span>Rückblende</span></span>' : '');
}

function renderTools(){
  $('#tlScroll').scrollTop = 0; setStepper(); const cards = $('#cards'); cards.innerHTML = '';
  $('#tlHead').hidden = !T; renderHead();
  if (!T) return;
  Talk.hide(); showKomma(T.step !== 'indiz' && T.step !== 'stamp' && T.step !== 'deduce');
  if (T.step === 'kern'){
    setInstr(GD(T.s).kern ? 'Was passiert hier? Tippt das Wort an, auf das Komma zeigt.' : 'Findet den Kern: Was passiert hier? Tippt die Wörter an, die das sagen.');
    setActions([btn('Fertig', () => Game.kernDone(), '', 'check')]);
  } else if (T.step === 'klappen'){
    setInstr('Tippt den Klappwaggon an: Der Nebensatz klappt zu einem Wort zusammen.');
    setActions([]);
  } else if (T.step === 'rangieren'){
    setInstr('Rangiert! Tippt Wörter an, die zusammen nach vorn fahren sollen. Dann pfeift.');
    const go = btn('Pfeife: nach vorn', () => Game.pfeife(), 'primary', 'pfeife'); go.id = 'pfeifeBtn'; go.disabled = !T.sel.size || T.busy;
    const nodes = [go]; if (T.sel.size) nodes.unshift(btn('Lösen', () => { T.sel.clear(); renderTrain(); renderTools(); }));
    setActions(nodes);
  } else if (T.step === 'fragen'){
    if (T.weiche){ renderWeiche(cards); setActions([]); return; }
    setInstr('Fragt nach! Tippt eine Fragekarte an und dann den Waggon, der antwortet.');
    const used = new Set(Array.from(T.assign.values()));
    T.cards.filter(c => !used.has(c.id)).forEach(c => {
      const ty = TYPES[c.t], b = h('button', {class:'qcard' + (T.pick && T.pick.kind === 'card' && T.pick.id === c.id ? ' sel' : ''), 'data-card':c.id},
        '<span class="band">' + icon(c.t) + '</span><span class="q">' + esc(c.f) + '</span>');
      b.style.setProperty('--tc', ty.col); b.addEventListener('click', () => Game.cardTap(c.id)); cards.appendChild(b);
    });
    const ready = openGlieder().every(gi => T.assign.has(gi)) && weichenDone();
    const rb = btn('Ida notiert', () => Game.readback(), 'primary' + (ready ? ' pulse' : ''), 'nb'); rb.id = 'readBtn'; rb.disabled = !ready || T.busy;
    setActions([rb]);
  } else if (T.step === 'anhaenger'){
    setInstr('Sucht die Anhänger: Welche Wörter beschreiben ein Nomen genauer? Tippt sie an.');
    setActions([h('span', {class:'small'}, (T.attrFound.size + ' von ' + T.s.attr.length + ' Anhängern'))]);
  } else if (T.step === 'indiz'){
    setInstr(save.detektiv ? 'Notiert! Im Detektivmodus prüft Ida erst im Finale.' : 'Neues Indiz für die Fallakte!');
    const ic = indizCard(T.s); cards.appendChild(ic); reveal(ic);
    const hf = heftOn(T.s), w = btn(hf ? 'Ins Heft ▸' : 'Weiter ▸', () => hf ? heftPanel(T.s, () => Game.taskDone()) : Game.taskDone(), 'primary'); setActions([w]);
    setTimeout(() => { try { w.focus({preventScroll:true}); } catch (e) {} }, 60);
  } else if (T.step === 'stamp'){
    setInstr(T.clean ? 'Goldstempel! Ganz ohne Hilfe geschafft.' : 'Stempel! Satz geschafft.');
    const tc = ticketCard(T.clean); cards.appendChild(tc); reveal(tc);
    const hf = heftOn(T.s), nx = btn(hf ? 'Ins Heft ▸' : 'Nächster Satz ▸', () => hf ? heftPanel(T.s, () => Game.taskDone()) : Game.taskDone(), 'primary');
    setActions([btn('Aussteigen', () => Game.exitFree()), nx]);
    setTimeout(() => { try { nx.focus({preventScroll:true}); } catch (e) {} }, 60);
  }
}
function weichenDone(){ return (T.s.weichen || []).every(wz => !T.assign.has(wz.g) || T.weichOk.has(wz.g)) && (T.s.weichen || []).every(wz => !isOpen(wz.g) || T.weichOk.has(wz.g)); }
function renderWeiche(cards){
  const wz = T.weiche, W = WEICHE[wz.k], g = T.s.g[wz.g];
  setInstr('Weiche! Bevor der Waggon weiterfährt, prüft ihr eine Frage.');
  const box = h('div', {class:'weiche'}, icon('weiche') + '<div><span class="who">Weiche für „' + esc(gWords(g).map(i => T.s.w[i]).join(' ')) + '“</span><p>' + esc(W.q) + '</p></div>');
  const row = h('div', {class:'row', style:'justify-content:flex-start'});
  row.appendChild(btn('Ja: ' + W.yes, () => Game.weicheAnswer(true), 'primary'));
  row.appendChild(btn('Nein: ' + W.no, () => Game.weicheAnswer(false), 'primary'));

function indizCard(s){
  const el = h('div', {class:'indiz'}), focus = WAGONS[s.wagen].focus, last = s.w.length - 1;
  const cm = gsCommas(s, range(0, last), false);
  const wd = i => { let w = s.w[i]; if (i === 0) w = cap(w); if (i === last) w += s.end; else if (cm.has(i)) w += ','; return w; };
  const segs = origTokens(s).map(tk => {
    if (tk.k === 'lok' || tk.k === 'sl') return '<span style="--bg:var(--c-p)">' + esc(wd(tk.k === 'lok' ? s.lok : s.sl)) + '</span>';
    const g = s.g[tk.gi], on = focus.some(f => f === g.t || (f === 'ADV' && g.t.indexOf('ADV') === 0)) || (s.plus && s.plus.indexOf(g.t) >= 0);
    return '<span style="--bg:' + (on ? TYPES[g.t].col : 'var(--paper-2)') + '">' + esc(gWords(g).map(wd).join(' ')) + '</span>';
  }).join('');
  const shaky = save.detektiv && save.shaky.indexOf(s.id) >= 0;
  el.innerHTML = icon(s.sym) + '<div><div class="meta"><span>' + esc(WAGONS[s.wagen].name) + ' · ' + esc(PEOPLE[s.who] || 'Erzählung') + '</span>' + (s.pflicht ? '<span class="flag">⚑ wichtiges Indiz</span>' : '') + '</div><div class="isent">' + segs + '</div><p>' + esc(s.indiz) + '</p></div>';
  if (shaky) el.setAttribute('data-shaky', '1');
  return el;
}

/* =========================================================
   8. Spielablauf
   ========================================================= */
const Game = {
  kernTap(i, el){
    if (!T || T.busy || T.step !== 'kern') return; const s = T.s;
    if (i === s.lok || i === s.sl){
      if (T.found.has(i)) return; T.found.add(i); Snd.play('pick');
      if (T.found.has(s.lok) && (s.sl === null || T.found.has(s.sl))){
        Snd.play('right'); T.kernMsg = s.sl !== null ? 'Gefunden: ein Prädikat aus zwei Teilen! Vorne die Lok, hinten das Schlusslicht.' : 'Gefunden: der Kern des Satzes, unsere Lok!'; fb(T.kernMsg);
        T.busy = true; setPaw(null); renderTrain(); setTimeout(() => { T.busy = false; this.afterKern(); }, 900);
      } else { fb('Richtig! Gehört noch etwas dazu?'); renderTrain(); if (GD(s).kern) this.guide(); }
    } else {
      T.wrong++; T.clean = false; Snd.play('wrong'); const u = el.parentNode; u.classList.add('wobble'); setTimeout(() => u.classList.remove('wobble'), 500);
      const inGs = s.gsi >= 0 && i >= s.g[s.gsi].a && i <= s.g[s.gsi].b;
      fb(inGs ? 'Dieses Wort gehört zum Nebensatz. Gesucht ist der Kern des ganzen Satzes.' : 'Das ist nicht der Kern. Fragt: Was passiert hier?'); this.autoHelp();
    }
  },
  kernDone(){
    if (!T || T.step !== 'kern') return;
    if (!T.found.size){ fb('Tippt zuerst das Wort an, das sagt, was passiert.'); Snd.play('hmm'); return; }
    if (T.s.sl !== null && !T.found.has(T.s.sl)){ fb('Da fehlt noch ein Teil. Schaut auch ans Satzende!'); Snd.play('hmm'); return; }
    if (!T.found.has(T.s.lok)){ fb('Da fehlt noch ein Teil: das gebeugte Verb an Platz 2.'); Snd.play('hmm'); }
  },
  afterKern(){
    T.order = initialOrder(T.s); T.sel = new Set(); T.wrong = 0; T.help = 0; T.coupled = new Set();
    if (T.s.gsi >= 0){ T.coupled.add(T.s.gsi); T.step = 'klappen'; fb(''); renderTrain(); renderTools(); setPaw(() => $('#train .unit.klapp .car')); return; }
    this.startRangieren();
  },
  klapp(){
    if (!T || T.step !== 'klappen' || T.klapped) return; const s = T.s;
    T.klapped = true; Snd.play('couple'); setPaw(null);
    const short = (s.g[s.gsi].a === 0 ? cap(s.g[s.gsi].gs) : s.g[s.gsi].gs);
    renderTrain(); renderTools();
    this.hold('Klapp! Aus dem ganzen Nebensatz wird „' + short + '“, und der Satz bleibt richtig. Der Nebensatz ist also ein ganzes Satzglied.', 'ida', 'Aufklappen ▸',
      () => { T.klapped = false; T.klappDone = true; T.kernMsg = ''; Snd.play('couple'); this.startRangieren(true); });
  },
  startRangieren(keep){
    T.step = 'rangieren'; if (!keep){ T.order = initialOrder(T.s); T.coupled = new Set(); if (T.s.gsi >= 0) T.coupled.add(T.s.gsi); } T.sel = new Set(); T.wrong = 0; T.help = 0;
    if (this.autoCouple()){ renderTrain(); renderTools(); T.busy = true; setTimeout(() => { if (!T) return; T.busy = false; this.finishRangieren((T.kernMsg ? T.kernMsg + ' ' : '') + 'Nur ein Waggon neben der Lok: Er kuppelt sich von selbst. '); }, 700); return; }
    renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide();
  },
  looseTap(i){
    if (!T || T.busy || T.step !== 'rangieren') return;
    if (T.sel.has(i)) T.sel.delete(i); else T.sel.add(i); Snd.play('click');
    renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide();
  },
  classify(sel){
    const s = T.s;
    for (let gi = 0; gi < s.g.length; gi++) if (!T.coupled.has(gi) && setEq(sel, gWords(s.g[gi]))) return {kind:'ok', gi};
    if (s.ambig && setEq(sel, s.ambig.sel)) return {kind:'ambig'};
    if (s.auchOk && s.auchOk.some(a => setEq(sel, a))) return {kind:'auchok'};
    for (const g of s.g){ const ws = gWords(g); if (sel.every(i => ws.indexOf(i) >= 0)) return {kind:'teil'}; }
    const full = s.g.filter(g => gWords(g).every(i => sel.indexOf(i) >= 0));
    if (full.length >= 2 && setEq(sel, flat(full.map(gWords)))) return {kind:'zwei'};
    return {kind:'schief'};
  },
  moveFront(order, sel, wagon){
    const ss = new Set(sel), front = wagon ? [wagon] : sel.map(i => ({k:'w', i}));
    const rest = order.filter(t => !(t.k === 'w' && ss.has(t.i)) && t.k !== 'lok' && t.k !== 'sl');
    const out = front.concat([{k:'lok'}], rest); if (T.s.sl !== null) out.push({k:'sl'}); return out;
  },
  autoCouple(){
    const loose = T.order.filter(t => t.k === 'w').map(t => t.i); if (!loose.length) return true;
    const gis = new Set(loose.map(i => gOf(T.s, i)));
    if (gis.size === 1){ const gi = Array.from(gis)[0]; if (setEq(loose, gWords(T.s.g[gi]))){
      const pos = T.order.findIndex(t => t.k === 'w'), o = T.order.filter(t => t.k !== 'w'); o.splice(pos, 0, {k:'g', gi}); T.order = o; T.coupled.add(gi); return true; } }
    return false;
  },
  pfeife(){
    if (!T || T.busy || T.step !== 'rangieren' || !T.sel.size) return;
    const sel = Array.from(T.sel).sort((a, b) => a - b), c = this.classify(sel), s = T.s, wit = s.who === 'erz' ? 'ida' : s.who; T.sel.clear(); T.busy = true; setPaw(null);
    if (c.kind === 'ok'){
      Snd.play('whistle'); T.order = this.moveFront(T.order, sel, {k:'g', gi:c.gi}); T.coupled.add(c.gi);
      setTimeout(() => Snd.play('couple'), 380); Snd.play('right');
      fb('Klingt richtig! Diese Wörter fahren zusammen: ein Satzglied.'); renderTrain(); renderTools();
      setTimeout(() => { if (!T) return; T.busy = false; T.help = 0;
        if (this.autoCouple()){ Snd.play('couple'); this.finishRangieren('Klingt richtig! Der letzte Waggon kuppelt sich von selbst. '); }
        else { renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide(); } }, 1100);
      return;
    }
    Snd.play('whistle'); T.tmpOrder = this.moveFront(T.order, sel, null); T.bad = c.kind === 'ambig' ? null : new Set(sel); renderTrain(); renderTools();
    if (c.kind === 'ambig'){
      setTimeout(() => { if (!T) return; Scene.reaction('ida', '?'); Snd.play('hmm');
        this.hold(s.ambig.ida, 'ida', 'Weiter ▸', () => { Scene.reaction(wit, '!');
          this.hold(s.ambig.ans, wit, 'Weiter ▸', () => { T.tmpOrder = null; renderTrain(); renderTools(); fb(s.ambig.then, 'ida'); }); }); }, 450);
      return;
    }
    const msg = {auchok:'Klingt gut, aber da fährt noch etwas mit.', teil:'Klingt schief. Da gehört noch etwas dazu.', zwei:'Das sind zwei Waggons auf einmal. Probiert es einzeln.', schief:'Hm, so klingt der Satz schief. Probiert eine andere Gruppe.'}[c.kind];
    setTimeout(() => { if (c.kind !== 'auchok'){ Snd.play('wrong'); Scene.reaction(wit, '?'); } fb(msg); }, 450);
    setTimeout(() => { if (!T) return; T.tmpOrder = null; T.bad = null; T.busy = false; T.wrong++; T.clean = false; renderTrain(); renderTools(); this.autoHelp(); }, 2000);
  },
  finishRangieren(prefix){
    if (!T) return;
    const msg = (prefix || '') + 'Alle Waggons gekuppelt! Jetzt fahren sie zurück, so wie es gesagt wurde.';
    T.order = origTokens(T.s).map(t => t.k === 'g' ? {k:'g', gi:t.gi} : {k:t.k}); T.sel = new Set(); renderTrain();
    if (!openGlieder().length && !T.s.attr){ T.busy = true; setTimeout(() => { if (!T) return; T.busy = false; this.success(msg); }, 900); return; }
    this.hold(msg, 'ida', 'Weiter ▸', () => { if (openGlieder().length) this.startFragen(); else this.afterFragen(); });
  },
  /* Erst lesen, dann weiter: Meldung bleibt stehen, bis jemand „Weiter“ tippt. */
  hold(text, who, label, next){
    if (!T) return;
    T.busy = true; T.holding = true; setPaw(null); showKomma(false); fb(text, who); $('#app').classList.add('holding');
    setInstr('Lest in Ruhe. Dann tippt auf „' + (label || 'Weiter').replace(' ▸', '') + '“.');
    const b = btn(label || 'Weiter ▸', () => { if (!T || !T.holding) return; T.holding = false; T.busy = false; $('#app').classList.remove('holding'); showKomma(true); next(); }, 'primary pulse');
    b.id = 'holdBtn'; setActions([b]); reveal($('#fb'));
    setTimeout(() => { try { b.focus({preventScroll:true}); } catch (e) {} }, 40);
  },
  startFragen(){
    T.step = 'fragen'; T.wrong = 0; T.help = 0; T.assign = new Map(); T.pick = null; T.weiche = null; T.weichOk = new Set();
    const s = T.s, open = openGlieder();
    const cards = open.map(gi => ({id:'c' + gi, f:s.g[gi].f, t:s.g[gi].t, gi}));
    (s.traps || []).slice(0, trapCount()).forEach((tr, j) => cards.push({id:'t' + j, f:tr[1], t:tr[0], gi:null}));
    T.cards = shuffle(cards, s.id); fb(''); renderTrain(); renderTools(); if (GD(s).fragen) this.guide();
  },
  cardTap(id){
    if (!T || T.busy || T.step !== 'fragen' || T.weiche) return; Snd.play('click');
    if (T.pick && T.pick.kind === 'wagon'){ this.assign(T.pick.gi, id); return; }
    T.pick = T.pick && T.pick.kind === 'card' && T.pick.id === id ? null : {kind:'card', id};
    renderTrain(); renderTools(); if (GD(T.s).fragen) this.guide();
  },
  wagonTap(gi){
    if (!T || T.busy || T.step !== 'fragen' || T.weiche) return; Snd.play('click');
    if (T.pick && T.pick.kind === 'card'){ this.assign(gi, T.pick.id); return; }
    if (T.assign.has(gi)){ T.assign.delete(gi); T.pick = null; renderTrain(); renderTools(); return; }
    T.pick = T.pick && T.pick.kind === 'wagon' && T.pick.gi === gi ? null : {kind:'wagon', gi};
    renderTrain(); renderTools();
  },
  assign(gi, cid){
    T.assign.forEach((v, k) => { if (v === cid) T.assign.delete(k); });
    T.assign.set(gi, cid); T.pick = null; Snd.play('couple');
    const wz = (T.s.weichen || []).find(x => x.g === gi);
    if (wz && !T.weichOk.has(gi)){ T.weiche = wz; Snd.play('switch'); fb(''); renderTrain(); renderTools(); return; }
    fb(openGlieder().every(g => T.assign.has(g)) && weichenDone() ? 'Alle Waggons haben ein Schild. Tippt auf „Ida notiert“!' : '');
    renderTrain(); renderTools(); if (GD(T.s).fragen) this.guide();
  },
  weicheAnswer(yes){
    if (!T || !T.weiche) return; const wz = T.weiche, W = WEICHE[wz.k], right = W.test(T.s.g[wz.g].t) === yes;
    if (right){ Snd.play('right'); T.weichOk.add(wz.g); T.weiche = null; fb('Richtig gestellt! ' + wz.probe); }
    else { Snd.play('hmm'); fb('Probiert es aus: ' + wz.probe, 'komma'); T.wrong++; T.clean = false; return; }
    renderTrain(); renderTools();
  },
  readback(){
    if (!T || T.busy || T.step !== 'fragen') return; const s = T.s;
    const typeOf = gi => (T.cards.find(c => c.id === T.assign.get(gi)) || {}).t;
    const wrong = openGlieder().filter(gi => typeOf(gi) !== s.g[gi].t);
    if (save.detektiv && !T.rueck && !T.free){ const i = save.shaky.indexOf(s.id); if (wrong.length && i < 0) save.shaky.push(s.id); if (!wrong.length && i >= 0) save.shaky.splice(i, 1); persist(); this.afterFragen(); return; }
    if (!wrong.length){ this.afterFragen(); return; }
    T.busy = true; T.wrong++; T.clean = false; setPaw(null);
    const fl = (s.fehl || []).find(f => wrong.indexOf(f[0]) >= 0 && typeOf(f[0]) === f[1]);
    const who = fl ? (fl[4] || (s.who === 'erz' ? 'ida' : s.who)) : null;
    const doWobble = () => wrong.forEach(gi => { const u = $('#train [data-key="g' + gi + '"]'); if (u){ u.classList.add('wobble'); setTimeout(() => u.classList.remove('wobble'), 500); } });
    if (fl){ Snd.play('hmm'); T.busy = false;
      this.hold(fl[2], 'ida', 'Weiter ▸', () => { Scene.reaction(who, '!'); Snd.play('wrong'); wrong.forEach(gi => T.assign.delete(gi)); renderTrain(); renderTools(); doWobble(); this.autoHelp(); fb(fl[3], who); });
      return; }
    Snd.play('wrong'); doWobble(); fb(wrong.some(gi => T.weichOk.has(gi)) ? 'Karte und Weiche passen nicht zusammen. Die Karte liegt wieder im Stapel.' : 'Hm, bei diesem Waggon bin ich unsicher. Die Karte liegt wieder im Stapel.');
    setTimeout(() => { if (!T) return; wrong.forEach(gi => T.assign.delete(gi)); T.busy = false; renderTrain(); renderTools(); this.autoHelp(); }, 1400);
  },
  afterFragen(){
    if (T.s.attr && !T.attrDone){ T.step = 'anhaenger'; T.attrFound = new Set(); T.wrong = 0; T.help = 0; fb(''); renderTrain(); renderTools(); return; }
    this.success();
  },
  anhTap(i, el){
    if (!T || T.step !== 'anhaenger' || T.busy) return; const k = attrOf(i);
    if (k >= 0){ if (T.attrFound.has(k)) return; T.attrFound.add(k); Snd.play('pick');
      const ph = T.s.attr[k].ph; if (ph && !T.free && save.phantom.indexOf(ph) < 0){ save.phantom.push(ph); persist(); toast('Neues Detail im Phantombild!'); }
      fb('Ein Anhänger! Er beschreibt ein Nomen genauer und fährt immer mit.'); renderTrain(); renderTools();
      if (T.attrFound.size === T.s.attr.length){ T.attrDone = true; T.busy = true; setTimeout(() => { T.busy = false; this.success(); }, 1000); }
    } else { T.wrong++; T.clean = false; Snd.play('wrong'); el.classList.add('wobble'); setTimeout(() => el.classList.remove('wobble'), 500); fb('Das ist kein Anhänger. Fragt: Was für ein …?'); this.autoHelp(); }
  },
  success(msg){
    const s = T.s; setPaw(null);
    Snd.play('right'); setTimeout(() => Snd.play('whistle'), 300); setTimeout(() => Snd.play('stamp'), 900);
    if (T.free){ T.step = 'stamp'; freeStamp(T.clean); persist(); updateTop(); fb(msg || ''); renderTrain(); renderTools(); return; }
    T.step = 'indiz';
    if (save.done.indexOf(s.id) < 0) save.done.push(s.id);
    if (!save.detektiv || T.rueck){ const i = save.shaky.indexOf(s.id); if (i >= 0) save.shaky.splice(i, 1); }
    if (s.phantom && save.phantom.indexOf(s.phantom) < 0){ save.phantom.push(s.phantom); setTimeout(() => toast('Neues Detail im Phantombild!'), 1200); }
    persist(); updateTop(); const nb = $('#nbBtn'); nb.classList.remove('bump'); void nb.offsetWidth; nb.classList.add('bump');
    fb(msg || ''); renderTrain(); renderTools();
  },
  taskDone(val){ if (!T) return; const d = T.done; if (save.mode === 'team'){ save.team = (save.team + 1) % 2; persist(); } T = null; renderTrain(); fb(''); $('#cards').innerHTML = ''; if (d) d(val); },
  exitFree(){ this.taskDone('exit'); },
  /* ---- Hilfe ---- */
  autoHelp(){ if (T && T.wrong >= helpThreshold() && T.help < 1){ T.help = 1; this.stupsen(); fb('Komma zeigt euch, wo ihr ansetzen könnt.', 'komma'); } },
  komma(){
    if (!T || T.busy || T.step === 'indiz' || T.step === 'stamp' || T.step === 'deduce') return; Snd.play('meow'); Scene.reaction('komma', '!', 900); T.clean = false;
    T.help = Math.min(3, T.help + 1);
    if (T.help === 1){ this.stupsen(); fb('Schaut mal hierhin.', 'komma'); } else if (T.help === 2) this.tipp(); else this.zeigen();
  },
  tipp(){
    let tip = TIPS.fragen;

/* ---------- Finale: Beweisführung ---------- */
function deduce(id){
  return wait(w => {
    const side = !!(WAGONS[id] && WAGONS[id].side);
    T = {step:'deduce', qi:0, ans:null, picked:[], wrongOpt:0, done:w.res, s:{who:'ida', plus:[]}, qs:side ? CASE_Q[id] : DEDUCE, pool:side ? id : null, title:side || DEMO ? 'Fall lösen' : 'Finale'};
    renderDeduce();
  });
}
function evidenceCards(){ const seen = {}, pool = T && T.pool; return Object.keys(TASKS).map(k => TASKS[k]).filter(s => { if (save.done.indexOf(s.id) < 0 || seen[s.indiz]) return false; if (pool ? (s.wagen !== pool || !s.bw) : !s.pflicht) return false; seen[s.indiz] = 1; return true; }); }
function deckFor(q){
  // Übersichtlich: need+1 passende Karten (wackelige zuerst) und 2 unpassende.
  if (!T.deck || T.deck.k !== q.k){
    const all = evidenceCards(), fits = s => (s.bw || []).indexOf(q.k) >= 0, need = needFor(q);
    const shakyFirst = arr => arr.sort((a, b) => (save.shaky.indexOf(b.id) >= 0) - (save.shaky.indexOf(a.id) >= 0));
    if (q.k === 'wer' && all.some(s => fits(s) && s.rolle)){
      // Wer-Frage mit Rollen: 2 belastende, 2 entlastende oder eingrenzende, 2 verlockende Gegen-Karten
      const by = r => shakyFirst(shuffle(all.filter(s => fits(s) && s.rolle === r), r + q.k));
      const list = by('belastet').slice(0, 2).concat(by('entlastet').concat(by('eng')).slice(0, 2), by('gegen').slice(0, 2));
      T.deck = {k:q.k, list:shuffle(list, 'd' + q.k)};
    } else {
      const ok = shakyFirst(shuffle(all.filter(fits), 'ok' + q.k)).slice(0, need + 1);
      const no = shuffle(all.filter(s => !fits(s)), 'no' + q.k).slice(0, 2);
      T.deck = {k:q.k, list:shuffle(ok.concat(no), 'd' + q.k)};
    }
  }
  return T.deck.list;
}
function needFor(q){ const valid = evidenceCards().filter(s => (s.bw || []).indexOf(q.k) >= 0 && !(q.k === 'wer' && s.rolle === 'gegen')).length; const want = q.need || (q.k === 'wann' ? 2 : save.niveau === 'meister' ? 3 : 2); return Math.min(want, valid); }

  tr.innerHTML = '<div class="plate"><p class="pq">' + esc(q.q) + '</p><div class="pans">' + (T.ans ? '<span class="tag light">' + optLabel(q.opts.find(o => o[0] === T.ans)) + '</span>' : '<span class="small">Antwort wählen</span>') +
    '</div><div class="pbel">' + T.picked.map(id => '<span class="mini">' + icon(TASKS[id].sym) + '<span>' + esc(TASKS[id].indiz) + '</span></span>').join('') +
    (T.ans ? range(T.picked.length + 1, need).map(() => '<span class="mini empty">Beleg</span>').join('') : '') + '</div></div>';

  } else {

function pickAnswer(k){
  if (!T || T.step !== 'deduce' || T.busy || T.ans) return;
  const q = T.qs[T.qi]; Snd.play('click');
  if (k !== q.ok){ const no = (q.noFor && q.noFor[k]) || q.no; T.wrongOpt++; Snd.play('hmm'); fb(no, 'ida'); if (T.wrongOpt >= helpThreshold()) fb(no + ' Komma tippt auf „' + cap(q.opts.find(o => o[0] === q.ok)[1]) + '“.', 'komma'); return; }
  Snd.play('right'); T.ans = k; fb(q.yes, 'ida'); renderDeduce();
}
function pickEvidence(id, el){
  if (!T || T.step !== 'deduce' || T.busy) return;
  const q = T.qs[T.qi], s = TASKS[id];
  if ((s.bw || []).indexOf(q.k) < 0){ Snd.play('wrong'); el.classList.add('wobble'); setTimeout(() => el.classList.remove('wobble'), 500); fb('Was genau zeigt diese Karte? „' + s.indiz + '“ Das beantwortet unsere Frage nicht.', 'ida'); return; }

    Snd.play('hmm'); fb('Moment: Diese Karte widerspricht einer anderen. Schauen wir uns den Satz noch einmal an.', 'ida');
    const keep = {qi:T.qi, ans:T.ans, picked:T.picked.slice(), wrongOpt:T.wrongOpt, done:T.done, deck:T.deck, qs:T.qs, pool:T.pool, title:T.title};
    Game.hold('Moment: Diese Karte widerspricht einer anderen. Schauen wir uns den Satz noch einmal an.', 'ida', 'Zur Rückblende ▸', () => {
      Game.runTask(id, {rueck:true}).then(() => { T = Object.assign({step:'deduce', s:{who:'ida', plus:[]}}, keep); acceptEvidence(id, 'Jetzt passt die Karte. Beleg angenommen!'); }).catch(() => {});
    });

  }

/* Spricht die Karte wirklich für die Antwort? (nur Karten mit Rolle, also die Wer-Frage im Finale) */
function roleCheck(q, s){
  if (!s.rolle || q.k !== 'wer') return null;
  if (s.rolle === 'gegen') return s.gegen || 'Spricht diese Karte wirklich für eure Antwort?';
  const need = needFor(q), picks = T.picked.map(id => TASKS[id]).concat([s]); if (picks.length < need) return null;
  const avail = r => (T.deck ? T.deck.list : []).some(c => c.rolle === r);
  if (avail('belastet') && !picks.some(p => p.rolle === 'belastet')) return 'Diese Karte hilft, sie grenzt den Kreis ein. Aber was belastet ' + (q.akk || 'ihn') + ' direkt? Wählt auch so eine Karte.';
  if (need >= 3 && avail('entlastet') && !picks.some(p => p.rolle === 'entlastet')) return 'Gut! Und warum war es kein anderer? Wählt noch eine Karte, die einen anderen Verdächtigen entlastet.';

function acceptEvidence(id, msg){

function advance(msg){

  if (T.qi + 1 >= T.qs.length){ Snd.play('fanfare'); Game.hold(msg + ' ' + (T.pool || DEMO ? 'Fall gelöst!' : 'Fall gelöst! Jetzt fehlt nur noch der Beweis auf dem Tisch.'), 'ida', 'Weiter ▸', closeDeduce); return; }

let RUN = 0;

async function runWagon(id, from){
  from = from || 0; const my = ++RUN, alive = () => my === RUN;
  wagonId = id; const cfg = WAGONS[id];
  Scene.setup(cfg); Talk.hide(); fb(''); T = null; renderTrain(); renderHead(); setPaw(null);
  Snd.setTheme(cfg.music); updateTop();

    for (let b = from; b < cfg.beats.length; b++){
      if (!alive()) return;

      const beat = cfg.beats[b];
      if (beat.task){ if (!taskAvailable(beat.task)) continue; await Game.runTask(beat.task); }
      else if (beat.say) await Game.say(beat.say, beat.t);

      else if (beat.act === 'whistle'){ Snd.play('whistle'); await sleep(700); }
      else if (beat.act === 'depart'){ Scene.speaker = null; Scene.depart(); await sleep(4200); }
      else if (beat.act === 'tunnel'){ Scene.speaker = null; Snd.play('whistle'); Scene.flags.dark = true; if (Snd.ctx && save.sound) Snd.noise(3, .45, 0, 'lowpass', 220);
        await sleep(1400); Scene.flags.gone = true; await sleep(1500); Scene.flags.dark = false; await sleep(150); Scene.flags.dark = true; await sleep(120); Scene.flags.dark = false; await sleep(400); }
      else if (beat.act === 'kommaSprung'){ const k = Scene.actors.komma; if (k){ k.on = 'floor'; Snd.play('meow'); Scene.hop('komma'); await Scene.walk('komma', .54, 600); Scene.reaction('komma', '!', 1400); } await sleep(500); }

        if (save.phantom.indexOf('gesicht') < 0){ save.phantom.push('gesicht'); persist(); } await sleep(1200); }
    }
    if (!alive()) return;
    Talk.hide(); Scene.speaker = null;
    if (cfg.side){
      if (save.cases.indexOf(id) < 0){ save.cases.push(id); bahnAdd(10); }
      save.pos = {wagen:'ende', beat:0}; persist();
      if (CASES.every(c => save.cases.indexOf(c) >= 0) && save.stickers.indexOf('nacht') < 0){ save.stickers.push('nacht'); persist(); await reward('nacht'); if (!alive()) return; }

    }

    if (save.eggs && missing.length){ const r = Scene.eggRects()[missing[0]]; if (r) Scene.sparkle = {x:r[0] + Math.floor(r[2] / 2), y:r[1] + 2, until:performance.now() + 2600}; Scene.reaction('komma', '!', 1600); await sleep(1600); if (!alive()) return; }
    if (save.stickers.indexOf(cfg.sticker) < 0) save.stickers.push(cfg.sticker);
    let next = ORDER[ORDER.indexOf(id) + 1];
    save.pos = next ? {wagen:next, beat:0} : {wagen:'ende', beat:0}; persist();
    await reward(cfg.sticker); if (!alive()) return;
    if (DEMO){ save.pos = {wagen:'ende', beat:0}; persist(); demoEnd(); return; }
    if (id === 'fin' || id === 'bericht'){
      if (id === 'fin'){ const go = await choice('Idas Fallbericht', 'Wollt ihr noch Idas Bericht für die Bahnpolizei schreiben? Darin geht es um Nebensätze (Meisterstufe).', 'Fallbericht schreiben ▸', 'Zum Gruppenfoto ▸'); if (!alive()) return;

    }

}

function drawPhantom(c){
  const P = save.phantom, has = x => P.indexOf(x) >= 0;
  let rows = PHANTOM.map(r => r.split(''));
  if (has('gesicht')){ rows = SPR_SRC.sekretaer.map(r => r.split('')); }
  else {
    if (has('schlafrock')) rows.forEach((r, y) => { if (y >= 8 && y <= 21) for (let x = 0; x < r.length; x++) if (r[x] === 'g') r[x] = y % 2 ? 'R' : 't'; });
    if (has('aermel')) rows.forEach((r, y) => { if (y >= 9 && y <= 14) for (let x = 9; x <= 11; x++) if (r[x] === 'g') r[x] = y % 2 ? 'R' : 't'; });
    if (has('tasche')){ rows[16][4] = 'k'; rows[16][5] = 'k'; rows[16][6] = 'k'; rows[17][4] = 'k'; rows[17][6] = 'k'; }
    if (has('blau')) rows[17][5] = 'U';
    if (has('schluessel')){ rows[14][12] = 'y'; rows[15][12] = 'y'; rows[15][13] = 'y'; }
  }
  const g = gridCanvas(rows.map(r => r.join(''))); c.width = g.width + 4; c.height = g.height + 4; c.getContext('2d').drawImage(g, 2, 2);
  const u = uPx(); c.style.width = c.width * u * 3 + 'px'; c.style.height = c.height * u * 3 + 'px';
}

/* Sichtbarer Bereich: In manchen App-Fenstern und Vorschauen ist das Spielfeld unten abgeschnitten,
   obwohl der Browser die volle Höhe meldet. Ein unsichtbarer Messstreifen zeigt, wie viel wirklich zu sehen ist. */
function watchClip(){
  if (!window.IntersectionObserver) return;
  const probe = document.createElement('div'); probe.setAttribute('aria-hidden', 'true');
  probe.style.cssText = 'position:fixed;left:50%;top:0;width:1px;height:100%;pointer-events:none;opacity:0;z-index:-1';
  document.body.appendChild(probe);
  const th = []; for (let i = 0; i <= 100; i++) th.push(i / 100);
  let cur = 0, tm = 0;
  const apply = px => { if (Math.abs(px - cur) < 3 && !(px === 0 && cur !== 0)) return; cur = px; document.documentElement.style.setProperty('--clipB', px + 'px'); };
  try {
    new IntersectionObserver(es => { const e = es[es.length - 1], b = e.boundingClientRect, r = e.intersectionRect;
      let hid = 0; if (e.isIntersecting && r.height > 0 && r.top <= b.top + 2){ hid = Math.round(b.bottom - r.bottom); if (hid < 0 || hid > b.height * .4) hid = 0; }
      clearTimeout(tm); tm = setTimeout(() => apply(hid), 150);
    }, {threshold: th}).observe(probe);
  } catch (e) {}
}
function boot(data){
  if (data && data.v){ save = Object.assign({}, DEF, data); fixSave(); }

  window.addEventListener('scroll', placePaw, true);

  ['touchstart', 'mousedown'].forEach(ev => document.addEventListener(ev, () => Snd.resume(), {passive:true}));
  try { const t = document.createElement('div'); t.style.cssText = 'display:flex;flex-direction:column;gap:1px;position:absolute;visibility:hidden'; t.innerHTML = '<div></div><div></div>'; document.body.appendChild(t); if (t.scrollHeight !== 1) document.documentElement.className += ' nogap'; document.body.removeChild(t); } catch (e) {}
  showStart();
}
