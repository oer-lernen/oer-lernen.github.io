/* Layout: Kopfleiste, Szene (Canvas), Gleis mit dem Satz-Zug, Pult mit fester Knopfleiste.
   Große Bildschirme: alles auf einem Bildschirm. Kleine Bildschirme: Seite scrollt, Knöpfe bleiben unten sichtbar. */
:root{
  --night:#241c33; --night-2:#33284a; --night-3:#4a3c66;
  --ink:#2a2238; --muted:#685b7a;
  --paper:#fff7ec; --paper-2:#f0e2cd; --paper-3:#e3d1b6;
  --track:#cfe5dc; --rail:#7d695c;
  --desk:#ebe2f4; --desk-2:#d8cbea;
  --lamp:#ffd56b; --lamp-2:#e09a2f; --lamp-3:#ffe9a8;
  --rose:#f2a7b5;
  --c-p:#f6a85a; --c-p-2:#cf6f22;
  --c-s:#86b3ee; --c-ao:#94d68c; --c-do:#c99d76; --c-go:#bc9be8; --c-po:#f2db6b; --c-adv:#f39cc4; --c-later:#dcd5e2;
  --u:2px;
  --fs:calc(var(--u) * 12); --lh:calc(var(--u) * 15);
  --fs-s:12px; --lh-s:15px;
  --fs-l:calc(var(--u) * 24);
  --gut:16px;
  color-scheme:light;
}
@media (max-width:520px) and (-webkit-min-device-pixel-ratio:2),(max-width:520px) and (min-resolution:2dppx),(max-height:520px) and (-webkit-min-device-pixel-ratio:2),(max-height:520px) and (min-resolution:2dppx){:root{--u:1.5px;--gut:8px}}
@media (min-width:1500px) and (min-height:840px){:root{--u:3px;--fs-s:24px;--lh-s:30px}}
@media (min-width:2500px) and (min-height:1350px){:root{--u:4px;--fs-s:36px;--lh-s:45px}}
html{height:100%;box-sizing:border-box}
*,*:before,*:after{box-sizing:border-box}
body{height:100%;margin:0;background:#241c33;background:var(--night);color:#2a2238;color:var(--ink);font-family:"Aurora Pixel",ui-monospace,"Segoe UI",system-ui,sans-serif;font-size:24px;font-size:var(--fs);line-height:var(--lh);
  padding:8px 16px;padding-left:var(--gut);padding-right:var(--gut);overflow:hidden;
  -webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (padding:max(1px,2px)){body{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-ms-touch-action:manipulation;touch-action:manipulation}
button:focus{outline:var(--u) dashed var(--lamp-2);outline-offset:calc(var(--u) * 3)}
button:focus:not(:focus-visible){outline:none}
.pxi{width:calc(var(--u) * var(--w,9));height:calc(var(--u) * var(--h,9));display:block;flex:0 0 auto}
p{margin:0}

/* Pixel-Rahmen (Ecken ausgespart) */
.pb{box-shadow:0 calc(var(--u) * -1) 0 0 var(--ink),0 var(--u) 0 0 var(--ink),calc(var(--u) * -1) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink)}
.pbd{box-shadow:0 calc(var(--u) * -1) 0 0 var(--ink),0 var(--u) 0 0 var(--ink),calc(var(--u) * -1) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink),0 calc(var(--u) * 3) 0 0 rgba(42,34,56,.28)}

.car,.qcard,.indiz,.panel,.seg,.tabs button,.libcard,.dlg,.neu,.panel .close,#fb .por,.dlg .por,.tag,.weiche,.plate,.opt,.ecard,.mini,.polaroid,.wd.anh,.ticket,.linecard,.heft{box-shadow:0 calc(var(--u) * -1) 0 0 var(--ink),0 var(--u) 0 0 var(--ink),calc(var(--u) * -1) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink)}
.btn,.tb,.panel{box-shadow:0 calc(var(--u) * -1) 0 0 var(--ink),0 var(--u) 0 0 var(--ink),calc(var(--u) * -1) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink),0 calc(var(--u) * 3) 0 0 rgba(42,34,56,.28)}

/* ---------- App ---------- */
#app{height:100%;max-width:2400px;margin:0 auto;display:flex;flex-direction:column}
#app>*+*{margin-top:calc(var(--u) * 4)}
#topbar{flex:0 0 auto;display:flex;align-items:center;color:var(--paper);padding:0 var(--u)}
#where{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin:0 calc(var(--u) * 5)}
#where b{font-weight:400;color:var(--lamp)}
#where span{color:#cbbfe0;margin-left:calc(var(--u) * 5)}
.tb-right{display:flex;flex:0 0 auto}
.tb{display:flex;align-items:center;background:var(--paper);color:var(--ink);padding:calc(var(--u) * 2) calc(var(--u) * 4);min-height:44px;min-width:44px;justify-content:center;margin:var(--u) var(--u) var(--u) calc(var(--u) * 6)}
.tb .pxi+span,.tb span+span{margin-left:calc(var(--u) * 3)}
.tb:active{-webkit-transform:translateY(var(--u));transform:translateY(var(--u))}
.tb .num{background:var(--ink);color:var(--paper);padding:0 calc(var(--u) * 2)}
#laterne{background:var(--night-3);color:var(--paper);margin-left:var(--u)}
.bump{-webkit-animation:bump .5s steps(4);animation:bump .5s steps(4)}
@-webkit-keyframes bump{30%{-webkit-transform:translateY(calc(var(--u) * -4))}}
@keyframes bump{30%{transform:translateY(calc(var(--u) * -4))}}

/* ---------- Szene ---------- */
#scene{position:relative;flex:0 0 40%;min-height:110px;overflow:hidden;background:var(--night-2);margin-left:var(--u);margin-right:var(--u);cursor:pointer}
#sceneCv{position:absolute;left:0;top:0;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated}
#hotspots{position:absolute;left:0;top:0;right:0;bottom:0}
.hot{position:absolute;background:transparent}

/* ---------- Gleis ---------- */
#trainzone{position:relative;flex:0 0 auto;background:var(--track);margin-left:var(--u);margin-right:var(--u);padding:calc(var(--u) * 3) calc(var(--u) * 5) calc(var(--u) * 5);min-height:calc(var(--u) * 50)}
#tzHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:var(--fs-s);line-height:var(--lh-s);min-height:var(--lh-s)}
#tzHead:empty{display:none}
@media (min-width:761px) and (min-height:621px){#tzHead{float:left;margin-right:calc(var(--u) * 4)}#train{clear:both}}
@media (min-width:761px) and (min-height:621px) and (max-height:900px){#scene{flex-basis:34%}}
.tag{display:inline-flex;align-items:center;background:var(--ink);color:var(--paper);padding:var(--u) calc(var(--u) * 3);margin:var(--u)}
.tag .pxi{width:calc(var(--fs-s) * .9);height:calc(var(--fs-s) * .9);margin-right:calc(var(--u) * 2)}
.tag.light{background:var(--paper);color:var(--ink)}
#train{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;padding-top:calc(var(--u) * 8);min-height:calc(var(--u) * 36)}
#train>.unit{margin:calc(var(--u) * 5) calc(var(--u) * 3) 0}
#klammer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(var(--u) * 4)}
.unit:after{content:"";position:absolute;left:calc(var(--u) * -4);right:calc(var(--u) * -4);bottom:0;height:var(--u);background:var(--rail)}
.unit:before{content:"";position:absolute;left:calc(var(--u) * -4);right:calc(var(--u) * -4);bottom:var(--u);height:calc(var(--u) * 2);
  background:repeating-linear-gradient(90deg,var(--rail) 0,var(--rail) var(--u),transparent var(--u),transparent calc(var(--u) * 5))}
.car{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--paper);padding:calc(var(--u) * 3) calc(var(--u) * 6);white-space:nowrap;text-shadow:1px 0 0 currentColor;margin:var(--u) var(--u) 0}
.car:after{content:"";position:absolute;left:calc(var(--u) * -7);bottom:calc(var(--u) * 3);width:calc(var(--u) * 6);height:var(--u);background:var(--ink)}
#train>.unit:first-child .car:after{display:none}
.wheels{display:flex;justify-content:space-between;width:62%;min-width:calc(var(--u) * 12);height:calc(var(--u) * 3);margin-top:var(--u)}
.wheels i{width:calc(var(--u) * 3);height:calc(var(--u) * 3);background:var(--ink)}
.unit.sel .car{-webkit-transform:translateY(calc(var(--u) * -5));transform:translateY(calc(var(--u) * -5));background:#fff0bf}
.unit.sel .car,.unit.wagon.picked .car{box-shadow:0 calc(var(--u) * -1) 0 0 var(--ink),0 var(--u) 0 0 var(--ink),calc(var(--u) * -1) 0 0 0 var(--ink),var(--u) 0 0 0 var(--ink),0 0 0 calc(var(--u) * 3) var(--lamp)}
.unit.found .car,.unit.lok .car,.unit.sl .car{background:var(--c-p)}
.unit.bad .car{background:#f7d6dc}
.chim{position:absolute;left:calc(var(--u) * 5);top:calc(var(--u) * -6);width:calc(var(--u) * 4);height:calc(var(--u) * 5);background:var(--ink)}
.lampf{position:absolute;right:calc(var(--u) * -3);top:calc(var(--u) * 4);width:calc(var(--u) * 2);height:calc(var(--u) * 3);background:var(--lamp)}
.lampr{position:absolute;right:calc(var(--u) * -3);bottom:calc(var(--u) * 3);width:calc(var(--u) * 2);height:calc(var(--u) * 3);background:#e5484d}
.unit.wagon .car{padding-top:0;padding-left:calc(var(--u) * 5);padding-right:calc(var(--u) * 5)}
.roof{-ms-flex-item-align:stretch;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:var(--fs-s);line-height:var(--lh-s);text-shadow:none;
  background:var(--paper-3);background:var(--stripe,var(--paper-3));margin:0 calc(var(--u) * -5) calc(var(--u) * 2);padding:var(--u) calc(var(--u) * 3);min-height:calc(var(--u) * 5);border-bottom:var(--u) solid var(--ink)}
.roof .pxi{width:calc(var(--fs-s) * .85);height:calc(var(--fs-s) * .85);margin-right:calc(var(--u) * 2)}
.unit.wagon.open .roof{background:repeating-linear-gradient(90deg,var(--paper-2) 0,var(--paper-2) calc(var(--u) * 3),var(--paper) calc(var(--u) * 3),var(--paper) calc(var(--u) * 6))}
.unit.wagon.later .roof{background:var(--c-later);color:var(--muted)}
.unit.wagon.later .car{background:#f7f3f8}
.wds{display:flex}
.wds .wd+.wd{margin-left:calc(var(--u) * 4)}
.wobble{-webkit-animation:wob .45s steps(6);animation:wob .45s steps(6)}
@-webkit-keyframes wob{20%{-webkit-transform:translateX(calc(var(--u) * -3))}40%{-webkit-transform:translateX(calc(var(--u) * 3))}60%{-webkit-transform:translateX(calc(var(--u) * -2))}80%{-webkit-transform:translateX(calc(var(--u) * 2))}}
@keyframes wob{20%{transform:translateX(calc(var(--u) * -3))}40%{transform:translateX(calc(var(--u) * 3))}60%{transform:translateX(calc(var(--u) * -2))}80%{transform:translateX(calc(var(--u) * 2))}}

/* ---------- Pult ---------- */
#tools{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--desk);margin-left:var(--u);margin-right:var(--u);margin-bottom:var(--u)}
#tlScroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 2)}

function gridCanvas(rows){
  const hh = rows.length, w = Math.max.apply(null, rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const x = c.getContext('2d');
  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++){ const col = PAL[r[i]]; if (!col) continue; x.fillStyle = col; x.fillRect(i, y, 1, 1); } });
  return c;
}
function flipCanvas(c){ const f = document.createElement('canvas'); f.width = c.width; f.height = c.height; const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }

const SPR = {};
function buildSprites(){
  for (const id in SPR_SRC){
    const rows = SPR_SRC[id], n = gridCanvas(rows);
    const b = EYES[id] ? gridCanvas(blinkRows(rows, EYES[id], id === 'komma')) : n;
    SPR[id] = {n, nf: flipCanvas(n), b, bf: flipCanvas(b), w: n.width, h: n.height};
  }
}
function pxsvg(rows, cls){
  const hh = rows.length, w = Math.max.apply(null, rows.map(r => r.length)), paths = {};
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++){ const ch = r[x]; if (ch === '.' || ch === ' ') continue; (paths[ch] = paths[ch] || []).push('M' + x + ' ' + y + 'h1v1h-1z'); } });
  let s = '<svg class="pxi ' + (cls || '') + '" style="--w:' + w + ';--h:' + hh + '" viewBox="0 0 ' + w + ' ' + hh + '" shape-rendering="crispEdges" aria-hidden="true" focusable="false">';
  for (const ch in paths) s += '<path fill="' + (ch === 'f' ? 'currentColor' : PAL[ch]) + '" d="' + paths[ch].join('') + '"/>';
  return s + '</svg>';
}

        '<span class="band">' + icon(c.t) + '</span><span class="q">' + esc(c.f) + '</span>');
      b.style.setProperty('--tc', ty.col); b.addEventListener('click', () => Game.cardTap(c.id)); cards.appendChild(b);
    });
    const ready = openGlieder().every(gi => T.assign.has(gi)) && weichenDone();
    const rb = btn('Ida notiert', () => Game.readback(), 'primary' + (ready ? ' pulse' : ''), 'nb'); rb.id = 'readBtn'; rb.disabled = !ready || T.busy;
    setActions([rb]);
  } else if (T.step === 'anhaenger'){
    setInstr('Sucht die Anhänger: Welche Wörter beschreiben ein Nomen genauer? Tippt sie an.');
    setActions([h('span', {class:'small'}, (T.attrFound.size + ' von ' + T.s.attr.length + ' Anhängern'))]);
  } else if (T.step === 'indiz'){
    setInstr(save.detektiv ? 'Notiert! Im Detektivmodus prüft Ida erst im Finale.' : 'Neues Indiz für die Fallakte!');
    const ic = indizCard(T.s); cards.appendChild(ic); reveal(ic);
    const hf = heftOn(T.s), w = btn(hf ? 'Ins Heft ▸' : 'Weiter ▸', () => hf ? heftPanel(T.s, () => Game.taskDone()) : Game.taskDone(), 'primary'); setActions([w]);
    setTimeout(() => { try { w.focus({preventScroll:true}); } catch (e) {} }, 60);
  } else if (T.step === 'stamp'){
    setInstr(T.clean ? 'Goldstempel! Ganz ohne Hilfe geschafft.' : 'Stempel! Satz geschafft.');
    const tc = ticketCard(T.clean); cards.appendChild(tc); reveal(tc);
    const hf = heftOn(T.s), nx = btn(hf ? 'Ins Heft ▸' : 'Nächster Satz ▸', () => hf ? heftPanel(T.s, () => Game.taskDone()) : Game.taskDone(), 'primary');
    setActions([btn('Aussteigen', () => Game.exitFree()), nx]);
    setTimeout(() => { try { nx.focus({preventScroll:true}); } catch (e) {} }, 60);
  }
}
function weichenDone(){ return (T.s.weichen || []).every(wz => !T.assign.has(wz.g) || T.weichOk.has(wz.g)) && (T.s.weichen || []).every(wz => !isOpen(wz.g) || T.weichOk.has(wz.g)); }
function renderWeiche(cards){
  const wz = T.weiche, W = WEICHE[wz.k], g = T.s.g[wz.g];
  setInstr('Weiche! Bevor der Waggon weiterfährt, prüft ihr eine Frage.');
  const box = h('div', {class:'weiche'}, icon('weiche') + '<div><span class="who">Weiche für „' + esc(gWords(g).map(i => T.s.w[i]).join(' ')) + '“</span><p>' + esc(W.q) + '</p></div>');
  const row = h('div', {class:'row', style:'justify-content:flex-start'});
  row.appendChild(btn('Ja: ' + W.yes, () => Game.weicheAnswer(true), 'primary'));
  row.appendChild(btn('Nein: ' + W.no, () => Game.weicheAnswer(false), 'primary'));
  box.appendChild(row); cards.appendChild(box); reveal(box);
}

function indizCard(s){
  const el = h('div', {class:'indiz'}), focus = WAGONS[s.wagen].focus, last = s.w.length - 1;
  const cm = gsCommas(s, range(0, last), false);
  const wd = i => { let w = s.w[i]; if (i === 0) w = cap(w); if (i === last) w += s.end; else if (cm.has(i)) w += ','; return w; };
  const segs = origTokens(s).map(tk => {
    if (tk.k === 'lok' || tk.k === 'sl') return '<span style="--bg:var(--c-p)">' + esc(wd(tk.k === 'lok' ? s.lok : s.sl)) + '</span>';
    const g = s.g[tk.gi], on = focus.some(f => f === g.t || (f === 'ADV' && g.t.indexOf('ADV') === 0)) || (s.plus && s.plus.indexOf(g.t) >= 0);
    return '<span style="--bg:' + (on ? TYPES[g.t].col : 'var(--paper-2)') + '">' + esc(gWords(g).map(wd).join(' ')) + '</span>';
  }).join('');
  const shaky = save.detektiv && save.shaky.indexOf(s.id) >= 0;
  el.innerHTML = icon(s.sym) + '<div><div class="meta"><span>' + esc(WAGONS[s.wagen].name) + ' · ' + esc(PEOPLE[s.who] || 'Erzählung') + '</span>' + (s.pflicht ? '<span class="flag">⚑ wichtiges Indiz</span>' : '') + '</div><div class="isent">' + segs + '</div><p>' + esc(s.indiz) + '</p></div>';
  if (shaky) el.setAttribute('data-shaky', '1');
  return el;
}

/* =========================================================
   8. Spielablauf
   ========================================================= */
const Game = {
  kernTap(i, el){
    if (!T || T.busy || T.step !== 'kern') return; const s = T.s;
    if (i === s.lok || i === s.sl){
      if (T.found.has(i)) return; T.found.add(i); Snd.play('pick');
      if (T.found.has(s.lok) && (s.sl === null || T.found.has(s.sl))){
        Snd.play('right'); T.kernMsg = s.sl !== null ? 'Gefunden: ein Prädikat aus zwei Teilen! Vorne die Lok, hinten das Schlusslicht.' : 'Gefunden: der Kern des Satzes, unsere Lok!'; fb(T.kernMsg);
        T.busy = true; setPaw(null); renderTrain(); setTimeout(() => { T.busy = false; this.afterKern(); }, 900);
      } else { fb('Richtig! Gehört noch etwas dazu?'); renderTrain(); if (GD(s).kern) this.guide(); }
    } else {
      T.wrong++; T.clean = false; Snd.play('wrong'); const u = el.parentNode; u.classList.add('wobble'); setTimeout(() => u.classList.remove('wobble'), 500);
      const inGs = s.gsi >= 0 && i >= s.g[s.gsi].a && i <= s.g[s.gsi].b;
      fb(inGs ? 'Dieses Wort gehört zum Nebensatz. Gesucht ist der Kern des ganzen Satzes.' : 'Das ist nicht der Kern. Fragt: Was passiert hier?'); this.autoHelp();
    }
  },
  kernDone(){
    if (!T || T.step !== 'kern') return;
    if (!T.found.size){ fb('Tippt zuerst das Wort an, das sagt, was passiert.'); Snd.play('hmm'); return; }
    if (T.s.sl !== null && !T.found.has(T.s.sl)){ fb('Da fehlt noch ein Teil. Schaut auch ans Satzende!'); Snd.play('hmm'); return; }
    if (!T.found.has(T.s.lok)){ fb('Da fehlt noch ein Teil: das gebeugte Verb an Platz 2.'); Snd.play('hmm'); }
  },
  afterKern(){
    T.order = initialOrder(T.s); T.sel = new Set(); T.wrong = 0; T.help = 0; T.coupled = new Set();
    if (T.s.gsi >= 0){ T.coupled.add(T.s.gsi); T.step = 'klappen'; fb(''); renderTrain(); renderTools(); setPaw(() => $('#train .unit.klapp .car')); return; }
    this.startRangieren();
  },
  klapp(){
    if (!T || T.step !== 'klappen' || T.klapped) return; const s = T.s;
    T.klapped = true; Snd.play('couple'); setPaw(null);
    const short = (s.g[s.gsi].a === 0 ? cap(s.g[s.gsi].gs) : s.g[s.gsi].gs);
    renderTrain(); renderTools();
    this.hold('Klapp! Aus dem ganzen Nebensatz wird „' + short + '“, und der Satz bleibt richtig. Der Nebensatz ist also ein ganzes Satzglied.', 'ida', 'Aufklappen ▸',
      () => { T.klapped = false; T.klappDone = true; T.kernMsg = ''; Snd.play('couple'); this.startRangieren(true); });
  },
  startRangieren(keep){
    T.step = 'rangieren'; if (!keep){ T.order = initialOrder(T.s); T.coupled = new Set(); if (T.s.gsi >= 0) T.coupled.add(T.s.gsi); } T.sel = new Set(); T.wrong = 0; T.help = 0;
    if (this.autoCouple()){ renderTrain(); renderTools(); T.busy = true; setTimeout(() => { if (!T) return; T.busy = false; this.finishRangieren((T.kernMsg ? T.kernMsg + ' ' : '') + 'Nur ein Waggon neben der Lok: Er kuppelt sich von selbst. '); }, 700); return; }
    renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide();
  },
  looseTap(i){
    if (!T || T.busy || T.step !== 'rangieren') return;
    if (T.sel.has(i)) T.sel.delete(i); else T.sel.add(i); Snd.play('click');
    renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide();
  },
  classify(sel){
    const s = T.s;
    for (let gi = 0; gi < s.g.length; gi++) if (!T.coupled.has(gi) && setEq(sel, gWords(s.g[gi]))) return {kind:'ok', gi};
    if (s.ambig && setEq(sel, s.ambig.sel)) return {kind:'ambig'};
    if (s.auchOk && s.auchOk.some(a => setEq(sel, a))) return {kind:'auchok'};
    for (const g of s.g){ const ws = gWords(g); if (sel.every(i => ws.indexOf(i) >= 0)) return {kind:'teil'}; }
    const full = s.g.filter(g => gWords(g).every(i => sel.indexOf(i) >= 0));
    if (full.length >= 2 && setEq(sel, flat(full.map(gWords)))) return {kind:'zwei'};
    return {kind:'schief'};
  },
  moveFront(order, sel, wagon){
    const ss = new Set(sel), front = wagon ? [wagon] : sel.map(i => ({k:'w', i}));
    const rest = order.filter(t => !(t.k === 'w' && ss.has(t.i)) && t.k !== 'lok' && t.k !== 'sl');
    const out = front.concat([{k:'lok'}], rest); if (T.s.sl !== null) out.push({k:'sl'}); return out;
  },
  autoCouple(){
    const loose = T.order.filter(t => t.k === 'w').map(t => t.i); if (!loose.length) return true;
    const gis = new Set(loose.map(i => gOf(T.s, i)));
    if (gis.size === 1){ const gi = Array.from(gis)[0]; if (setEq(loose, gWords(T.s.g[gi]))){
      const pos = T.order.findIndex(t => t.k === 'w'), o = T.order.filter(t => t.k !== 'w'); o.splice(pos, 0, {k:'g', gi}); T.order = o; T.coupled.add(gi); return true; } }
    return false;
  },
  pfeife(){
    if (!T || T.busy || T.step !== 'rangieren' || !T.sel.size) return;
    const sel = Array.from(T.sel).sort((a, b) => a - b), c = this.classify(sel), s = T.s, wit = s.who === 'erz' ? 'ida' : s.who; T.sel.clear(); T.busy = true; setPaw(null);
    if (c.kind === 'ok'){
      Snd.play('whistle'); T.order = this.moveFront(T.order, sel, {k:'g', gi:c.gi}); T.coupled.add(c.gi);
      setTimeout(() => Snd.play('couple'), 380); Snd.play('right');
      fb('Klingt richtig! Diese Wörter fahren zusammen: ein Satzglied.'); renderTrain(); renderTools();
      setTimeout(() => { if (!T) return; T.busy = false; T.help = 0;
        if (this.autoCouple()){ Snd.play('couple'); this.finishRangieren('Klingt richtig! Der letzte Waggon kuppelt sich von selbst. '); }
        else { renderTrain(); renderTools(); if (GD(T.s).rangieren) this.guide(); } }, 1100);
      return;
    }
    Snd.play('whistle'); T.tmpOrder = this.moveFront(T.order, sel, null); T.bad = c.kind === 'ambig' ? null : new Set(sel); renderTrain(); renderTools();
    if (c.kind === 'ambig'){
      setTimeout(() => { if (!T) return; Scene.reaction('ida', '?'); Snd.play('hmm');
        this.hold(s.ambig.ida, 'ida', 'Weiter ▸', () => { Scene.reaction(wit, '!');
          this.hold(s.ambig.ans, wit, 'Weiter ▸', () => { T.tmpOrder = null; renderTrain(); renderTools(); fb(s.ambig.then, 'ida'); }); }); }, 450);
      return;
    }
    const msg = {auchok:'Klingt gut, aber da fährt noch etwas mit.', teil:'Klingt schief. Da gehört noch etwas dazu.', zwei:'Das sind zwei Waggons auf einmal. Probiert es einzeln.', schief:'Hm, so klingt der Satz schief. Probiert eine andere Gruppe.'}[c.kind];
    setTimeout(() => { if (c.kind !== 'auchok'){ Snd.play('wrong'); Scene.reaction(wit, '?'); } fb(msg); }, 450);
    setTimeout(() => { if (!T) return; T.tmpOrder = null; T.bad = null; T.busy = false; T.wrong++; T.clean = false; renderTrain(); renderTools(); this.autoHelp(); }, 2000);
  },
  finishRangieren(prefix){
    if (!T) return;
    const msg = (prefix || '') + 'Alle Waggons gekuppelt! Jetzt fahren sie zurück, so wie es gesagt wurde.';
    T.order = origTokens(T.s).map(t => t.k === 'g' ? {k:'g', gi:t.gi} : {k:t.k}); T.sel = new Set(); renderTrain();
    if (!openGlieder().length && !T.s.attr){ T.busy = true; setTimeout(() => { if (!T) return; T.busy = false; this.success(msg); }, 900); return; }
    this.hold(msg, 'ida', 'Weiter ▸', () => { if (openGlieder().length) this.startFragen(); else this.afterFragen(); });
  },
  /* Erst lesen, dann weiter: Meldung bleibt stehen, bis jemand „Weiter“ tippt. */
  hold(text, who, label, next){
    if (!T) return;
    T.busy = true; T.holding = true; setPaw(null); showKomma(false); fb(text, who); $('#app').classList.add('holding');
    setInstr('Lest in Ruhe. Dann tippt auf „' + (label || 'Weiter').replace(' ▸', '') + '“.');
    const b = btn(label || 'Weiter ▸', () => { if (!T || !T.holding) return; T.holding = false; T.busy = false; $('#app').classList.remove('holding'); showKomma(true); next(); }, 'primary pulse');
    b.id = 'holdBtn'; setActions([b]); reveal($('#fb'));
    setTimeout(() => { try { b.focus({preventScroll:true}); } catch (e) {} }, 40);
  },
  startFragen(){
    T.step = 'fragen'; T.wrong = 0; T.help = 0; T.assign = new Map(); T.pick = null; T.weiche = null; T.weichOk = new Set();
    const s = T.s, open = openGlieder();
    const cards = open.map(gi => ({id:'c' + gi, f:s.g[gi].f, t:s.g[gi].t, gi}));
    (s.traps || []).slice(0, trapCount()).forEach((tr, j) => cards.push({id:'t' + j, f:tr[1], t:tr[0], gi:null}));
    T.cards = shuffle(cards, s.id); fb(''); renderTrain(); renderTools(); if (GD(s).fragen) this.guide();
  },
  cardTap(id){
    if (!T || T.busy || T.step !== 'fragen' || T.weiche) return; Snd.play('click');
    if (T.pick && T.pick.kind === 'wagon'){ this.assign(T.pick.gi, id); return; }
    T.pick = T.pick && T.pick.kind === 'card' && T.pick.id === id ? null : {kind:'card', id};
    renderTrain(); renderTools(); if (GD(T.s).fragen) this.guide();
  },
  wagonTap(gi){
    if (!T || T.busy || T.step !== 'fragen' || T.weiche) return; Snd.play('click');
    if (T.pick && T.pick.kind === 'card'){ this.assign(gi, T.pick.id); return; }
    if (T.assign.has(gi)){ T.assign.delete(gi); T.pick = null; renderTrain(); renderTools(); return; }
    T.pick = T.pick && T.pick.kind === 'wagon' && T.pick.gi === gi ? null : {kind:'wagon', gi};
    renderTrain(); renderTools();
  },
  assign(gi, cid){
    T.assign.forEach((v, k) => { if (v === cid) T.assign.delete(k); });
    T.assign.set(gi, cid); T.pick = null; Snd.play('couple');
    const wz = (T.s.weichen || []).find(x => x.g === gi);
    if (wz && !T.weichOk.has(gi)){ T.weiche = wz; Snd.play('switch'); fb(''); renderTrain(); renderTools(); return; }
    fb(openGlieder().every(g => T.assign.has(g)) && weichenDone() ? 'Alle Waggons haben ein Schild. Tippt auf „Ida notiert“!' : '');
    renderTrain(); renderTools(); if (GD(T.s).fragen) this.guide();
  },
  weicheAnswer(yes){
    if (!T || !T.weiche) return; const wz = T.weiche, W = WEICHE[wz.k], right = W.test(T.s.g[wz.g].t) === yes;
    if (right){ Snd.play('right'); T.weichOk.add(wz.g); T.weiche = null; fb('Richtig gestellt! ' + wz.probe); }
    else { Snd.play('hmm'); fb('Probiert es aus: ' + wz.probe, 'komma'); T.wrong++; T.clean = false; return; }
    renderTrain(); renderTools();
  },
  readback(){
    if (!T || T.busy || T.step !== 'fragen') return; const s = T.s;
    const typeOf = gi => (T.cards.find(c => c.id === T.assign.get(gi)) || {}).t;
    const wrong = openGlieder().filter(gi => typeOf(gi) !== s.g[gi].t);
    if (save.detektiv && !T.rueck && !T.free){ const i = save.shaky.indexOf(s.id); if (wrong.length && i < 0) save.shaky.push(s.id); if (!wrong.length && i >= 0) save.shaky.splice(i, 1); persist(); this.afterFragen(); return; }
    if (!wrong.length){ this.afterFragen(); return; }
    T.busy = true; T.wrong++; T.clean = false; setPaw(null);
    const fl = (s.fehl || []).find(f => wrong.indexOf(f[0]) >= 0 && typeOf(f[0]) === f[1]);
    const who = fl ? (fl[4] || (s.who === 'erz' ? 'ida' : s.who)) : null;
    const doWobble = () => wrong.forEach(gi => { const u = $('#train [data-key="g' + gi + '"]'); if (u){ u.classList.add('wobble'); setTimeout(() => u.classList.remove('wobble'), 500); } });
    if (fl){ Snd.play('hmm'); T.busy = false;
      this.hold(fl[2], 'ida', 'Weiter ▸', () => { Scene.reaction(who, '!'); Snd.play('wrong'); wrong.forEach(gi => T.assign.delete(gi)); renderTrain(); renderTools(); doWobble(); this.autoHelp(); fb(fl[3], who); });
      return; }
    Snd.play('wrong'); doWobble(); fb(wrong.some(gi => T.weichOk.has(gi)) ? 'Karte und Weiche passen nicht zusammen. Die Karte liegt wieder im Stapel.' : 'Hm, bei diesem Waggon bin ich unsicher. Die Karte liegt wieder im Stapel.');
    setTimeout(() => { if (!T) return; wrong.forEach(gi => T.assign.delete(gi)); T.busy = false; renderTrain(); renderTools(); this.autoHelp(); }, 1400);
  },
  afterFragen(){
    if (T.s.attr && !T.attrDone){ T.step = 'anhaenger'; T.attrFound = new Set(); T.wrong = 0; T.help = 0; fb(''); renderTrain(); renderTools(); return; }
    this.success();
  },
  anhTap(i, el){
    if (!T || T.step !== 'anhaenger' || T.busy) return; const k = attrOf(i);
    if (k >= 0){ if (T.attrFound.has(k)) return; T.attrFound.add(k); Snd.play('pick');
      const ph = T.s.attr[k].ph; if (ph && !T.free && save.phantom.indexOf(ph) < 0){ save.phantom.push(ph); persist(); toast('Neues Detail im Phantombild!'); }
      fb('Ein Anhänger! Er beschreibt ein Nomen genauer und fährt immer mit.'); renderTrain(); renderTools();
      if (T.attrFound.size === T.s.attr.length){ T.attrDone = true; T.busy = true; setTimeout(() => { T.busy = false; this.success(); }, 1000); }
    } else { T.wrong++; T.clean = false; Snd.play('wrong'); el.classList.add('wobble'); setTimeout(() => el.classList.remove('wobble'), 500); fb('Das ist kein Anhänger. Fragt: Was für ein …?'); this.autoHelp(); }
  },
  success(msg){
    const s = T.s; setPaw(null);
    Snd.play('right'); setTimeout(() => Snd.play('whistle'), 300); setTimeout(() => Snd.play('stamp'), 900);
    if (T.free){ T.step = 'stamp'; freeStamp(T.clean); persist(); updateTop(); fb(msg || ''); renderTrain(); renderTools(); return; }
    T.step = 'indiz';
    if (save.done.indexOf(s.id) < 0) save.done.push(s.id);
    if (!save.detektiv || T.rueck){ const i = save.shaky.indexOf(s.id); if (i >= 0) save.shaky.splice(i, 1); }
    if (s.phantom && save.phantom.indexOf(s.phantom) < 0){ save.phantom.push(s.phantom); setTimeout(() => toast('Neues Detail im Phantombild!'), 1200); }
    persist(); updateTop(); const nb = $('#nbBtn'); nb.classList.remove('bump'); void nb.offsetWidth; nb.classList.add('bump');
    fb(msg || ''); renderTrain(); renderTools();
  },
  taskDone(val){ if (!T) return; const d = T.done; if (save.mode === 'team'){ save.team = (save.team + 1) % 2; persist(); } T = null; renderTrain(); fb(''); $('#cards').innerHTML = ''; if (d) d(val); },
  exitFree(){ this.taskDone('exit'); },
  /* ---- Hilfe ---- */
  autoHelp(){ if (T && T.wrong >= helpThreshold() && T.help < 1){ T.help = 1; this.stupsen(); fb('Komma zeigt euch, wo ihr ansetzen könnt.', 'komma'); } },
  komma(){
    if (!T || T.busy || T.step === 'indiz' || T.step === 'stamp' || T.step === 'deduce') return; Snd.play('meow'); Scene.reaction('komma', '!', 900); T.clean = false;
    T.help = Math.min(3, T.help + 1);
    if (T.help === 1){ this.stupsen(); fb('Schaut mal hierhin.', 'komma'); } else if (T.help === 2) this.tipp(); else this.zeigen();
  },
  tipp(){
    let tip = TIPS.fragen;
    if (T.step === 'kern') tip = T.s.gsi >= 0 ? TIPS.kernGs : T.s.sl !== null ? TIPS.kern2 : TIPS.kern1;
    else if (T.step === 'rangieren') tip = TIPS.rangieren;
    else if (T.step === 'klappen') tip = TIPS.klapp;
    else if (T.step === 'anhaenger') tip = TIPS.anh;
    else if (T.s.tip) tip = TIPS[T.s.tip];
    fb(tip, 'komma');
  },
  stupsen(){
    const s = T.s;
    if (T.step === 'kern'){ const i = [s.lok, s.sl].find(i => i !== null && !T.found.has(i)); setPaw(() => $('#train [data-key="w' + i + '"] .car')); }
    else if (T.step === 'klappen') setPaw(() => $('#train .unit.klapp .car'));
    else if (T.step === 'rangieren'){ const gi = s.g.findIndex((g, k) => !T.coupled.has(k)); if (gi >= 0) setPaw(() => $('#train [data-key="w' + s.g[gi].a + '"] .car')); }
    else if (T.step === 'fragen'){ const gi = openGlieder().find(g => !T.assign.has(g)); setPaw(gi !== undefined ? () => $('#train [data-key="g' + gi + '"] .car') : () => $('#readBtn')); }
    else if (T.step === 'anhaenger'){ const k = s.attr.findIndex((a, i) => !T.attrFound.has(i)); if (k >= 0) setPaw(() => $('#train [data-w="' + s.attr[k].w[0] + '"]')); }
    setTimeout(() => { if (T && T.help <= 1 && !GD(T.s)[T.step]) setPaw(null); }, 4000);
  },
  zeigen(){
    const s = T.s; fb('Komma macht einen Schritt vor. Den Rest schafft ihr!', 'komma');
    if (T.step === 'kern'){ const i = [s.lok, s.sl].find(i => i !== null && !T.found.has(i)); this.kernTap(i, $('#train [data-key="w' + i + '"] .car')); }
    else if (T.step === 'klappen') this.klapp();
    else if (T.step === 'rangieren'){ const gi = s.g.findIndex((g, k) => !T.coupled.has(k)); if (gi < 0) return; T.sel = new Set(gWords(s.g[gi])); renderTrain(); setTimeout(() => this.pfeife(), 500); }
    else if (T.step === 'fragen'){

/* ---------- Finale: Beweisführung ---------- */
function deduce(id){
  return wait(w => {
    const side = !!(WAGONS[id] && WAGONS[id].side);
    T = {step:'deduce', qi:0, ans:null, picked:[], wrongOpt:0, done:w.res, s:{who:'ida', plus:[]}, qs:side ? CASE_Q[id] : DEDUCE, pool:side ? id : null, title:side ? 'Fall lösen' : 'Finale'};
    renderDeduce();

}
function evidenceCards(){ const seen = {}, pool = T && T.pool; return Object.keys(TASKS).map(k => TASKS[k]).filter(s => { if (save.done.indexOf(s.id) < 0 || seen[s.indiz]) return false; if (pool ? (s.wagen !== pool || !s.bw) : !s.pflicht) return false; seen[s.indiz] = 1; return true; }); }
function deckFor(q){

    const shakyFirst = arr => arr.sort((a, b) => (save.shaky.indexOf(b.id) >= 0) - (save.shaky.indexOf(a.id) >= 0));
    if (q.k === 'wer' && all.some(s => fits(s) && s.rolle)){
      // Wer-Frage mit Rollen: 2 belastende, 2 entlastende oder eingrenzende, 2 verlockende Gegen-Karten
      const by = r => shakyFirst(shuffle(all.filter(s => fits(s) && s.rolle === r), r + q.k));
      const list = by('belastet').slice(0, 2).concat(by('entlastet').concat(by('eng')).slice(0, 2), by('gegen').slice(0, 2));
      T.deck = {k:q.k, list:shuffle(list, 'd' + q.k)};
    } else {
      const ok = shakyFirst(shuffle(all.filter(fits), 'ok' + q.k)).slice(0, need + 1);
      const no = shuffle(all.filter(s => !fits(s)), 'no' + q.k).slice(0, 2);
      T.deck = {k:q.k, list:shuffle(ok.concat(no), 'd' + q.k)};

function needFor(q){ const valid = evidenceCards().filter(s => (s.bw || []).indexOf(q.k) >= 0 && !(q.k === 'wer' && s.rolle === 'gegen')).length; const want = q.need || (q.k === 'wann' ? 2 : save.niveau === 'meister' ? 3 : 2); return Math.min(want, valid); }

    '</div><div class="pbel">' + T.picked.map(id => '<span class="mini">' + icon(TASKS[id].sym) + '<span>' + esc(TASKS[id].indiz) + '</span></span>').join('') +

function pickAnswer(k){
  if (!T || T.step !== 'deduce' || T.busy || T.ans) return;

  if (k !== q.ok){ const no = (q.noFor && q.noFor[k]) || q.no; T.wrongOpt++; Snd.play('hmm'); fb(no, 'ida'); if (T.wrongOpt >= helpThreshold()) fb(no + ' Komma tippt auf „' + cap(q.opts.find(o => o[0] === q.ok)[1]) + '“.', 'komma'); return; }

function pickEvidence(id, el){

/* Spricht die Karte wirklich für die Antwort? (nur Karten mit Rolle, also die Wer-Frage im Finale) */
function roleCheck(q, s){

function acceptEvidence(id, msg){

async function runWagon(id, from){

      if (id === 'fin'){ const go = await choice('Idas Fallbericht', 'Wollt ihr noch Idas Bericht für die Bahnpolizei schreiben? Darin geht es um Nebensätze (Meisterstufe).', 'Fallbericht schreiben ▸', 'Zum Gruppenfoto ▸'); if (!alive()) return;

    }

    cars.forEach((c, i) => { const x = x0 + i * 38; R(x, ty - 6, 36, 14, '#1b1428'); R(x + 1, ty - 5, 34, 12, c); R(x + 1, ty - 6, 34, 2, '#2c2444');

  sec('Spielmodus', segment('Spielmodus', [['solo', 'Allein'], ['team', 'Im Team']], save.mode, v => { save.mode = v; persist(); if (T && !T.holding && T.step !== 'deduce') renderTools(); }));
  sec('Heftauftrag (Satzanalyse ins Heft übertragen)', segment('Heftauftrag', [['aus', 'aus'], ['wichtig', 'wichtige Indizien'], ['alle', 'jeder Satz']], save.heft, v => { save.heft = v; persist(); }));
  sec('Umfang im Heft', segment('Umfang im Heft', [['kapitel', 'passend zum Kapitel'], ['voll', 'alles bestimmen']], save.heftUmfang, v => { save.heftUmfang = v; persist(); }));
  sec('Detektivmodus (Fehler zeigen sich erst im Finale)', segment('Detektivmodus', [['1', 'an'], ['0', 'aus']], save.detektiv ? '1' : '0', v => { save.detektiv = v === '1'; persist(); }));
  sec('Musik', segment('Musik', [['1', 'an'], ['0', 'aus']], save.music ? '1' : '0', v => { save.music = v === '1'; persist(); Snd.apply(); }));
  sec('Klänge', segment('Klänge', [['1', 'an'], ['0', 'aus']], save.sound ? '1' : '0', v => { save.sound = v === '1'; persist(); Snd.apply(); setTonIcon(); }));
  sec('Ostereier (Krimi-Klassiker)', segment('Ostereier', [['1', 'an'], ['0', 'aus']], save.eggs ? '1' : '0', v => { save.eggs = v === '1'; persist(); Scene.placeHotspots(); }));
  const resetRow = sec('Fortschritt', btn('Fortschritt löschen', () => {
    const w = h('div', {class:'warn'}, '<p>Alle Indizien, Aufkleber und Bibliothekskarten löschen?</p>');
    const r = h('div', {class:'menu-row'}); r.appendChild(btn('Ja, löschen', () => { stopRun(); resetProgress(); closePanel(); $('#card').hidden = true; showStart(); })); r.appendChild(btn('Abbrechen', () => w.parentNode.removeChild(w), 'primary')); w.appendChild(r);
    resetRow.parentNode.insertBefore(w, resetRow.nextSibling);
  }));
  tm.appendChild(h('p', {class:'small', style:'color:var(--muted);margin-top:12px'}, 'Gespeichert werden nur Fortschritt und Aufkleber, lokal in diesem Browser. Keine Namen, keine Konten, kein Internet.'));
}
function jumpTo(id){
  stopRun(); $('#card').hidden = true; Night.stop();
  if ($('#app').hidden){ enterGame(id, 0); return; }
  save.pos = {wagen:id, beat:0}; persist(); titleCard(id).then(() => runWagon(id, 0)).catch(() => {});
}

/* ---------- Kopfleiste ---------- */
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFS(){
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => toast('Vollbild ist hier nicht möglich.')); }
  } catch (e) { toast('Vollbild ist hier nicht möglich.'); }
}
function setTonIcon(){ const b = $('#tonBtn'); b.innerHTML = icon(save.sound ? 'ton' : 'tonx') + '<span class="lbl">' + (save.sound ? 'Ton an' : 'Ton aus') + '</span>'; b.setAttribute('aria-label', save.sound ? 'Ton ausschalten' : 'Ton einschalten'); }
function initTop(){
  const lat = $('#laterne'); lat.innerHTML = icon('lat');
  let lp = 0, fired = false;
  const down = window.PointerEvent ? ['pointerdown'] : ['touchstart', 'mousedown'], up = window.PointerEvent ? ['pointerup', 'pointerleave', 'pointercancel'] : ['touchend', 'touchcancel', 'mouseup', 'mouseleave'];
  down.forEach(ev => lat.addEventListener(ev, () => { fired = false; clearTimeout(lp); lp = setTimeout(() => { fired = true; teacherMenu(); }, 650); }, {passive:true}));
  up.forEach(ev => lat.addEventListener(ev, () => clearTimeout(lp)));
  lat.addEventListener('click', e => { if (fired) return; if (e.detail === 0){ teacherMenu(); return; } toast('Lehrkraft-Menü: Laterne lange gedrückt halten.'); });
  lat.addEventListener('contextmenu', e => e.preventDefault());
  $('#nbBtn').addEventListener('click', () => notebook());
  $('#kofferBtn').innerHTML = icon('kof') + '<span class="lbl">Koffer</span>'; $('#kofferBtn').addEventListener('click', () => koffer());
  setTonIcon(); $('#tonBtn').addEventListener('click', () => { save.sound = !save.sound; save.music = save.sound; persist(); Snd.init(); Snd.apply(); setTonIcon(); });
  const fs = $('#fsBtn'); if (!fsOK) fs.hidden = true; fs.innerHTML = icon('fs') + '<span class="lbl">Vollbild</span>'; fs.addEventListener('click', toggleFS);
  const kb = $('#kommaBtn'); kb.innerHTML = icon('cat') + '<span>Komma fragen</span>'; kb.addEventListener('click', () => Game.komma());
}

/* =========================================================
   10. Start
   ========================================================= */
function boot(data){
  if (data && data.v){ save = Object.assign({}, DEF, data); fixSave(); }
  buildSprites(); Scene.init(); initTop();
  window.addEventListener('resize', () => { Night.resize(); drawKlammer(); placePaw(); });
  onResize($('#trainzone'), () => { drawKlammer(); placePaw(); });
  window.addEventListener('scroll', placePaw, true);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && panelClose) panelClose(); });
  ['touchstart', 'mousedown'].forEach(ev => document.addEventListener(ev, () => Snd.resume(), {passive:true}));
  try { const t = document.createElement('div'); t.style.cssText = 'display:flex;flex-direction:column;gap:1px;position:absolute;visibility:hidden'; t.innerHTML = '<div></div><div></div>'; document.body.appendChild(t); if (t.scrollHeight !== 1) document.documentElement.className += ' nogap'; document.body.removeChild(t); } catch (e) {}
  if (hot && hot.snapshot) hot.snapshot(() => save);
  showStart();
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});

})();
</script>
