:root {
  color-scheme: dark;
  --ink0: #120f22; --ink1: #1b1830; --ink2: #2a2140; --ink3: #3d3566; --line: #4b3f7a;
  --paper: #f4e6c8; --paper2: #fbf2dc; --cream: #fff1d6; --muted: #b9a9d6; --lav: #d9c8ff; --text-dark: #2a2233; --text-soft: #5b4f6f; --plum: #7a5a8f;
  --teal: #7fd6c2; --teal-deep: #1f3a38; --teal-ink: #1f7a66; --gold: #f6d36b; --orange: #f2994a; --coral: #ef8a7a; --coral-ink: #a8443a;
  --lamp: #fff0b0; --wood: #6b4f3a; --wood-lo: #4a3628;
  --pixel: 'Komma Pixel', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink0); color: var(--cream); font-family: var(--pixel); font-size: 20px; line-height: 1.4; overflow: hidden; -webkit-font-smoothing: none; }
button { font: inherit; }
.card, .co-bub, input.codein, #noteBody, .file, .pq { box-sizing: border-box; }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* Kopfleiste */
.hud { display: flex; align-items: center; gap: 8px 14px; padding-block: 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--ink1); border-bottom: 4px solid var(--ink3); min-width: 0; }
.hud-l, .hud-m, .hud-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-m { flex: 1 1 auto; }
.case { background: var(--paper); color: var(--text-dark); padding: 4px 10px; border: 3px solid var(--ink0); white-space: nowrap; }
.chap { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { padding: 2px 10px; border: 3px solid var(--line); white-space: nowrap; background: var(--ink2); }
.chip.s1 { background: #fff2b0; color: var(--text-dark); border-color: #c9a24a; }
.chip.s2 { background: #7a5895; color: var(--cream); border-color: #a86f9c; }
.chip.s3 { background: var(--teal-deep); color: var(--teal); border-color: var(--teal); }
.chip.gold { background: var(--gold); color: var(--text-dark); border-color: #b8903a; }
.hud-stat { color: var(--muted); white-space: nowrap; }
.hud-stat b { color: var(--cream); font-weight: normal; }

/* Knöpfe */
.btn { color: var(--cream); background: var(--ink2); border: 3px solid var(--line); min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink0); white-space: nowrap; position: relative; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink0); }
.btn:focus-visible, .stk:focus-visible, .file:focus-visible, .pq:focus-visible, #lupe button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.icon { width: 44px; padding: 0; }
.btn.primary { background: var(--teal); color: var(--ink0); border-color: var(--ink0); }
.btn.primary:hover { background: #a5e9d8; }
.btn.gold { background: var(--gold); color: var(--ink0); border-color: var(--ink0); }
.btn.big { min-height: 52px; padding: 0 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { display: block; flex: none; }
.ico { width: 20px; height: 20px; }
.dot { position: absolute; top: -6px; right: -6px; width: 12px; height: 12px; background: var(--gold); border: 2px solid var(--ink0); animation: twinkle 2.4s steps(2) infinite; }

/* Zimmer */
#room { height: 150px; overflow-x: auto; overflow-y: hidden; background: #b6a0c6; border-bottom: 4px solid var(--wood-lo); scrollbar-width: thin; transition: height .4s steps(4); }
#room svg { display: block; height: 100%; width: auto; margin: 0 auto; }
#app:not([data-mode="desk"]):not([data-mode="title"]) #room { height: 84px; }
@media (max-height: 900px) { #app:not([data-mode="desk"]):not([data-mode="title"]) #room { height: 52px; } }
#app:not([data-mode="desk"]) #room svg { filter: saturate(.7) brightness(.8); }
#app:not([data-mode="desk"]) .egg { pointer-events: none; }
.egg { cursor: pointer; }
.egg .spark { animation: twinkle 3.2s steps(2) infinite; }
.egg.found .spark { display: none; }
@keyframes twinkle { 0%, 70% { opacity: 0; } 80%, 92% { opacity: 1; } 100% { opacity: 0; } }

/* Arbeitsfläche: Dokument und Akte */
#work { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding-block: 14px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--wood); background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 48px); overflow: hidden; }
#paper { position: relative; min-height: 0; overflow-y: auto; background: var(--paper); color: var(--text-dark); border: 3px solid var(--ink0); box-shadow: 6px 6px 0 rgba(0,0,0,.45); padding: 16px 20px 20px; background-image: repeating-linear-gradient(180deg, transparent 0 33px, rgba(122,90,143,.18) 33px 35px); }
.doc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 3px dashed #c9b48e; padding-bottom: 8px; margin-bottom: 10px; }
.doc-typ { color: var(--plum); letter-spacing: 2px; }
.doc-head h2 { margin: 0; font-weight: normal; font-size: 30px; line-height: 1.1; }
.doc-von { color: var(--text-soft); }
.line { margin: 0; padding: 4px 8px 4px 34px; position: relative; line-height: 1.7; cursor: pointer; border: 2px solid transparent; }
.line:hover { background: rgba(255,240,176,.35); }
.line.on { background: var(--lamp); border-color: #e3c870; box-shadow: 0 0 0 4px rgba(255,240,176,.45); }
.line .nr { position: absolute; left: 6px; top: 4px; color: var(--plum); }
.line.ok .nr { color: var(--teal-ink); }
.line.fl { padding-right: 56px; }
.line .feder { position: absolute; right: 8px; top: 6px; display: flex; align-items: center; gap: 4px; color: var(--coral-ink); }
.line .feder b { font-weight: normal; }
.masche { background: #fff8e6; border-left: 6px solid var(--coral); padding: 8px 12px; }
.cm { color: var(--text-dark); }
.cm.fix { color: var(--teal-ink); background: #d9f3ea; padding: 0 2px; }
.cm.gone { color: var(--teal-ink); text-decoration: line-through; opacity: .7; }
.cm.gold { color: #8a6a10; }
.envelope { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.envelope .env-art { display: flex; gap: 14px; align-items: center; line-height: 1.25; }
.envelope { line-height: 1.5; }
.envelope p { margin: 0; max-width: 54ch; }
.env-meta { color: var(--text-soft); }
.env-st { font-weight: normal; color: var(--plum); }
.stamp { position: absolute; right: 18px; top: 18px; transform: rotate(-12deg); border: 5px solid currentColor; padding: 4px 12px; font-size: 30px; letter-spacing: 3px; color: var(--coral-ink); background: rgba(244,230,200,.7); animation: stampin .35s steps(3); pointer-events: none; }
.stamp.echt, .stamp.original { color: var(--teal-ink); }
@keyframes stampin { from { transform: rotate(-12deg) scale(1.6); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }

#akte { min-height: 0; overflow-y: auto; background: var(--ink1); border: 3px solid var(--ink3); box-shadow: 4px 4px 0 rgba(0,0,0,.45); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
#akte h3 { margin: 0; font-weight: normal; color: var(--gold); }
#akte p { margin: 0; }
.akte-k { color: var(--muted); }
.akte-row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 2px dashed var(--ink3); padding-bottom: 4px; }
.akte-row b { font-weight: normal; color: var(--cream); }
.spur { background: var(--ink2); border-left: 4px solid var(--gold); padding: 6px 10px; }
#cat { position: absolute; right: calc(var(--gut-r) + 316px); bottom: 10px; pointer-events: none; }
#cat.hop svg { animation: hop .5s steps(4); }
@keyframes hop { 50% { transform: translateY(-14px); } }
#toasts { position: absolute; bottom: 12px; right: var(--gut-r); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 5; pointer-events: none; max-width: calc(100% - 32px); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--ink2); border: 3px solid var(--gold); box-shadow: 4px 4px 0 #000; padding: 8px 12px; animation: pop .35s steps(4); }
.toast small { display: block; color: var(--gold); font-size: 20px; line-height: 1.1; }
.toast span { line-height: 1.2; }
@keyframes pop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Pult: Notiz, Lupenstreifen, Beweisleiste, Steuerung */
#dock { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lupe lupe" "proof proof" "note ctrl"; gap: 12px 16px; padding-block: 12px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--ink1); border-top: 4px solid var(--ink3); }
#note { grid-area: note; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; min-width: 0; }
.note-cat { padding-top: 6px; }
.note-cat svg { display: block; }
#noteBody { position: relative; min-width: 0; background: var(--paper); color: var(--text-dark); border: 3px solid var(--ink0); box-shadow: 4px 4px 0 var(--ink0); padding: 6px 14px 8px; max-height: 7.6em; min-height: 2.4em; overflow-y: auto; }
#note p { margin: 0; max-width: 72ch; }
/* Kurzer Stufenhinweis: eine schlanke Zeile statt einer großen Sprechblase */
#note.brief { align-items: center; }
#note.brief #noteBody { min-height: 0; padding: 2px 10px; background: transparent; color: var(--muted); border: 2px dashed var(--ink3); box-shadow: none; }
#note.brief .note-cat svg { width: 18px; height: auto; }
#note p + p { margin-top: 6px; }
#note .warn { color: #8a3f3f; }
#note .okk { color: #2f6a5c; }
#note .story { color: var(--text-soft); }
.linkish { background: none; border: 0; color: #4b3f7a; text-decoration: underline; padding: 0; cursor: pointer; text-align: left; }
#app[data-mode="desk"] #lupe, #app[data-mode="title"] #lupe, #app[data-mode="done"] #lupe { display: none; }
#lupe { grid-area: lupe; min-width: 0; background: var(--ink0); border: 3px solid var(--ink3); padding: 6px 10px 8px; }
.lupe-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 14px; color: var(--muted); }
.lnav { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.ln { width: 44px; height: 36px; padding: 0; background: var(--ink2); color: var(--cream); border: 3px solid var(--line); cursor: pointer; line-height: 1; }
.ln:hover { border-color: var(--teal); }
.ln[disabled] { opacity: .3; cursor: default; }
.lz { min-width: 5.6em; text-align: center; color: var(--cream); }
.lhint { color: var(--muted); }
.lupe-row { display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; padding-top: 4px; }
.lupe-row .w { font-size: 30px; line-height: 1.2; color: var(--cream); padding: 6px 2px; border: 3px solid transparent; background: none; }
.lupe-row button.w { cursor: pointer; border-color: var(--line); background: var(--ink2); margin: 0 1px; }
.lupe-row button.w:hover { border-color: var(--teal); }
.lupe-row button.w.hint { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,211,107,.35); }
.lupe-row .w.lift { transform: translateY(-14px); color: var(--teal); transition: transform .25s steps(3); }
.lupe-row .w.ts { border-bottom-color: var(--teal); }
.lupe-row .w.pf { color: var(--orange); }
.lupe-row .w.lamp { background: rgba(255,240,176,.18); }
.lupe-row .w.beleg { color: var(--gold); position: relative; }
.lupe-row .w.beleg::after { content: "Beweiswort"; position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -2px); font-size: 20px; line-height: 1; padding: 2px 6px; background: var(--gold); color: var(--ink0); white-space: nowrap; }
.lupe-row.pick button.w { border-style: dashed; border-color: var(--gold); }
.lupe-row.pick button.w:hover { border-style: solid; }
.g { width: 34px; height: 54px; margin: 0 2px; display: inline-flex; align-items: flex-end; justify-content: center; padding: 0 0 6px; background: transparent; border: 3px dashed rgba(185,169,214,.35); color: var(--cream); font-size: 40px; line-height: .6; cursor: pointer; }
.g:hover { border-color: var(--teal); border-style: solid; }
.g.has { border-color: transparent; }
.g.has:hover { border-color: var(--teal); }
.g.sus { border: 3px solid var(--coral); background: rgba(239,138,122,.18); }
.g.fix { color: var(--teal); }
.g.gone { color: var(--teal); }
.g.gone span { text-decoration: line-through; opacity: .6; }
.g.miss { border: 3px solid var(--coral); border-style: solid; }
.g.extra { color: var(--coral); }
.g.probe { border: 3px solid var(--gold); background: rgba(246,211,107,.18); }
.g.hint { border: 3px solid var(--gold); }
.g[disabled] { cursor: default; opacity: .9; }
.g .dot0 { width: 6px; height: 6px; background: rgba(185,169,214,.45); display: block; margin-bottom: 4px; }
.g.has .dot0, .g.fix .dot0 { display: none; }
#proof { grid-area: proof; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; min-width: 0; }
.pq-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.pq-q { flex: 1 1 auto; min-width: 0; color: var(--cream); }
.psteps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; color: var(--muted); }
.psteps li { padding: 0 8px; border: 2px solid var(--ink3); }
.psteps li.done { color: var(--teal); border-color: var(--teal-deep); }
.psteps li.on { color: var(--ink0); background: var(--gold); border-color: var(--gold); }
#ctrl { grid-area: ctrl; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.pq { display: flex; align-items: center; gap: 8px; min-height: 46px; min-width: 0; padding: 2px 12px; background: var(--ink2); color: var(--cream); border: 3px solid var(--line); box-shadow: 3px 3px 0 var(--ink0); cursor: pointer; }
.pq:hover { border-color: var(--teal); }
.pq[aria-pressed="true"] { background: var(--teal-deep); border-color: var(--teal); }
.pq[disabled] { opacity: .35; cursor: not-allowed; }
.pq-k { color: var(--gold); flex: 1 1 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px 16px; }
.pq-k > span { min-width: 0; }
.pq-k .linkish { flex: none; }
#proof .linkish { color: var(--teal); }
.pqt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; text-align: left; line-height: 1.15; min-width: 0; }
.pql { hyphens: manual; overflow-wrap: break-word; }
.pqs { color: var(--muted); }
.pq[aria-pressed="true"] .pqs { color: var(--cream); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 22, .88); display: grid; place-items: start center; overflow-y: auto; padding-block: max(16px, env(safe-area-inset-top, 0px)) 0; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.card { margin-block: auto; width: min(760px, 100%); background: var(--ink1); border: 4px solid var(--line); box-shadow: 6px 6px 0 #000; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card.paper { background: var(--paper); color: var(--text-dark); border-color: var(--ink0); }
.card.wide { width: min(920px, 100%); }
.card h1, .card h2 { margin: 0; font-weight: normal; line-height: 1.2; text-wrap: balance; }
.card h1 { font-size: 40px; letter-spacing: 2px; }
.card h2 { font-size: 30px; }
.card p { margin: 0; max-width: 60ch; }
.card .kicker { color: var(--muted); letter-spacing: 1px; }
.card.paper .kicker { color: var(--plum); }
.card.paper .btn { color: var(--text-dark); background: #fff8e6; border-color: var(--ink0); }
.card.paper .btn.primary { background: var(--teal); }
.card.paper .btn.gold { background: var(--gold); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.title-art { display: flex; align-items: flex-end; gap: 16px; }
.title-main { display: flex; flex-wrap: wrap; gap: 10px; }
.title-more { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.card:not(.paper) .linkish { color: var(--lav); }
/* Aktionsleiste unten in Karten: bleibt beim Scrollen sichtbar */
.card > .acts:last-child { position: sticky; bottom: 0; z-index: 1; margin: 0 -24px -24px; padding: 12px 24px 16px; background: var(--ink1); border-top: 3px solid var(--ink3); }
.card.paper > .acts:last-child { background: var(--paper); border-top: 3px dashed #c9b48e; }

/* Geführte Anleitung: Spotlight und Sprechblase */
#coach { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.co-blk { position: fixed; pointer-events: auto; }
.co-blk.dim { background: rgba(10, 8, 22, .62); }
.co-hole { position: fixed; pointer-events: none; box-shadow: 0 0 0 200vmax rgba(10, 8, 22, .62); outline: 3px solid var(--gold); }
.co-bub { position: fixed; left: 50%; transform: translateX(-50%); width: min(600px, calc(100vw - 24px)); pointer-events: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; background: var(--paper); color: var(--text-dark); border: 3px solid var(--ink0); box-shadow: 5px 5px 0 #000; padding: 12px 14px; }
.co-cat svg { display: block; }
.co-txt { margin: 0; }
.co-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; margin-top: 10px; }
.co-row .co-skip { margin-right: auto; color: #4b3f7a; }
.co-n { color: var(--plum); }
.co-bub .btn.primary { border-color: var(--ink0); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.file { text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; min-height: 120px; background: var(--paper); color: var(--text-dark); border: 3px solid var(--ink0); box-shadow: 4px 4px 0 #000; cursor: pointer; font: inherit; }
.file .no { color: var(--plum); }
.file .st { margin-top: auto; color: #4b3f7a; }
.file .small { color: #5b4f6f; }
.file[disabled] { background: #8d82a8; color: #2a2233; cursor: not-allowed; box-shadow: none; }
.file.gold { background: #fbe9a8; }
.file.gold[disabled] { background: #a99c78; }
.file.done .st { color: #2f6a5c; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.stk { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: var(--ink2); border: 3px solid var(--line); color: var(--cream); cursor: pointer; text-align: center; line-height: 1.1; min-height: 120px; font: inherit; }
.stk.has { background: var(--paper); color: var(--text-dark); border-color: var(--ink0); }
.stk.egg.has { background: #e6f5ef; }
.stk-info { min-height: 3em; }
.set { display: flex; flex-direction: column; gap: 10px; }
.set label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 2px dashed var(--ink3); }
.set .hint { color: var(--muted); }
.switch { appearance: none; -webkit-appearance: none; width: 56px; height: 32px; border: 3px solid var(--line); background: var(--ink0); position: relative; cursor: pointer; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; background: var(--muted); }
.switch:checked { background: var(--teal-deep); border-color: var(--teal); }
.switch:checked::after { left: 28px; background: var(--teal); }
.switch:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.code { font-size: 30px; letter-spacing: 3px; background: var(--ink0); padding: 8px 12px; border: 3px dashed var(--line); user-select: all; -webkit-user-select: all; }
input.codein { font: inherit; letter-spacing: 2px; background: var(--ink0); color: var(--cream); border: 3px solid var(--line); padding: 8px 10px; min-height: 44px; width: min(320px, 100%); text-transform: uppercase; }
.small { color: var(--muted); }
.card.paper .small { color: #5b4f6f; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font-weight: normal; color: var(--gold); }
.card.paper .sec h3 { color: var(--plum); }
.pix { image-rendering: pixelated; shape-rendering: crispEdges; }
.stampchoice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stampbtn { min-height: 110px; font: inherit; font-size: 30px; letter-spacing: 3px; border: 5px solid currentColor; background: var(--paper2); cursor: pointer; box-shadow: 4px 4px 0 var(--ink0); }
.stampbtn.echt { color: var(--teal-ink); }
.stampbtn.fake { color: var(--coral-ink); }
.stampbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.stampbtn small { display: block; font-size: 20px; letter-spacing: 0; color: var(--text-soft); }

/* Kommabuch */
.book-grid { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 16px; align-items: start; }
.book-toc { display: flex; flex-direction: column; gap: 4px; border-right: 3px dashed #c9b48e; padding-right: 12px; }
.bt { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 3px solid transparent; color: var(--text-dark); padding: 4px 6px; min-height: 40px; cursor: pointer; line-height: 1.1; font: inherit; }
.bt:hover { border-color: #c9b48e; }
.bt[aria-current="page"] { background: #fff8e6; border-color: var(--ink0); }
.bt.locked { color: #8d7f9a; }
.book-page { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pg-h { display: flex; align-items: center; gap: 12px; }
.rule { background: #fff8e6; border-left: 6px solid var(--teal); padding: 8px 12px; }
.book-page h3 { margin: 0; font-weight: normal; color: var(--plum); }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ex li { background: #fffdf6; border: 2px solid #e2d3b2; padding: 4px 10px; }
.ex .src { display: block; color: #7a6a8a; }
.hl { color: var(--teal-ink); background: #d9f3ea; padding: 0 2px; }
.hl.gold { color: #7a5a10; background: #fbe9a8; }
.neu { background: var(--gold); color: var(--text-dark); padding: 0 6px; margin-left: 6px; }
.card.book .book-nav { position: sticky; bottom: 0; z-index: 1; margin: 0 -24px -24px; padding: 10px 24px 14px; background: var(--paper); border-top: 3px dashed #c9b48e; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.book-nav .pn { color: var(--plum); }

/* Hefteintrag: Heftseite mit rotem Rand */
.heft-toc { display: flex; flex-wrap: wrap; gap: 6px; }
.card.paper .heft-toc .btn { min-width: 44px; justify-content: center; }
.card.paper .heft-toc .btn[aria-current="true"] { background: var(--teal); }
.card.paper .heft-toc .btn.locked { color: #8d7f9a; }
.heft-sheet { display: flex; flex-direction: column; gap: 8px; background: #fffdf6; border: 2px solid #e2d3b2; box-shadow: 3px 3px 0 #c9b48e; padding: 12px 16px 16px 54px; background-image: linear-gradient(90deg, transparent 38px, rgba(239,138,122,.8) 38px 41px, transparent 41px); }
.heft-k { color: var(--plum); letter-spacing: 1px; }
.heft-q { color: var(--teal-ink); }
.heft-list { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 14px; }
.heft-list p { margin: 0; }
.heft-bsp { margin-top: 4px !important; }
.heft-bsp > span { color: var(--plum); }

/* Mittlere Breite */
@media (max-width: 1440px) {
  .hud .case, #hudCount { display: none; }
}
@media (max-width: 1080px) {
  #work { grid-template-columns: minmax(0, 1fr) 240px; }
  #cat { right: calc(var(--gut-r) + 256px); }
}
/* Handy hoch: Dokument oben, darunter Sprechblase, Lupe und Aktionen */
@media (max-width: 760px) {
  .hud { gap: 6px; padding-block: 6px; }
  .hud-m, .hud-r { gap: 6px; }
  .hud-l, #bFull, .lw, #hudCount, #hudDoc { display: none; }
  .chip { padding: 2px 6px; }
  #bMenu { padding: 0 8px; }
  #bAlbum, #bBook { width: 44px; padding: 0; }
  #albumCount { display: none; }
  #room { height: 110px; }
  #app:not([data-mode="desk"]):not([data-mode="title"]) #room { height: 0; border-bottom-width: 0; }
  #work { grid-template-columns: minmax(0, 1fr); padding-block: 8px; min-height: 20vh; }
  #akte { display: none; }
  #cat { display: none; }
  #paper { padding: 8px 12px 12px; }
  .doc-head { gap: 0 10px; padding-bottom: 4px; margin-bottom: 4px; }
  .doc-head h2 { font-size: 20px; }
  .doc-von { display: none; }
  .line { padding: 2px 6px 2px 28px; line-height: 1.5; }
  .line .nr { top: 2px; }
  .line.fl { padding-right: 46px; }
  #dock { grid-template-columns: minmax(0, 1fr); grid-template-areas: "note" "lupe" "proof" "ctrl"; gap: 8px; padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); max-height: 72vh; max-height: 72dvh; overflow-y: auto; }
  #noteBody { max-height: none; padding: 4px 10px 6px; }
  .note-cat svg { width: 22px; height: auto; }
  #lupe { padding: 4px 8px 6px; }
  .lupe-row .w { font-size: 20px; padding: 6px 2px; }
  .g { width: 28px; height: 44px; font-size: 30px; }
  .ln { width: 44px; height: 34px; }
  #ctrl { justify-content: stretch; }
  #ctrl .btn { flex: 1 1 auto; }
  #proof { gap: 6px; }
  .pq-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .pq { min-height: 48px; gap: 6px; padding: 2px 8px; }
  .psteps li { padding: 0 5px; }
  .psteps li:first-child { display: none; }
  /* Beim Beweisen braucht die Lupe den Platz: Dokument kurz ausblenden */
  #app[data-step="pq"] #work, #app[data-step="beleg"] #work { display: none; }
  #app[data-step="pq"] #dock, #app[data-step="beleg"] #dock { max-height: none; }
  .pq-q { display: none; }
  .pq svg { width: 20px; height: 20px; }
  .pqs { display: none; }
  #toasts { top: 6px; bottom: auto; right: auto; left: 50%; transform: translateX(-50%); align-items: center; width: max-content; max-width: calc(100% - 24px); }
  .toast { padding: 4px 8px; gap: 8px; }
  .toast svg { width: 24px; height: 24px; }
  .overlay { padding-left: 8px; padding-right: 8px; padding-block: max(8px, env(safe-area-inset-top, 0px)) 0; }
  .card { padding: 16px; gap: 12px; }
  .card > .acts:last-child { margin: 0 -16px -16px; padding: 10px 16px max(12px, env(safe-area-inset-bottom, 0px)); }
  .card > .acts:last-child .btn { flex: 1 1 auto; }
  .card h1 { font-size: 30px; }
  .card h2 { font-size: 30px; line-height: 1.1; }
  .card h3 { font-size: 20px; }
  .title-art svg { width: 66px; height: auto; }
  .title-main { display: grid; grid-template-columns: 1fr 1fr; }
  .title-main .btn.primary { grid-column: 1 / -1; }
  .files { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .file b { overflow-wrap: anywhere; hyphens: auto; }
  .file { min-height: 0; padding: 8px 10px; box-shadow: 3px 3px 0 #000; }
  .file .small { display: none; }
  .menu-more .btn { flex: 1 1 auto; }
  .book-grid { grid-template-columns: minmax(0, 1fr); }
  .book-toc { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 3px dashed #c9b48e; padding: 0 0 8px; }
  .bt { flex: none; }
  .bt .btl { display: none; }
  .card.book .book-nav { margin: 0 -16px -16px; padding: 8px 16px max(12px, env(safe-area-inset-bottom, 0px)); }
  .card.book .book-nav .pn { order: -1; flex-basis: 100%; }
  .stampchoice { gap: 10px; }
  .stampbtn { min-height: 90px; font-size: 20px; }
  .heft-sheet { padding: 10px 10px 12px 34px; background-image: linear-gradient(90deg, transparent 20px, rgba(239,138,122,.8) 20px 23px, transparent 23px); }
  .set label { padding: 6px 0; }
  .co-bub { padding: 10px 12px; gap: 10px; }
  .co-cat svg { width: 22px; height: auto; }
}
/* Handy quer: Dokument links, Lupe und Aktionen rechts */
@media (max-height: 560px) and (min-width: 640px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(330px, 56%); grid-template-rows: auto auto minmax(0, 1fr); }
  .hud { grid-column: 1 / -1; padding-block: 4px; }
  .hud-l .chap, #hudCount, .lw { display: none; }
  #room { grid-column: 1 / -1; height: 90px; }
  #app:not([data-mode="desk"]):not([data-mode="title"]) #room { height: 0; border-bottom-width: 0; }
  #work { grid-column: 1; grid-row: 3; grid-template-columns: minmax(0, 1fr); padding-block: 8px; min-height: 0; }
  #akte, #cat { display: none; }
  #paper { padding: 8px 12px 12px; }
  .doc-head h2 { font-size: 20px; }
  .line { line-height: 1.5; }
  #dock { grid-column: 2; grid-row: 3; min-height: 0; max-height: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(2.4em, 1fr) auto; grid-template-areas: "lupe" "proof" "note" "ctrl"; border-top: 0; border-left: 4px solid var(--ink3); overflow-y: auto; gap: 8px; padding-block: 8px; padding-left: 12px; }
  #app[data-mode="desk"] #dock, #app[data-mode="title"] #dock, #app[data-mode="done"] #dock { grid-template-rows: minmax(3.2em, 1fr) auto; grid-template-areas: "note" "ctrl"; }
  #note { min-height: 0; align-items: stretch; }
  #noteBody { max-height: 100%; }
  .note-cat svg { width: 22px; height: auto; }
  .lupe-row .w { font-size: 20px; padding: 4px 2px; }
  .g { width: 28px; height: 40px; font-size: 30px; }
  .ln { height: 32px; }
  .lhint { display: none; }
  #ctrl { justify-content: stretch; }
  #ctrl .btn { flex: 1 1 auto; }
  .pq-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pq { gap: 6px; padding: 2px 6px; min-height: 44px; }
  .pq svg { display: none; }
  .pq-q { display: none; }
  .psteps li:first-child { display: none; }
  .pqs { display: none; }
  .card h1 { font-size: 30px; }
  .card h2 { font-size: 20px; }
  .title-art svg { width: 66px; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .egg .spark, .stamp, #cat.hop svg, .dot, .lupe-row .w.lift, #room { animation: none !important; transition: none !important; }
}

/* Rechtliche Links nur, wenn das Programm allein geöffnet ist */
.eingebettet .nur-allein{display:none!important}
.rechtslinks{display:flex;gap:18px;flex-wrap:wrap}
</style>

<body>
<div id="app" data-mode="title">
  <header class="hud">
    <div class="hud-l">
      <span class="case">Fälscherwerkstatt</span>
      <span class="chap" id="hudCase">Sprachdetektei</span>
    </div>
    <div class="hud-m">
      <span class="chip" id="hudStufe" hidden>Stufe 1</span>
      <span class="hud-stat" id="hudDoc"></span>
      <span class="hud-stat" id="hudCount"></span>
    </div>
    <div class="hud-r">
      <button class="btn" id="bMenu" type="button" aria-label="Alle Fälle" title="Alle Fälle"><svg class="ico pix" viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><rect x="0" y="1" width="4" height="1"/><rect x="0" y="2" width="10" height="7"/><rect x="1" y="3" width="8" height="5" fill="#2a2140"/><rect x="2" y="4" width="6" height="1"/><rect x="2" y="6" width="4" height="1"/></svg><span>Fälle</span></button>

      <button class="btn icon" id="bSound" type="button" aria-label="Ton ausschalten" title="Ton"><svg class="ico pix" viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><rect x="0" y="3" width="3" height="4"/><rect x="3" y="2" width="1" height="6"/><rect x="4" y="1" width="1" height="8"/><g id="soundWaves"><rect x="6" y="3" width="1" height="4"/><rect x="8" y="1" width="1" height="8"/></g><g id="soundOff" style="display:none"><rect x="6" y="3" width="1" height="1"/><rect x="7" y="4" width="1" height="2"/><rect x="8" y="6" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg></button>
      <button class="btn icon" id="bFull" type="button" aria-label="Vollbild" title="Vollbild"><svg class="ico pix" viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><rect x="0" y="0" width="4" height="1"/><rect x="0" y="0" width="1" height="4"/><rect x="6" y="0" width="4" height="1"/><rect x="9" y="0" width="1" height="4"/><rect x="0" y="9" width="4" height="1"/><rect x="0" y="6" width="1" height="4"/><rect x="6" y="9" width="4" height="1"/><rect x="9" y="6" width="1" height="4"/></svg></button>
    </div>
  </header>
  <div id="room" aria-label="Idas Büro – zwischen den Dokumenten gibt es hier etwas zu entdecken"></div>
  <main id="work">
    <article id="paper" aria-label="Dokument"></article>
    <aside id="akte" aria-label="Auftrag"></aside>
    <div id="cat" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>
  </main>
  <footer id="dock">
    <section id="note" aria-label="Komma sagt">
      <div class="note-cat" id="noteCat" aria-hidden="true"></div>
      <div id="noteBody" aria-live="polite"><p>Hallo!</p></div>
    </section>
    <section id="lupe" aria-label="Lupe"></section>
    <section id="proof" aria-label="Beweis" hidden></section>
    <section id="ctrl" aria-label="Steuerung"></section>
  </footer>
</div>
<div id="overlay" class="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>
<script>
"use strict";
/* ===== Kern: Satz-Markup, Prüffragen, Belegstellen, Erklärungen, Aktenzeichen ===== */
/*
  Markup (wie in den Satzgassen):
  Wörter mit Leerzeichen getrennt. Komma direkt am Wort = Muss-Komma, "(,)" = Kann-Komma.
  [Z:Art … ]  Zusatz (Art: Anrede, Ausruf, Erklärung, Herausstellung)
  [N … ]      Teilsatz: Nebensatz oder Infinitivgruppe
  { … }       gleichrangige Teile (Aufzählung, Gegensatz)
  Präfixe: *Personalform  ^Einleiter  &und/oder  ~aber/sondern
*/
const Core = (() => {
  function parse(markup) {
    const tokens = markup.trim().split(/\s+/);
    const words = [], segs = [], stack = [], sol = [];
    let segId = 0;
    for (const tok of tokens) {
      if (tok.startsWith('[Z')) { stack.push({ type: 'Z', kind: tok.split(':')[1] || 'Erklärung', start: words.length, id: segId++ }); continue; }
      if (tok === '[N') { stack.push({ type: 'N', start: words.length, id: segId++ }); continue; }
      if (tok === '{') { stack.push({ type: 'R', start: words.length, id: segId++ }); continue; }
      if (tok === ']' || tok === '}') {
        const s = stack.pop();
        if (!s) throw new Error('Klammer ohne Anfang: ' + markup);
        if ((tok === '}') !== (s.type === 'R')) throw new Error('Klammern passen nicht: ' + markup);
        s.end = words.length - 1; segs.push(s); continue;
      }
      let t = tok, pf = false, ein = false, conj = null;
      while (/^[*^&~]/.test(t)) {
        const c = t[0];
        if (c === '*') pf = true; else if (c === '^') ein = true; else if (c === '&') conj = '&'; else conj = '~';
        t = t.slice(1);
      }
      let s = null;
      if (t.endsWith('(,)')) { s = 'kann'; t = t.slice(0, -3); }
      else if (t.endsWith(',')) { s = 'muss'; t = t.slice(0, -1); }
      const w = { text: t, pf, ein, conj, i: words.length, open: stack.slice() };
      words.push(w); sol[w.i] = s;
    }
    if (stack.length) throw new Error('Klammer nicht geschlossen: ' + markup);
    for (const w of words) {
      w.depth = w.open.filter(s => s.type === 'N').length;
      const inner = type => { for (let k = w.open.length - 1; k >= 0; k--) if (w.open[k].type === type) return w.open[k]; return null; };
      w.z = inner('Z'); w.n = inner('N'); w.r = inner('R');
      delete w.open;
    }
    for (const s of segs.filter(s => s.type === 'R')) {
      s.elems = []; let cur = [];
      for (let i = s.start; i <= s.end; i++) {
        const w = words[i];
        if (w.conj) { if (cur.length) { s.elems.push(cur); cur = []; } continue; }
        cur.push(i);
        if (sol[i] && i < s.end) { s.elems.push(cur); cur = []; }
      }
      if (cur.length) s.elems.push(cur);
      s.elems.forEach((el, k) => el.forEach(i => { if (words[i].r === s) words[i].elem = k; }));
    }
    const gaps = [];
    for (let i = 0; i < words.length - 1; i++) gaps.push({ i, sol: sol[i] || null });
    if (sol[words.length - 1]) throw new Error('Komma nach dem letzten Wort: ' + markup);
    const muss = new Set(gaps.filter(g => g.sol === 'muss').map(g => g.i));
    const kann = new Set(gaps.filter(g => g.sol === 'kann').map(g => g.i));
    return { markup, words, segs, gaps, muss, kann };
  }

  const clean = t => t.replace(/[.!?:;]+$/, '');
  const segText = (p, s) => p.words.slice(s.start, s.end + 1).map(w => clean(w.text)).join(' ');
  const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  const isZuWord = t => { const c = clean(t).toLowerCase(); return c === 'zu' || /^\p{L}+zu\p{L}+en$/u.test(c); };

  /* Welche Kommaregel trifft an Lücke gi zu? Jede Rolle nennt die Regel und ihre Beweiswörter. */
  function roles(p, gi) {
    const a = p.words[gi], b = p.words[gi + 1], out = [];
    for (const s of p.segs) {
      if (s.type === 'N' && (s.start === gi + 1 || s.end === gi)) {
        const ws = p.words.slice(s.start, s.end + 1);
        const inf = !ws.some(w => w.pf && w.n === s);
        const beleg = new Set();
        ws.forEach((w, k) => {
          if (w.ein && w.n === s) beleg.add(w.i);
          if (w.pf && w.n === s) beleg.add(w.i);
          if (inf && isZuWord(w.text)) { beleg.add(w.i); if (clean(w.text).toLowerCase() === 'zu' && ws[k + 1]) beleg.add(ws[k + 1].i); }
        });
        out.push({ pq: inf ? 'infinitiv' : 'nebensatz', seg: s, beleg, opens: s.start === gi + 1, inf });
      }
    }
    for (const s of p.segs) {
      if (s.type === 'Z' && (s.start === gi + 1 || s.end === gi)) out.push({ pq: 'zusatz', seg: s, beleg: new Set(range(s.start, s.end)), opens: s.start === gi + 1 });
    }
    const zBound = (a.z ? a.z.id : -1) !== (b.z ? b.z.id : -1);
    if (b.conj === '~') out.push({ pq: 'gegensatz', geg: true, beleg: new Set([b.i]), seg: b.r });
    else if (!zBound && a.r && b.r && a.r === b.r && a.elem !== b.elem && !a.conj && !b.conj) {
      const s = a.r, beleg = new Set();
      for (let i = s.start; i <= s.end; i++) { const w = p.words[i]; if (!w.conj && w.r === s && (w.elem === a.elem || w.elem === b.elem)) beleg.add(i); }
      out.push({ pq: 'reihung', seg: s, beleg, elemA: a.elem, elemB: b.elem });
    }
    return out;
  }

  const PQ = {
    reihung: { name: 'Aufzählung', sub: 'Teile nebeneinander', long: 'Aufzählung – Wörter, Wortgruppen oder Sätze werden aufgezählt.', icon: 'laterne', page: 'reihung' },
    gegensatz: { name: 'Gegensatz', sub: 'aber, sondern, doch', long: 'Gegensatz – vor „aber“, „sondern“, „doch“ und „jedoch“ steht ein Komma.', icon: 'schranke', page: 'gegensatz' },
    nebensatz: { name: 'Nebensatz', sub: 'dass, weil, der …', long: 'Nebensatz – hier beginnt oder endet ein Nebensatz.', icon: 'treppe', page: 'nebensatz' },
    infinitiv: { name: 'Infinitiv\u00ADgruppe', sub: 'zu + Infinitiv', long: 'Infinitivgruppe – hier beginnt oder endet eine Gruppe mit „zu“ + Infinitiv.', icon: 'bruecke', page: 'infinitiv' },
    zusatz: { name: 'Zusatz', sub: 'lässt sich weglassen', long: 'Zusatz – ein Einschub, eine Anrede oder ein Ausruf lässt sich weglassen.', icon: 'schere', page: 'zusatz' },
    kein: { name: 'Kein Komma', sub: 'keine Regel passt', long: 'Kein Komma – keine Kommaregel passt.', icon: 'kein', page: 'kein' }
  };


  function pageOf(p, role) {
    if (!role) return 'kein';
    if (role.pq === 'infinitiv') return 'infinitiv';
    if (role.pq === 'nebensatz') return !role.opens && p.words[role.seg.end + 1] && p.words[role.seg.end + 1].conj === '&' ? 'schluss' : 'nebensatz';
    if (role.pq === 'zusatz') return role.seg.kind === 'Anrede' || role.seg.kind === 'Ausruf' ? 'anrede' : 'zusatz';
    if (role.pq === 'gegensatz') return 'gegensatz';
    if (role.pq === 'reihung') return 'reihung';
    return 'kein';
  }

  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  function restWithout(p, s) {
    const ws = p.words.filter(w => w.i < s.start || w.i > s.end).map(w => w.text);
    let t = ws.join(' ');
    if (s.start === 0) t = cap(t);
    return t;
  }

  /* Warum gehört an diese Stelle ein Komma? */
  function roleText(p, role, gi) {
    if (role.pq === 'nebensatz' || role.pq === 'infinitiv') {
      const t = segText(p, role.seg);
      const ws = p.words.slice(role.seg.start, role.seg.end + 1);
      const pf = ws.filter(w => w.pf && w.n === role.seg).map(w => clean(w.text));
      const ein = ws.find(w => w.ein && w.n === role.seg);
      let s;
      if (role.inf) s = `„${t}“ ist eine Infinitivgruppe (zu + Infinitiv). Seit 2024 wird sie immer mit Komma abgetrennt.`;
      else if (ein) s = `„${t}“ ist ein Nebensatz: Er beginnt mit dem Einleitewort „${clean(ein.text)}“, die Personalform „${pf[pf.length - 1] || ''}“ steht am Ende.`;
      else s = `„${t}“ ist ein Nebensatz mit eigener Personalform „${pf[pf.length - 1] || ''}“.`;
      if (!role.opens) {
        s += role.inf ? ' Hier endet die Infinitivgruppe – darum steht hier das Komma.' : ' Nach der Personalform endet der Nebensatz – darum steht hier das Komma.';
        const nxt = p.words[role.seg.end + 1];
        if (nxt && nxt.conj === '&') s += ` Es bleibt auch vor „${clean(nxt.text)}“ stehen.`;
      }
      return s;
    }
    if (role.pq === 'zusatz') {
      const t = segText(p, role.seg), k = role.seg.kind;
      const rest = restWithout(p, role.seg);
      const both = role.seg.start > 0 && role.seg.end < p.words.length - 1;
      if (k === 'Anrede') return `„${t}“ ist eine Anrede. Sie wird mit Komma abgetrennt${both ? ' – davor und danach' : ''}.`;
      if (k === 'Ausruf') return `„${t}“ ist ein Ausruf. Er wird mit Komma abgetrennt.`;
      if (k === 'Herausstellung') return `„${t}“ steht vorne und wird danach noch einmal aufgegriffen. Darum steht ein Komma.`;
      return `Lass „${t}“ weg: „${rest}“ – der Satz bleibt ganz. Also ist es ein Zusatz – ${both ? 'mit Komma davor und danach' : 'mit Komma abgetrennt'}.`;
    }
    if (role.pq === 'gegensatz') { const w = clean(p.words[gi + 1].text); return `„${w}“ leitet einen Gegensatz ein. Vor „${w}“ steht immer ein Komma.`; }
    if (role.pq === 'reihung') {
      const el = k => role.seg.elems[k].map(i => clean(p.words[i].text)).join(' ');
      return `„${el(role.elemA)}“ und „${el(role.elemB)}“ werden aufgezählt. Zwischen den Teilen einer Aufzählung steht ein Komma – außer, dort steht „und“ oder „oder“.`;
    }
    return '';
  }

  /* Warum gehört hier KEIN Komma hin? */
  function noCommaText(p, gi) {
    const a = p.words[gi], b = p.words[gi + 1];
    const A = clean(a.text), B = clean(b.text);
    if (b.conj === '&') return `„${B}“ verbindet die Teile der Aufzählung. Es ersetzt das Komma – vor „${B}“ steht keins.`;
    if (/^(als|wie)$/i.test(B)) {
      let hasPf = false;
      for (let i = gi + 1; i < p.words.length && p.words[i].depth === b.depth; i++) if (p.words[i].pf && i > gi + 1) { hasPf = true; break; }
      if (!hasPf) return `„${B} …“ ist ein Vergleich ohne Personalform – kein Nebensatz. Also kein Komma.`;
    }
    if (b.pf && a.depth === b.depth && !a.z && !b.z) return `„${B}“ ist die Personalform. Davor steht nur ein Satzglied – und zwischen Satzglied und Personalform steht kein Komma, auch wenn man beim Vorlesen Luft holt.`;
    const zuLater = p.words.slice(gi + 1).some(w => /^zu$/i.test(clean(w.text)) || isZuWord(w.text));
    if (a.pf && zuLater && /^(schein|schien|pfleg|ist$|war$|sind$|waren$|hat$|hatte$|hatten$|haben$)/i.test(A)) return `„${A} … zu …“ ist ein mehrteiliges Prädikat, keine Infinitivgruppe. Also kein Komma.`;
    return `Zwischen „${A}“ und „${B}“ passt keine Kommaregel: keine Aufzählung, kein Gegensatz, kein Nebensatz, keine Infinitivgruppe, kein Zusatz. Also kein Komma.`;
  }

  /* Hinweise für das Wiederherstellen (Stufe 3) */
  function hintMissing(p, gi, precise) {
    const r = roles(p, gi)[0];
    const where = precise ? ` (nach „${clean(p.words[gi].text)}“)` : '';
    if (!r) return 'Hier fehlt noch ein Komma' + where + '.';
    if (r.pq === 'infinitiv') return `Infinitivgruppe: Hier steht eine Gruppe mit „zu“ + Infinitiv. Sie braucht ein Komma${where}.`;
    if (r.pq === 'nebensatz') {
      if (r.opens) return `Nebensatz: Hier beginnt ein Nebensatz. Such das Einleitewort und setz davor ein Komma${where}.`;
      const nxt = p.words[r.seg.end + 1];
      return `Nebensatz: Nach der Personalform endet ein Nebensatz. Dort fehlt das Komma${nxt && nxt.conj === '&' ? ' – auch vor „und“' : ''}${where}.`;
    }
    if (r.pq === 'zusatz') return `Zusatz: Ein Teil lässt sich weglassen. Er braucht ${r.seg.start > 0 && r.seg.end < p.words.length - 1 ? 'zwei Kommas – davor und danach' : 'ein Komma'}${where}.`;
    if (r.pq === 'gegensatz') return `Gegensatz: Vor „aber“, „sondern“ und „doch“ steht immer ein Komma${where}.`;
    return `Aufzählung: Hier werden Teile ohne „und“ aufgezählt. Dazwischen gehört ein Komma${where}.`;
  }
  function hintExtra(p, gi, precise) {
    return (precise ? `Nach „${clean(p.words[gi].text)}“: ` : 'Ein Komma ist zu viel. ') + noCommaText(p, gi);
  }


  /* Dokumente vorbereiten: Fälschungen auflösen, Beweisoptionen ableiten */
  function findWord(p, spec) {
    const [w, nth] = String(spec).split('#'); let n = +(nth || 1);
    for (const x of p.words) if (clean(x.text) === w && --n === 0) return x.i;
    return -1;
  }
  function forgeryAt(p, si, gi, opts) {
    opts = opts || {};
    const sol = p.gaps[gi].sol;
    if (sol === 'kann') throw new Error('Kann-Stelle kann keine Fälschung sein: ' + p.markup);
    const kind = sol === 'muss' ? 'fehlt' : 'zuviel';
    let options;
    if (kind === 'fehlt') {
      options = roles(p, gi).map(r => ({ pq: r.pq, beleg: r.beleg, role: r }));
      if (!options.length) throw new Error('Keine Kommafunktion an dieser Stelle: ' + p.markup);
    } else if (opts.b) {
      const bs = [].concat(opts.b).map(b => findWord(p, b));
      if (bs.some(i => i < 0)) throw new Error('Belegwort fehlt: ' + opts.b + ' in ' + p.markup);
      options = [{ pq: 'kein', beleg: new Set(bs) }];
    } else {
      const bel = new Set([gi, gi + 1]);
      const b = p.words[gi + 1];
      if (b.conj) bel.add(b.i);
      for (let i = gi + 1; i < p.words.length; i++) if (p.words[i].pf && p.words[i].depth === p.words[gi].depth) { bel.add(i); break; }
      for (let i = gi; i >= 0; i--) if (p.words[i].pf && p.words[i].depth === p.words[gi].depth) { bel.add(i); break; }
      options = [{ pq: 'kein', beleg: bel }];
    }
    return { s: si, gi, kind, options, why: opts.why || null, alt: !!opts.alt, page: kind === 'fehlt' ? pageOf(p, options[0].role) : 'kein', found: false, tries: 0 };
  }
  function prepareDoc(doc) {
    const sents = doc.s.map(parse);
    const forg = (doc.f || []).map(f => {
      const p = sents[f.s];
      const gi = findWord(p, f.nach);
      if (gi < 0 || gi >= p.words.length - 1) throw new Error('Lücke nicht gefunden: ' + f.nach + ' in ' + p.markup);
      return forgeryAt(p, f.s, gi, f);
    });
    return { doc, sents, forg };
  }
  function forgeryText(d, f) {
    const p = d.sents[f.s];
    if (f.why) return f.why;
    return f.kind === 'fehlt' ? roleText(p, f.options[0].role, f.gi) : noCommaText(p, f.gi);
  }

  /* Aktenzeichen: Fortschritt als Code, ganz ohne Speichern */
  const ABC = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const WIDTH = [3, 3, 3, 3, 3, 1, 2];
  function encode(prog) {
    let v = 0n, shift = 0n;
    WIDTH.forEach((w, k) => { v |= BigInt(Math.min((1 << w) - 1, prog.d[k] || 0)) << shift; shift += BigInt(w); });
    v |= BigInt((prog.st >>> 0) & 0xffffff) << shift; shift += 24n;
    v |= BigInt(prog.intro ? 1 : 0) << shift;
    let s = '';
    for (let k = 0; k < 10; k++) { s = ABC[Number(v & 31n)] + s; v >>= 5n; }
    let sum = 0; for (const ch of s) sum += ABC.indexOf(ch) * 7 + 3;
    return `${s.slice(0, 5)}-${s.slice(5)}-${ABC[sum % 32]}`;
  }
  function decode(code) {
    const s = String(code || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    if (s.length !== 11) return null;
    const body = s.slice(0, 10);
    let sum = 0; for (const ch of body) { const k = ABC.indexOf(ch); if (k < 0) return null; sum += k * 7 + 3; }
    if (ABC[sum % 32] !== s[10]) return null;
    let v = 0n; for (const ch of body) v = (v << 5n) | BigInt(ABC.indexOf(ch));
    const d = [];
    WIDTH.forEach(w => { d.push(Number(v & BigInt((1 << w) - 1))); v >>= BigInt(w); });
    const st = Number(v & 0xffffffn); v >>= 24n;
    return { d, st, intro: Number(v & 1n) === 1 };
  }

  return { parse, roles, roleText, noCommaText, pageOf, hintMissing, hintExtra, encode, decode, clean, segText, PQ, isZuWord, findWord, forgeryAt, prepareDoc, forgeryText };
})();

/* ===== Inhalte: Fälle, Dokumente, Kommabuch, Sticker ===== */
/*
  Dokument: typ, titel, von, stufe (1 Lupe, 2 Akte, 3 Original), s (Sätze im Markup des Originals),
  f (Fälschungen): { s: Satznummer, nach: Wort vor der Lücke ('Wort#2' für das zweite Vorkommen),
                     b: Belegwort bei überflüssigem Komma, why: eigene Erklärung, alt: Masche aus einem früheren Fall }
  kmit: Sätze, in denen goldene Kommas sichtbar gesetzt sind (nur Extrafall).
*/
const PROLOG = [
  { title: 'Ein Zettel an der Lampe', text: 'In der Sprachdetektei ist es still. An Idas Schreibtischlampe klebt ein Zettel: „Bin im Archiv. Ein großer Fall. Du schaffst das! I.“' },
  { title: 'Die Fälscherin', text: 'Seit gestern Nacht stimmt etwas nicht mit den Texten im Viertel: Echte Kommas sind verschwunden, und an falschen Stellen stehen neue.' },
  { title: 'Komma übernimmt', text: 'Komma springt auf Idas Schreibtisch. Da liegen Lupe, Stempel und Idas Kommabuch. Ab jetzt prüft Komma die Dokumente – und du hilfst ihr. Die Regel der Detektei: Ein Verdacht zählt erst, wenn ein Beweiswort ihn belegt.' }
];

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const R = (x, y, w, h, fill, extra) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"${extra ? ' ' + extra : ''}/>`;

function pixArt(grid, x, y, px, palette) {
  let s = '';
  grid.forEach((row, ry) => {
    for (let rx = 0; rx < row.length; rx++) {
      const ch = row[rx];
      if (ch === '.') continue;
      let run = 1;
      while (rx + run < row.length && row[rx + run] === ch) run++;
      s += R(x + rx * px, y + ry * px, run * px, px, (palette || PAL)[ch] || '#f0f');
      rx += run - 1;
    }
  });
  return s;
}
const artSVG = (grid, px, palette, cls) => { const w = grid[0].length * px, h = grid.length * px; return `<svg class="pix${cls ? ' ' + cls : ''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" shape-rendering="crispEdges">${pixArt(grid, 0, 0, px, palette)}</svg>`; };

/* ===== Klang: MIDI-artige Synthese im Browser (keine Dateien, keine Anfragen) ===== */
/*
  Neu aufgebaut für einen sauberen, ruhigen Klang:
  - bandbegrenzte Klangfarben (PeriodicWave) statt Rechteck/Sägezahn: kein Aliasing, kein Kratzen
  - jede Hüllkurve beginnt und endet bei null und läuft vollständig aus, bevor der Oszillator stoppt: keine Klicks
  - Tremolo als eigene Verstärkerstufe nach der Hüllkurve: Ausklänge laufen sauber auf null
  - kein Rauschen im Takt (früher Besen und Hi-Hat), nur weiche Geräusche bei Papier und Stempel
  - Vorausplanung mit der Uhr des Audiokontexts; nach einer Pause wird nicht nachgeholt, sondern neu angesetzt
  - Grenze für gleichzeitige Stimmen, Begrenzer am Ausgang gegen Übersteuern, Pause im Hintergrund
  Besetzung nach dem Vorbild von General MIDI: Vibrafon, Celesta, Pizzicato-Bass, Klarinette, Fagott, Tuba, Flöte, Cembalo.
*/
const Sound = (() => {
  let ctx = null, G = null;
  let musicOn = true, sfxOn = true, playing = false, timer = 0, nextT = 0, step = 0;
  let theme = 'minor', duck = false, quietRead = false, active = 0;
  const MUSIC = 0.9, SFX = 1.0, MAXV = 48;
  let limit = true;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* Klangfarben als Obertonreihen (Amplituden der Teiltöne 1, 2, 3 …) */
  const SPECTRA = {
    vib: [1, 0, 0, 0.16, 0, 0, 0, 0, 0, 0.03],
    cel: [1, 0.22, 0, 0.1, 0, 0.03],
    pizz: [1, 0.55, 0.22, 0.1, 0.05],
    clar: [1, 0, 0.42, 0, 0.22, 0, 0.1, 0, 0.05],
    fag: [1, 0.75, 0.5, 0.32, 0.2, 0.12, 0.07],
    tuba: [1, 0.45, 0.18, 0.08],
    flo: [1, 0.12, 0.04],
    hpsi: [1, 0.7, 0.55, 0.42, 0.33, 0.25, 0.18, 0.12, 0.08, 0.05],
    sine: [1]
  };

  function build(c) {
    const g = { c, waves: {} };
    for (const k in SPECTRA) {
      const a = SPECTRA[k], real = new Float32Array(a.length + 1), imag = new Float32Array(a.length + 1);
      a.forEach((v, i) => { imag[i + 1] = v; });
      g.waves[k] = c.createPeriodicWave(real, imag);
    }
    // Ausgang: Lautstärke → Begrenzer
    g.out = c.createGain(); g.out.gain.value = 1.2;
    const lim = c.createDynamicsCompressor();
    lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.2;
    g.out.connect(lim); lim.connect(c.destination);
    // Kleiner Raum: kurzer, weicher Nachhall
    g.room = c.createConvolver(); g.room.buffer = impulse(c, 1.1);
    const roomOut = c.createGain(); roomOut.gain.value = 0.22;
    g.room.connect(roomOut); roomOut.connect(g.out);
    // Musik: warmes Tiefpassfilter, Pegel, Hall-Anteil
    g.music = c.createGain(); g.music.gain.value = 0;
    const warm = c.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 3600; warm.Q.value = 0.5;
    g.music.connect(warm); warm.connect(g.out);
    const mSend = c.createGain(); mSend.gain.value = 0.7; warm.connect(mSend); mSend.connect(g.room);
    // Vibrafon-Tremolo: eine gemeinsame Stufe nach allen Vibrafon-Stimmen
    g.vibBus = c.createGain(); g.vibBus.gain.value = 0.86;
    const lfo = c.createOscillator(); lfo.frequency.value = 4.2;
    const depth = c.createGain(); depth.gain.value = 0.14;
    lfo.connect(depth); depth.connect(g.vibBus.gain); lfo.start();
    g.vibBus.connect(g.music);
    // Geräusche
    g.sfx = c.createGain(); g.sfx.gain.value = sfxOn ? SFX : 0;
    g.sfx.connect(g.out);
    const sSend = c.createGain(); sSend.gain.value = 0.35; g.sfx.connect(sSend); sSend.connect(g.room);
    // Rauschen einmal erzeugen
    g.noise = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const d = g.noise.getChannelData(0);
    let b = 0;
    for (let i = 0; i < d.length; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); d[i] = b * 6; }
    return g;
  }
  function impulse(c, sec) {
    const n = Math.floor(c.sampleRate * sec), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / n;
        lp = 0.6 * lp + 0.4 * (Math.random() * 2 - 1);
        d[i] = lp * Math.pow(1 - t, 2.2) * (i < 64 ? i / 64 : 1) * 0.5;
      }
    }
    return buf;
  }

  /* Eine Stimme: Oszillator → Hüllkurve → Ziel. Beginnt bei 0, endet bei 0. */
  function voice(g, wave, m, t, len, o) {
    const c = g.c;
    const perc = !!o.perc, a = o.a || 0.008, peak = o.peak || 0.15;
    const dec = o.dec || 0.6, sus = o.sus == null ? 0.7 : o.sus, rel = o.rel || 0.12;
    const osc = c.createOscillator(); osc.setPeriodicWave(g.waves[wave]);
    osc.frequency.setValueAtTime(mtof(m), t);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(mtof(m) * o.glide, t + (o.glideT || 0.15));
    const env = c.createGain(); env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(peak, t + a);
    let end;
    if (perc) {
      env.gain.setTargetAtTime(0, t + a, dec / 4);
      const off = t + Math.max(len, a + 0.02);
      if (len < dec) env.gain.setTargetAtTime(0, off, rel / 4);
      end = Math.min(t + a + dec * 2.2, off + rel * 2.2) + 0.02;
    } else {
      env.gain.setTargetAtTime(peak * sus, t + a, dec / 4);
      const off = t + Math.max(len, a + 0.03);
      env.gain.setTargetAtTime(0, off, rel / 4);
      end = off + rel * 2.2 + 0.02;
    }
    if (o.vib) {
      const l = c.createOscillator(); l.frequency.value = o.vibRate || 5;
      const dg = c.createGain(); dg.gain.setValueAtTime(0, t); dg.gain.linearRampToValueAtTime(o.vib, t + Math.min(0.35, len * 0.6));
      l.connect(dg); dg.connect(osc.detune); l.start(t); l.stop(end);
    }
    osc.connect(env); env.connect(o.dest);
    osc.start(t); osc.stop(end);
    active++; osc.onended = () => { active--; env.disconnect(); };
  }
  function noise(g, t, len, o) {
    const c = g.c, src = c.createBufferSource(); src.buffer = g.noise;
    const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.value = o.f || 1500; f.Q.value = o.q || 0.7;
    const env = c.createGain(); env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(o.peak || 0.05, t + (o.a || 0.02));
    env.gain.setTargetAtTime(0, t + (o.a || 0.02) + len * 0.4, len / 4);
    const end = t + (o.a || 0.02) + len * 0.4 + len * 1.3 + 0.02;
    src.connect(f); f.connect(env); env.connect(o.dest);
    src.start(t, Math.random() * 1.2); src.stop(end);
  }

  /* Instrumente */
  const I = {
    vib: (g, t, m, len, vel, dest) => voice(g, 'vib', m, t, len, { perc: true, a: 0.004, dec: 1.6, rel: 0.25, peak: 0.13 * vel, dest: dest || g.vibBus }),
    cel: (g, t, m, len, vel, dest) => voice(g, 'cel', m, t, len, { perc: true, a: 0.003, dec: 0.9, rel: 0.2, peak: 0.11 * vel, dest }),
    pizz: (g, t, m, len, vel, dest) => voice(g, 'pizz', m, t, len, { perc: true, a: 0.006, dec: 0.9, rel: 0.12, peak: 0.21 * vel, dest }),
    hpsi: (g, t, m, len, vel, dest) => voice(g, 'hpsi', m, t, len, { perc: true, a: 0.003, dec: 0.7, rel: 0.1, peak: 0.07 * vel, dest }),
    clar: (g, t, m, len, vel, dest) => voice(g, 'clar', m, t, len, { a: 0.045, dec: 0.3, sus: 0.8, rel: 0.12, peak: 0.1 * vel, vib: 9, dest }),
    fag: (g, t, m, len, vel, dest) => voice(g, 'fag', m, t, len, { a: 0.05, dec: 0.3, sus: 0.8, rel: 0.12, peak: 0.1 * vel, vib: 7, dest }),
    tuba: (g, t, m, len, vel, dest) => voice(g, 'tuba', m, t, len, { a: 0.06, dec: 0.3, sus: 0.75, rel: 0.12, peak: 0.16 * vel, vib: 5, dest }),
    flo: (g, t, m, len, vel, dest) => voice(g, 'flo', m, t, len, { a: 0.06, dec: 0.3, sus: 0.85, rel: 0.15, peak: 0.09 * vel, vib: 12, vibRate: 5.2, dest })
  };

  /* Musik: ruhiger Swing, 76 Schläge pro Minute, 16 Takte. Melodie nur in den ersten 8 Takten, dann Luft. */
  const MINOR = {
    bass: [[38, 45], [43, 50], [36, 43], [41, 48], [34, 41], [40, 46], [33, 40], [38, 33]],
    chords: [[53, 57, 60, 64], [53, 57, 58, 62], [52, 58, 62], [52, 57, 60], [53, 57, 62], [50, 55, 58], [55, 58, 61], [53, 57, 62]],
    mel: [[[0, 69, 3], [3, 67, 1], [4, 65, 2], [6, 64, 2]], [[0, 62, 6]], [[0, 64, 1], [1, 67, 1], [2, 70, 2], [4, 69, 2], [6, 67, 2]], [[0, 69, 6]],
      [[0, 74, 3], [3, 72, 1], [4, 70, 2], [6, 69, 2]], [[0, 67, 4], [4, 70, 2]], [[0, 69, 1], [1, 73, 1], [2, 76, 2], [4, 74, 2], [6, 73, 2]], [[0, 74, 6]]],
    lead: 'vib'
  };
  const MAJOR = {
    bass: [[38, 45], [35, 42], [40, 47], [33, 40], [38, 45], [42, 35], [40, 47], [33, 45]],
    chords: [[54, 57, 61], [50, 54, 57], [50, 55, 59], [49, 55, 57], [54, 57, 61], [52, 57, 61], [50, 55, 59], [49, 55, 57]],
    mel: [[[0, 78, 2], [2, 76, 2], [4, 74, 4]], [[0, 74, 2], [2, 73, 2], [4, 71, 4]], [[0, 71, 2], [2, 74, 2], [4, 79, 4]], [[0, 76, 6]],
      [[0, 79, 2], [2, 78, 2], [4, 74, 4]], [[0, 73, 2], [2, 76, 2], [4, 81, 4]], [[0, 79, 4], [4, 76, 4]], [[0, 74, 6]]],
    lead: 'cel'
  };
  const BPM = 76, Q = 60 / BPM;
  const swing = s => (s % 2 === 0 ? Q * 0.62 : Q * 0.38);   // Achtel paarweise lang–kurz

  function scheduleStep(g, t, st) {
    const T = theme === 'major' ? MAJOR : MINOR;
    const bar = Math.floor(st / 8) % 16, b8 = bar % 8, s = st % 8;
    const full = limit && active > MAXV;
    if (s === 0) I.pizz(g, t, T.bass[b8][0], Q * 1.7, 0.95, g.music);
    if (s === 4) I.pizz(g, t, T.bass[b8][1], Q * 1.7, 0.8, g.music);
    if (!full && (s === 3 || (s === 6 && bar % 2 === 1))) {
      const len = s === 3 ? Q * 0.9 : Q * 1.4;
      T.chords[b8].forEach((m, k) => I.vib(g, t + k * 0.012, m, len, 0.55 - k * 0.04));
    }
    if (bar < 8 && !duck) for (const [at, m, l] of T.mel[b8]) if (at === s) {
      if (T.lead === 'cel') I.cel(g, t, m, l * Q * 0.5, 0.9, g.music); else I.vib(g, t, m, l * Q * 0.5, 0.95);
    }
  }
  function scheduleUntil(g, until) {
    while (nextT < until) {
      scheduleStep(g, nextT, step);
      nextT += swing(step);
      step = (step + 1) % 128;
    }
  }
  function tick() {
    if (!ctx || !playing) return;
    const now = ctx.currentTime;
    if (nextT < now + 0.02) nextT = now + 0.06;   // nach einer Pause neu ansetzen statt nachholen
    scheduleUntil(G, now + 0.3);
  }

  function musicLevel() { return !musicOn ? 0 : duck ? (quietRead ? 0 : MUSIC * 0.42) : MUSIC; }
  function applyLevel() { if (ctx) G.music.gain.setTargetAtTime(musicLevel(), ctx.currentTime, 0.4); }

  function init() {
    if (ctx) { if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => {}); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC({ latencyHint: 'balanced' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return false; } }

  if (D && S.mode === 'check') {
    const found = D.forg.filter(f => f.found).length;
    cnt = `<span class="lw">Bewiesen: </span><b>${found}${D.stufe === 1 || S.settings.showCount && !D.partner ? '/' + D.forg.length : ''}</b>`;
  }
  $('hudCount').innerHTML = cnt;
}
function renderLupe() {
  const L = $('lupe'), D = S.D;
  if (!D || !['check', 'orig', 'forge'].includes(S.mode)) {
    L.innerHTML = `<div class="lupe-h"><span>Lupe</span><span>${S.mode === 'done' ? 'Dokument abgelegt' : 'Öffne ein Dokument'}</span></div>`;
    return;
  }
  const si = S.line, p = D.sents[si];
  const pick = S.step === 'beleg';
  let hint;
  if (pick) hint = 'Welches Wort belegt es?';
  else if (S.step === 'pq') hint = 'Welche Regel gilt?';
  else if (S.mode === 'orig') hint = S.doneS[si] ? 'Satz stimmt ✓' : S.settings.showCount ? (p.muss.size ? `${p.muss.size} ${p.muss.size === 1 ? 'Komma' : 'Kommas'} gesucht` : 'Hier gehört kein Komma hin') : 'Tippe auf die Lücken';
  else if (S.mode === 'forge') hint = 'Tippe, um ein Komma zu fälschen';

  const A = S.anim, ac = new Map();
  const addc = (i, c) => ac.set(i, (ac.get(i) || '') + ' ' + c);
  if (A) {

    if ((o.pq === 'nebensatz' || o.pq === 'infinitiv') && o.role) { for (let i = o.role.seg.start; i <= o.role.seg.end; i++) { addc(i, 'ts'); if (p.words[i].pf) addc(i, 'pf'); } }
    if (o.pq === 'zusatz' && o.role) for (let i = o.role.seg.start; i <= o.role.seg.end; i++) addc(i, 'lift');
    if (o.pq === 'reihung' && o.role) o.role.beleg.forEach(i => addc(i, 'lamp'));

  }

  const navOff = !!S.probe || !!S.tut || S.step === 'anim';
  let h = `<div class="lupe-h"><span class="lnav"><button type="button" class="ln" id="lPrev" aria-label="Satz davor" ${navOff || si <= 0 ? 'disabled' : ''}>←</button><span class="lz">Satz ${si + 1}/${D.sents.length}</span><button type="button" class="ln" id="lNext" aria-label="Nächster Satz" ${navOff || si >= D.sents.length - 1 ? 'disabled' : ''}>→</button></span><span class="lhint">${hint}</span></div><div class="lupe-row${pick ? ' pick' : ''}">`;
  p.words.forEach((w, i) => {
    const cls = 'w' + (ac.get(i) || '');
    h += pick ? `<button type="button" class="${cls}" data-w="${i}">${esc(w.text)}</button>` : `<span class="${cls}">${esc(w.text)}</span>`;
    if (i < p.words.length - 1) {
      const v = gapView(si, i);
      const c = ['g'];
      if (v.comma) c.push('has');
      if (v.cls) c.push(v.cls);

      if (S.hintGap && S.hintGap.s === si && S.hintGap.gi === i) c.push('hint');
      if (S.marks && S.marks.s === si) { if (S.marks.miss.includes(i)) c.push('miss'); if (S.marks.extra.includes(i)) c.push('extra'); }
      const dis = (S.mode === 'orig' && (S.doneS[si] || S.probe)) || S.step === 'anim';
      h += `<button type="button" class="${c.join(' ')}" data-g="${i}" ${dis ? 'disabled' : ''} aria-label="${esc(`Lücke nach „${Core.clean(w.text)}“: ${v.comma ? 'Komma' : 'kein Komma'}`)}"><span>${v.comma ? ',' : ''}</span><i class="dot0"></i></button>`;
    }
  });
  L.innerHTML = h + '</div>';
}
function renderProof() {
  const show = S.step === 'pq' || S.step === 'beleg';
  app.dataset.step = show ? S.step : '';
  $('proof').hidden = !show; $('ctrl').hidden = show;
  if (!show) return;
  const fixed = S.D.stufe === 1 && S.mode === 'check';
  const btn = id => `<button type="button" class="pq" data-pq="${id}" aria-pressed="${S.pq === id}" ${fixed && S.pq !== id ? 'disabled' : ''}>${iconSVG(Core.PQ[id].icon, 3)}<span class="pqt"><span class="pql">${Core.PQ[id].name}</span><span class="pqs">${Core.PQ[id].sub}</span></span></button>`;
  const beleg = S.step === 'beleg';
  const steps = `<ol class="psteps" aria-label="So beweist du"><li class="done">${S.probe ? 'Komma' : 'Verdacht'} ✓</li><li class="${beleg ? 'done' : 'on'}">Regel${beleg ? ' ✓' : ''}</li><li class="${beleg ? 'on' : ''}">Beweiswort</li></ol>`;
  const k = beleg ? 'Welches Wort kann das belegen?' : 'Welche Kommaregel gilt hier?';
  $('proof').innerHTML = `<div class="pq-k">${steps}<span class="pq-q">${k}</span>${S.probe || S.tut ? '' : '<button type="button" class="linkish" id="pCancel">Abbrechen</button>'}</div><div class="pq-row">${PQS.map(btn).join('')}</div>`;
}
function renderCtrl() {
  const C = $('ctrl');
  const b = (id, label, cls, dis) => `<button type="button" class="btn big ${cls || ''}" id="${id}" ${dis ? 'disabled' : ''}>${label}</button>`;
  if (S.mode === 'desk') C.innerHTML = b('cOpen', 'Dokument öffnen', 'primary');
  else if (S.mode === 'check') {
    const last = S.line >= S.D.sents.length - 1, all = S.seen.size >= S.D.sents.length;
    C.innerHTML = last ? b('cStamp', 'Stempeln', 'primary') : (all ? b('cStamp', 'Stempeln') : '') + b('cNext', 'Nächster Satz →', 'primary');
  }
  else if (S.mode === 'orig') C.innerHTML = S.doneS[S.line] && !S.probe ? b('cNext', 'Nächster Satz →', 'primary') : b('cCheck', 'Satz prüfen', 'primary', S.doneS[S.line] || !!S.probe);
  else if (S.mode === 'done') C.innerHTML = b('cOn', 'Weiter →', 'primary');
  else if (S.mode === 'forge') C.innerHTML = b('cHand', 'Übergeben', 'primary', !S.partner.changes.size);

}
function renderAll() { renderHud(); renderPaper(); renderAkte(); renderLupe(); renderProof(); renderCtrl(); }
function renderRoom() {
  const win = S.c >= 0 ? CASES[S.c].window : 'morgen';

    $('room').querySelectorAll('.egg').forEach(e => e.classList.toggle('found', hasSticker(e.dataset.egg)));

  $('room').innerHTML = roomSVG(win, hasSticker);
