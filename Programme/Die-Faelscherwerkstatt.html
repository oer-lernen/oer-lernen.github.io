/* ---------- Fall starten, Schreibtisch, Dokument öffnen ---------- */
function startCase(c, replay) {
  S.c = c; S.partner = null; S.train = null;
  S.di = replay || caseDone(c) ? 0 : Math.min(S.prog.d[c], NDOCS(c) - 1);
  Sound.setTheme(c === EXTRA ? 'major' : 'minor');
  renderRoom();
  const cs = CASES[c];
  Sound.motif(cs.motif);
  openOverlay(`<div class="kicker">${caseLabel(c)} · ${esc(auftrag(c))}</div><h2 id="cardTitle">${esc(cs.name)}</h2><p>${esc(cs.intro)}</p>
    <div class="sec"><h3>Tipp für diesen Fall</h3><p>${esc(cs.spur)}</p></div>
    <div class="row end acts"><button type="button" class="btn primary big" data-primary id="sGo">${S.di > 0 ? 'Weiter prüfen' : 'Los geht’s'}</button></div>`, { paper: true });
  $('sGo').onclick = () => { closeOverlay(true); enterDesk(); checkBookNews(); };
}
function enterDesk() {
  S.train = null; S.D = null; S.sel = null; S.step = 'spot'; S.pq = null; S.probe = null; S.anim = null; S.hintGap = null; S.marks = null; S.hintWord = null;
  setMode('desk');
  renderRoom();
  const doc = CASES[S.c].docs[S.di];
  note([`Neue Post von ${doc.von}: ${doc.typ} „${doc.titel}“. Tippe auf „Dokument öffnen“.`, S.prog.st >>> 9 ? '' : 'Psst: Im Büro oben ist etwas versteckt. Tippe die Dinge an!']);
  renderAll();
  Sound.sfx('paper');
}
function prepare(doc) {
  const d = Core.prepareDoc(doc);
  d.stufe = doc.stufe; d.kmit = new Set(doc.kmit || []); d.fehl = 0; d.goldSeen = new Set();
  return d;
}
function openDoc() {
  const doc = S.tut ? TUT_DOC : S.train ? S.train.doc : CASES[S.c].docs[S.di];
  S.D = prepare(doc);
  S.line = 0; S.sel = null; S.step = 'spot'; S.pq = null; S.stampTries = 0; S.probe = null; S.anim = null; S.hintGap = null; S.marks = null; S.hintWord = null;
  S.seen = new Set([0]);
  Sound.sfx('paper');
  if (doc.stufe === 3) {
    S.placed = S.D.sents.map(() => new Set()); S.doneS = S.D.sents.map(() => false); S.tries = S.D.sents.map(() => 0);
    setMode('orig');
    brief(S.train ? `Training · ${S.train.label}: Setze die Kommas, dann „Satz prüfen“.` : S.c === FIN ? 'Der Brief der Elster – ohne ein einziges Komma. Setze alle Kommas.' : 'Stufe 3 · Setze alle Kommas, dann „Satz prüfen“.');
  } else {
    setMode('check');
    if (doc.stufe === 1) {
      const n = S.D.forg.length;
      brief(S.tut ? 'Ein Übungszettel von Ida.' : `Stufe 1 · Die Feder zeigt, wo gefälscht wurde (${S.D.forg.length}×).`);
    } else brief('Stufe 2 · Prüfe Satz für Satz. Manche Dokumente sind echt.');
  }
  renderAll();
  if (S.tut) return Coach.start(tutorialSteps(), endTutorial);
  if (doc.stufe === 2) tip('stufe2');
  if (doc.stufe === 3 && S.c !== FIN && !S.train) tip('stufe3');
}
function setLine(si) {
  if (!S.D) return;
  S.line = Math.max(0, Math.min(S.D.sents.length - 1, si));
  S.seen.add(S.line);
  if (!S.probe) { S.sel = null; S.step = 'spot'; S.pq = null; }
  if (S.marks && S.marks.s !== S.line) S.marks = null;
  S.hintWord = null;
  renderPaper(); renderLupe(); renderProof(); renderCtrl();
  Coach.event('line', S.line);
}
function nextSentence() {
  if (!S.D) return;
  if (S.mode === 'orig') {
    const n = S.D.sents.length;
    for (let k = 1; k <= n; k++) { const i = (S.line + k) % n; if (!S.doneS[i]) return setLine(i); }
    return;
  }
  setLine(S.line + 1);
}
function cancelSel() {
  if (S.probe || S.tut) return;
  S.sel = null; S.step = 'spot'; S.pq = null; S.hintWord = null;
  renderLupe(); renderProof(); renderCtrl();
}

/* ---------- Verdacht, Beweis, Fehlalarm ---------- */
function belegGuide(pq) {
  return {
    reihung: 'Beweiswort ist ein Teil der Aufzählung.',
    gegensatz: 'Beweiswort ist das Wort, das den Gegensatz einleitet – zum Beispiel „aber“ oder „sondern“.',
    nebensatz: 'Beweiswort ist das Einleitewort (zum Beispiel „dass“, „weil“, „der“) oder die Personalform am Ende des Nebensatzes.',
    infinitiv: 'Beweiswort ist das Wort mit „zu“ – oder „um“, „ohne“, „statt“.',
    zusatz: 'Beweiswort ist ein Wort des Zusatzes – also des Teils, den man weglassen kann.',
    kein: 'Beweiswort ist das Wort, das zeigt, warum hier kein Komma hingehört – zum Beispiel „und“, „als“ oder die Personalform.'
  }[pq];
}
function onGap(gi) {
  const si = S.line, D = S.D, p = D.sents[si];
  if (S.step === 'anim') return;
  if (S.mode === 'orig') {
    if (S.probe || S.doneS[si]) return;
    const pl = S.placed[si];
    if (pl.has(gi)) { pl.delete(gi); Sound.sfx('remove'); } else { pl.add(gi); Sound.sfx('place'); }
    S.marks = null;
    renderLupe(); renderPaper();
    return;
  }
  if (S.mode === 'forge') return forgeToggle(si, gi);
  if (S.mode !== 'check') return;
  if (S.sel && S.sel.s === si && S.sel.gi === gi) return cancelSel();
  const f = forgAt(si, gi);
  if (f && f.found) { note('Diese Stelle hast du schon bewiesen.'); return; }
  if (p.gaps[gi].sol === 'kann') return golden(si, gi);
  Sound.sfx('stift');
  S.sel = { s: si, gi }; S.hintWord = null;
  if (D.stufe === 1) {
    if (!f) return falseAlarm(si, gi);
    S.pq = f.options[0].pq; S.step = 'beleg';
    note([{ t: `Gute Spur! Eine Vermutung habe ich schon: ${pqName(S.pq)}. Welches Wort kann das belegen?`, cls: 'okk' }, { t: 'Tipp: ' + belegGuide(S.pq), cls: 'story' }]);
  } else {
    S.pq = null; S.step = 'pq';
    note({ t: 'Verdacht notiert! Welche Kommaregel gilt hier – oder gehört hier gar kein Komma hin?', cls: 'okk' }, bookLink('pruef'));
  }
  renderLupe(); renderProof(); renderPaper();
  Coach.event('gap', { si, gi, forged: !!f });
  if (D.stufe === 2 && !D.partner && S.step === 'pq') tip('gruende');
}
function onPQ(id) {
  if (!S.sel || !(S.step === 'pq' || S.step === 'beleg')) return;
  if (S.D.stufe === 1 && S.mode === 'check') return;
  S.pq = id; S.step = 'beleg'; S.hintWord = null;
  Sound.sfx('select');
  note([{ t: `Deine Vermutung: ${pqName(id)}. Welches Wort kann das belegen? Tippe es in der Lupe an.`, cls: 'okk' }, { t: 'Tipp: ' + belegGuide(id), cls: 'story' }]);
  renderLupe(); renderProof();
  Coach.event('pq', id);
}
function onWord(wi) {
  if (S.step !== 'beleg' || !S.sel) return;
  if (S.probe) return evalProbe(wi);
  evalProof(wi);
}
function evalProof(wi) {
  const { s, gi } = S.sel, f = forgAt(s, gi);
  if (!f) return falseAlarm(s, gi);
  const opt = f.options.find(o => o.pq === S.pq && o.beleg.has(wi));
  if (opt) return proven(f, opt, wi);
  f.tries++;
  Sound.sfx('wrong');
  const quick = S.settings.quickHints;
  const pqOk = f.options.some(o => o.pq === S.pq);
  const word = Core.clean(S.D.sents[s].words[wi].text);
  const lines = [{ t: pqOk ? `„${word}“ belegt das nicht. Welches Wort zeigt die Regel ${pqName(S.pq)}?` : `Mit der Regel ${pqName(S.pq)} lässt sich hier nichts belegen.`, cls: 'warn' }];
  if (pqOk) {
    lines.push(belegGuide(S.pq));
    if (f.tries >= 2 || quick) { const o = f.options.find(o => o.pq === S.pq); S.hintWord = [...o.beleg][0]; lines.push('Das gelb umrandete Wort ist ein Beweiswort.'); }
  } else {
    lines.push(f.tries >= 2 || quick ? `Versuch es mit der Regel „${pqName(f.options[0].pq)}“.` : `Denk an den Tipp: ${CASES[S.c] ? CASES[S.c].spur : ''}`);
    if (S.D.stufe !== 1) { S.step = 'pq'; S.pq = null; }
  }
  note(lines, f.tries >= 2 ? bookLink(f.page) : '');
  renderLupe(); renderProof();
  Coach.event('wrongword', wi);
}
function proven(f, opt, wi) {
  const D = S.D;
  f.found = true;
  if (!D.partner && !S.tut) { const st = S.stats[S.c]; st.found++; if (f.tries === 0) st.first++; }
  award('lupe');
  Sound.sfx('beweis');
  S.anim = { opt, wi }; S.step = 'anim';
  const lines = [{ t: `Bewiesen mit dem Beweiswort „${Core.clean(D.sents[f.s].words[wi].text)}“ – eine Fälschung!`, cls: 'okk' }, Core.forgeryText(D, f)];
  if (f.alt) lines.push('Diesen Trick kennst du schon aus einem früheren Fall.');
  const left = D.forg.filter(x => !x.found).length;
  if (D.stufe === 1 && !left) lines.push('Alle Fälschungen sind bewiesen. Jetzt stempeln!');
  note(lines, bookLink(f.page));
  hop();
  renderLupe(); renderProof(); renderPaper(); renderAkte(); renderHud();
  setTimeout(() => {
    S.anim = null; S.sel = null; S.pq = null; S.step = 'spot'; S.hintWord = null;
    if (S.hintGap && S.hintGap.s === f.s && S.hintGap.gi === f.gi) S.hintGap = null;
    renderLupe(); renderProof(); renderCtrl(); renderPaper();
    Coach.event('proven', f);
  }, S.settings.calm ? 50 : 1100);
  persist();
}
function falseAlarm(si, gi) {
  const D = S.D, p = D.sents[si];
  D.fehl++;
  if (!D.partner && !S.tut) S.stats[S.c].fehl++;
  Sound.sfx('holz');
  const v = gapView(si, gi);
  const lines = [{ t: v.comma ? 'Fehlalarm: Dieses Komma ist echt.' : 'Fehlalarm: Hier fehlt nichts.', cls: 'warn' }];
  let page = 'kein';
  if (v.comma) {
    const r = Core.roles(p, gi)[0];
    if (r) lines.push(Core.roleText(p, r, gi));
    page = Core.pageOf(p, r);
  } else lines.push(Core.noCommaText(p, gi));
  S.sel = null; S.step = 'spot'; S.pq = null;
  note(lines, bookLink(page));
  renderLupe(); renderProof(); renderAkte(); renderHud();
  Coach.event('false', { si, gi });
}
function golden(si, gi) {
  S.D.goldSeen.add(key(si, gi));
  award('gold1');
  Sound.sfx('gold');
  note([{ t: 'Ein goldenes Komma!', cls: 'okk' }, 'Hier ist beides richtig – mit und ohne Komma. Das ist keine Fälschung und kein Fehlalarm.'], bookLink('kann'));
  renderLupe(); renderPaper();
}

/* ---------- Stempel ---------- */
function openStamp() {
  openOverlay(`<div class="kicker">Stempel</div><h2 id="cardTitle">Echt oder gefälscht?</h2><p>Hast du alle Sätze geprüft? Dann stempele das Dokument.</p>
    <div class="stampchoice"><button type="button" class="stampbtn echt" id="stEcht">ECHT<small>Alle Kommas stimmen.</small></button><button type="button" class="stampbtn fake" id="stFake">GEFÄLSCHT<small>Ich habe Fälschungen gefunden.</small></button></div>
    <div class="row end acts"><button type="button" class="btn" data-close>Noch einmal prüfen</button></div>`, { paper: true, closable: !S.tut });
  $('stEcht').onclick = () => stamp('echt');
  $('stFake').onclick = () => stamp('fake');
  wireClose();
  Coach.event('stampOpen');
}
function stamp(choice) {
  closeOverlay(true);
  const D = S.D;
  const open = D.forg.filter(f => !f.found);
  const fake = D.forg.length > 0;
  if (open.length) {
    S.stampTries++;
    Sound.sfx('wrong');
    const f = open[0];
    const lines = [{ t: choice === 'echt' && !D.forg.some(x => x.found) ? 'Halt! Dieses Dokument ist gefälscht.' : 'Halt! Du hast noch nicht alle Fälschungen gefunden.', cls: 'warn' }];
    setLine(f.s);
    if (S.stampTries >= 2 || S.settings.quickHints) { S.hintGap = { s: f.s, gi: f.gi }; lines.push(`In Satz ${f.s + 1} ist eine Lücke gelb umrandet. Dort steckt die Fälschung – belege sie mit einem Beweiswort.`); }
    else lines.push(`Schau dir Satz ${f.s + 1} noch einmal genau an.`);
    note(lines);
    renderLupe();
    return;
  }
  if (fake && choice === 'echt') { note([{ t: 'Du hast doch Fälschungen bewiesen – also ist das Dokument gefälscht.', cls: 'warn' }, 'Stempele noch einmal.']); if (S.tut) openStamp(); Coach.event('stampWrong'); return; }
  if (!fake && choice === 'fake') {
    S.stampTries++; Sound.sfx('wrong');
    note([{ t: 'Hier ist keine Fälschung: Alle Kommas sind echt.', cls: 'warn' }, D.fehl ? 'Deine Fehlalarme haben es schon gezeigt. Stempele „echt“.' : 'Prüfe noch einmal – oder stempele „echt“.']);
    return;
  }
  finishDoc(fake ? 'fake' : 'echt');
}
function finishDoc(kind) {
  const D = S.D;
  Sound.sfx('stempel');
  D.stampKind = kind;
  S.sel = null; S.step = 'spot'; S.pq = null; S.hintGap = null; S.probe = null; S.marks = null;
  setMode('done');
  if (D.partner) { renderAll(); return setTimeout(showPartnerResult, S.settings.calm ? 50 : 700); }
  if (S.train) {
    note([{ t: 'Training geschafft!', cls: 'okk' }, `${S.train.first} von ${S.D.sents.length} Sätzen waren beim ersten Versuch richtig.`]);
    hop(); renderAll(); return;
  }
  if (S.tut) { award('stempel'); note([{ t: 'Gefälscht – und bewiesen!', cls: 'okk' }, 'So sieht der Zettel richtig aus. Das reparierte Komma ist türkis.']); hop(); renderAll(); Coach.event('stamped', kind); return; }
  award('stempel');
  S.prog.d[S.c] = Math.max(S.prog.d[S.c], S.di + 1);
  if (S.c === EXTRA && D.stufe === 3) award('gold2');
  persist();
  const n = D.forg.length;
  const lines = kind === 'fake'
    ? [{ t: `Gefälscht! ${n === 1 ? 'Eine Fälschung' : n + ' Fälschungen'} bewiesen${D.fehl ? `, ${D.fehl} Fehlalarm${D.fehl > 1 ? 'e' : ''}` : ''}.`, cls: 'okk' }, 'So sieht das Original aus. Die reparierten Kommas sind türkis.']
    : kind === 'echt'
      ? [{ t: 'Echt! Gut, dass du nichts erfunden hast.', cls: 'okk' }, D.fehl ? `Fehlalarme: ${D.fehl}. Auch das gehört zum Prüfen.` : 'Kein einziger Fehlalarm – sauber geprüft.']
      : [{ t: 'Original wiederhergestellt!', cls: 'okk' }, 'Komma legt das Dokument ab.'];
  note(lines);
  hop();
  renderAll();
  checkBookNews();
}
function afterDoc() {
  if (S.D && S.D.partner) return showPartnerResult();
  if (S.tut) return Coach.event('next');
  if (S.train) return showTrainResult();
  S.di++;
  if (S.di < NDOCS(S.c)) enterDesk(); else caseOutro();
}

/* ---------- Stufe 3: Original wiederherstellen ---------- */
function checkLine() {
  const si = S.line, p = S.D.sents[si], pl = S.placed[si];
  const missing = [...p.muss].filter(g => !pl.has(g));
  const extra = [...pl].filter(g => !p.muss.has(g) && !p.kann.has(g));
  if (!missing.length && !extra.length) {
    if (S.train && !S.tries[si]) S.train.first++;
    S.doneS[si] = true; S.marks = null;
    Sound.sfx('beweis'); hop();
    const lines = [{ t: 'Satz stimmt!', cls: 'okk' }];
    if (!p.muss.size && !p.kann.size) lines.push('Dieser Satz braucht kein Komma.');
    if (p.kann.size) { lines.push('Goldene Stelle: Mit und ohne Komma ist der Satz richtig.'); award('gold1'); }
    const nxt = S.doneS.findIndex(d => !d);
    if (nxt >= 0) lines.push('Weiter mit „Nächster Satz“.');
    note(lines);
    if (nxt < 0) return startProbes();
    renderLupe(); renderPaper(); renderCtrl(); renderAkte();
    return;
  }
  S.tries[si]++;
  Sound.sfx('wrong');
  const precise = S.tries[si] >= 2 || S.settings.quickHints;
  const lines = [{ t: S.tries[si] === 1 ? 'Noch nicht ganz.' : 'Fast! Die rot markierten Lücken stimmen noch nicht.', cls: 'warn' }];
  lines.push(missing.length ? Core.hintMissing(p, missing[0], precise) : Core.hintExtra(p, extra[0], precise));
  if (precise) S.marks = { s: si, miss: missing, extra };
  const r = missing.length ? Core.roles(p, missing[0])[0] : null;
  note(lines, (r ? bookLink(Core.pageOf(p, r)) : bookLink('kein')) + (S.tries[si] >= 3 ? '<p><button type="button" class="linkish" id="bReveal">Lösung zeigen</button></p>' : ''));
  const rv = $('bReveal');
  if (rv) rv.onclick = () => { S.placed[si] = new Set([...p.muss, ...[...pl].filter(g => p.kann.has(g))]); S.tries[si] = 0; checkLine(); };
  renderLupe();
}
function startProbes() {
  const D = S.D, n = S.train ? 1 : CASES[S.c].finale ? 3 : S.di >= NDOCS(S.c) - 1 ? 2 : 1;
  const prio = r => (!r ? 0 : r.pq === 'nebensatz' && !r.opens ? 4 : r.pq === 'zusatz' ? 3 : r.pq === 'nebensatz' || r.pq === 'infinitiv' ? 2 : 1);
  const cands = [];
  D.sents.forEach((p, si) => p.gaps.forEach(g => { if (g.sol === 'muss') { const r = Core.roles(p, g.i)[0]; cands.push({ s: si, gi: g.i, r, prio: prio(r) }); } }));
  if (!cands.length) return finishDoc('original');
  cands.sort((a, b) => b.prio - a.prio || (a.s * 7 + a.gi) % 5 - (b.s * 7 + b.gi) % 5);
  const list = [], used = new Set();
  for (const c of cands) { if (list.length >= n) break; const k = c.r.pq + (c.r.opens ? 'o' : 'c'); if (!used.has(k)) { used.add(k); list.push(c); } }
  for (const c of cands) { if (list.length >= n) break; if (!list.includes(c)) list.push(c); }
  S.probe = { list, k: 0, tries: 0 };
  showProbe();
  if (S.train || !CASES[S.c].finale) tip('begruenden');
}
function showProbe() {
  const pr = S.probe.list[S.probe.k];
  S.line = pr.s; S.sel = { s: pr.s, gi: pr.gi }; S.step = 'pq'; S.pq = null; S.probe.tries = 0; S.hintWord = null;
  const fin = !S.train && !!CASES[S.c].finale;
  note([{ t: fin ? `Die Elster fragt: „Warum steht hier ein Komma?“ (${S.probe.k + 1}/${S.probe.list.length})` : `Begründe das Komma (${S.probe.k + 1}/${S.probe.list.length})`, cls: 'okk' }, fin ? 'Erkläre es ihr: Welche Kommaregel gilt? Dann tippe auf das Beweiswort.' : 'Warum steht das gelb umrandete Komma da? Wähle die Kommaregel und belege sie mit einem Beweiswort.']);
  renderPaper(); renderLupe(); renderProof(); renderCtrl();
}
function evalProbe(wi) {
  const pr = S.probe.list[S.probe.k], p = S.D.sents[pr.s];
  const opts = Core.roles(p, pr.gi);
  const ok = opts.find(r => r.pq === S.pq && r.beleg.has(wi));
  if (ok || S.probe.tries >= 1) {
    const r = ok || opts[0];
    const lines = ok ? [{ t: `${!S.train && CASES[S.c].finale ? 'Die Elster nickt.' : 'Bewiesen!'} Beweiswort: „${Core.clean(p.words[wi].text)}“.`, cls: 'okk' }, Core.roleText(p, r, pr.gi)]
      : [{ t: 'So lautet der Beweis:', cls: 'warn' }, `Regel: ${pqName(r.pq)} – Beweiswort: „${Core.clean(p.words[[...r.beleg][0]].text)}“.`, Core.roleText(p, r, pr.gi)];
    Sound.sfx(ok ? 'beweis' : 'page');
    if (ok) { award('lupe'); hop(); }
    S.probe.k++;
    if (S.probe.k >= S.probe.list.length) {
      S.probe = null; S.sel = null; S.step = 'spot';
      finishDoc('original');
      note(lines.concat([{ t: 'Original wiederhergestellt! Komma legt das Dokument ab.', cls: 'okk' }]));
      return;
    }
    showProbe();
    note(lines.concat([`Weiter mit Komma ${S.probe.k + 1} von ${S.probe.list.length}.`]));
    return;
  }
  S.probe.tries++;
  Sound.sfx('wrong');
  const pqOk = opts.some(r => r.pq === S.pq);
  if (pqOk) { S.hintWord = [...opts.find(r => r.pq === S.pq).beleg][0]; note([{ t: 'Die Regel stimmt, das Beweiswort noch nicht.', cls: 'warn' }, 'Das gelb umrandete Wort ist ein Beweiswort.']); }
  else { S.step = 'pq'; S.pq = null; note([{ t: 'Diese Regel passt hier nicht.', cls: 'warn' }, `Versuch es mit der Regel „${pqName(opts[0].pq)}“.`]); }
  renderLupe(); renderProof();
}

const Coach = (() => {
  const root = document.createElement('div');
  root.id = 'coach'; root.hidden = true;
  root.innerHTML = `<div class="co-hole"></div><div class="co-blk"></div><div class="co-blk"></div><div class="co-blk"></div><div class="co-blk"></div>
    <div class="co-bub" role="dialog" aria-labelledby="coTxt"><div class="co-cat" aria-hidden="true"></div><div class="co-main"><p class="co-txt" id="coTxt" aria-live="polite"></p>
    <div class="co-row"><button type="button" class="linkish co-skip">Anleitung beenden</button><span class="co-n"></span><button type="button" class="btn primary co-next">Weiter</button></div></div></div>`;
  document.body.appendChild(root);
  const hole = root.querySelector('.co-hole'), blk = [...root.querySelectorAll('.co-blk')], bub = root.querySelector('.co-bub');
  const txt = root.querySelector('.co-txt'), nxt = root.querySelector('.co-next'), cnt = root.querySelector('.co-n'), skip = root.querySelector('.co-skip');
  let steps = null, k = 0, done = null, raf = 0, last = '';
  const box = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = Math.max(0, w) + 'px'; e.style.height = Math.max(0, h) + 'px'; };
  const targets = st => [].concat(typeof st.target === 'function' ? st.target() : st.target || [])
    .map(t => (typeof t === 'string' ? document.querySelector(t) : t)).filter(e => e && e.getClientRects().length);
  function place() {
    if (!steps) return;
    const st = steps[k], W = innerWidth, H = innerHeight;
    let r = null;
    targets(st).forEach(e => { const b = e.getBoundingClientRect(); r = r ? { l: Math.min(r.l, b.left), t: Math.min(r.t, b.top), r: Math.max(r.r, b.right), b: Math.max(r.b, b.bottom) } : { l: b.left, t: b.top, r: b.right, b: b.bottom }; });
    if (r) r = { l: Math.max(2, r.l - 6), t: Math.max(2, r.t - 6), r: Math.min(W - 2, r.r + 6), b: Math.min(H - 2, r.b + 6) };
    const bh = bub.offsetHeight;
    const sig = (r ? [r.l, r.t, r.r, r.b].map(Math.round).join(',') : '-') + `|${W}|${H}|${bh}|${k}`;
    if (sig !== last) {
      last = sig;
      const look = !!st.next || !r;
      hole.hidden = !r; blk[0].classList.toggle('dim', !r);
      if (r) box(hole, r.l, r.t, r.r - r.l, r.b - r.t);
      if (look) { box(blk[0], 0, 0, W, H); [1, 2, 3].forEach(i => box(blk[i], 0, 0, 0, 0)); }
      else { box(blk[0], 0, 0, W, r.t); box(blk[1], 0, r.b, W, H - r.b); box(blk[2], 0, r.t, r.l, r.b - r.t); box(blk[3], r.r, r.t, W - r.r, r.b - r.t); }
      let top;
      if (!r) top = (H - bh) / 2;
      else if ((r.t + r.b) / 2 < H / 2 && r.b + 12 + bh <= H - 8) top = r.b + 12;
      else if (r.t - 12 - bh >= 8) top = r.t - 12 - bh;
      else if (r.b + 12 + bh <= H - 8) top = r.b + 12;
      else top = (r.t + r.b) / 2 < H / 2 ? H - bh - 8 : 8;
      bub.style.top = Math.max(8, Math.min(H - bh - 8, top)) + 'px';
    }
    raf = requestAnimationFrame(place);
  }
  function show(i) {
    k = i; const st = steps[k];
    if (st.enter) st.enter();
    txt.textContent = st.text;
    nxt.hidden = !st.next; if (st.next) nxt.textContent = st.next;
    cnt.textContent = steps.length > 1 ? `${k + 1}/${steps.length}` : '';
    last = '';
    if (st.next) nxt.focus({ preventScroll: true });
  }
  function stop() { steps = null; done = null; root.hidden = true; cancelAnimationFrame(raf); }
  function finish(skipped) { const cb = done; stop(); if (cb) cb(skipped); }

  nxt.onclick = () => { if (steps && steps[k].next) advance(); };
  skip.onclick = () => finish(true);
  root.addEventListener('keydown', e => { if (e.key === 'Escape' && steps) { e.stopPropagation(); finish(true); } });
  return {
    start(list, cb, opts) {
      steps = list; done = cb || null; root.hidden = false;
      root.querySelector('.co-cat').innerHTML = catSVG(3);
      skip.textContent = (opts && opts.skip) || 'Anleitung beenden';
      show(0); cancelAnimationFrame(raf); raf = requestAnimationFrame(place);
    },
    event(name, data) {
      if (!steps) return;
      const st = steps[k];
      if (st.wait === name && (!st.when || st.when(data))) return advance();
      if (st.back && st.back[name] != null) return show(st.back[name]);
      const w = st.wrong && st.wrong[name];
      if (w) { txt.textContent = typeof w === 'function' ? w(data) : w; last = ''; }
    },
    active: () => !!steps,
    cur: () => (steps ? steps[k] : null),
    stop
  };
})();

}
function fundHTML(p, f) {

/* ---------- Kommatraining: freies Setzen mit gemischten Sätzen ---------- */
const TRAIN_RULES = ['mix', 'reihung', 'gegensatz', 'nebensatz', 'infinitiv', 'zusatz', 'kein'];
const ruleOpen = r => r === 'mix' || pageOpen(BOOK.find(pg => pg.id === Core.PQ[r].page));
function trainPool(rule) {
  const out = new Set();
  CASES.forEach((cs, c) => {
    if (c === EXTRA || !(reached(c) || caseDone(c))) return;
    cs.docs.forEach(d => d.s.forEach(m => {
      const p = Core.parse(m);
      if (p.kann.size) return;
      const pqs = new Set();
      p.gaps.forEach(g => { if (g.sol === 'muss') Core.roles(p, g.i).forEach(r => pqs.add(r.pq)); });
      if (rule === 'mix' || (rule === 'kein' ? !p.muss.size : pqs.has(rule))) out.add(m);
    }));
  });
  return [...out];
}

    const label = r === 'mix' ? 'Gemischt' : pqName(r);
    const sub = !open ? 'noch nicht entdeckt' : !ok ? 'noch zu wenige Sätze' : r === 'mix' ? 'alle entdeckten Regeln' : Core.PQ[r].sub;
    return `<button type="button" class="file${r === 'mix' ? ' gold' : ''}" data-r="${r}" ${ok ? '' : 'disabled'}><span class="no">${r === 'mix' ? 'Empfohlen' : 'Regel'}</span><b>${esc(label)}</b><span class="st">${esc(sub)}</span></button>`;
  }).join('');
  openOverlay(`<div class="kicker">Kommatraining</div><h2 id="cardTitle">Kommas setzen</h2>
    <p>Fünf Sätze aus deinen Fällen – ohne Kommas. Setze sie selbst und prüfe jeden Satz. Zum Schluss begründest du ein Komma mit Regel und Beweiswort.</p>
    <p class="small">Gemischt ist am besten: Dann musst du bei jeder Lücke selbst entscheiden, welche Regel passt.</p>
    <div class="files">${btns}</div><div class="row end acts"><button type="button" class="btn" data-close>Zurück</button></div>`, { closable: true });
  document.querySelectorAll('#card .file[data-r]').forEach(b => { b.onclick = () => startTraining(b.dataset.r); });
  wireClose();
}
function startTraining(rule) {
  const pool = shuffle(trainPool(rule));
  if (pool.length < 3) return;
  closeOverlay(true); Coach.stop();
  const label = rule === 'mix' ? 'Gemischte Sätze' : pqName(rule);
  const back = S.train ? S.train.back : { c: S.c, mode: S.mode };
  S.train = { rule, label, first: 0, back, doc: { typ: 'Training', titel: label, von: 'Ida', stufe: 3, s: pool.slice(0, 5), f: [] } };
  S.partner = null; if (S.c < 0) S.c = 0;
  renderRoom();
  openDoc();
}
function showTrainResult() {
  const t = S.train, n = S.D.sents.length;
  setMode('title');
  openOverlay(`<div class="kicker">Kommatraining · ${esc(t.label)}</div><h2 id="cardTitle">Training geschafft!</h2>
    <p>${t.first} von ${n} Sätzen waren beim ersten Versuch richtig.${t.first === n ? ' Stark – kein einziger Fehlversuch!' : ''}</p>
    <div class="row end acts"><button type="button" class="btn" id="trBack">Fertig</button><button type="button" class="btn" id="trOther">Andere Regel</button><button type="button" class="btn primary big" data-primary id="trAgain">Noch eine Runde</button></div>`, { paper: true });
  $('trAgain').onclick = () => startTraining(t.rule);
  $('trOther').onclick = () => showTraining();
  $('trBack').onclick = () => leaveTraining();
}
function leaveTraining() {
  const back = S.train && S.train.back;
  S.train = null; S.D = null;
  closeOverlay(true);
  if (back && back.c >= 0 && back.mode !== 'title' && S.di < NDOCS(back.c)) { S.c = back.c; renderRoom(); return enterDesk(); }
  S.c = -1; showTitle();
}

/* ---------- Hefteinträge (zuschaltbar) ---------- */
const heftOpen = c => S.settings.allOpen || caseDone(c);
const heftLabel = c => (c === EXTRA ? 'Extrakapitel' : `Kapitel ${c + 1}`);
function plainSentence(markup) {
  const p = Core.parse(markup);
  return p.words.map((w, i) => w.text + (i < p.words.length - 1 ? (p.gaps[i].sol === 'muss' ? ',' : p.gaps[i].sol === 'kann' ? '(,)' : '') : '')).join(' ');
}
function heftPlain(c) {
  const h = HEFT[c];
  return [`${heftLabel(c)}: ${h.titel}`, `Regel: ${h.frage}`, ...h.regeln.map((r, i) => `${i + 1}. ${r.regel}\n   Beispiel: ${plainSentence(r.beispiel)}`)].join('\n');
}
function showHeft(c, after) {
  const render = () => {
    const h = HEFT[c], open = heftOpen(c);
    const toc = after ? '' : `<nav class="heft-toc" aria-label="Kapitel">${HEFT.map((_, i) => `<button type="button" class="btn${heftOpen(i) ? '' : ' locked'}" data-k="${i}" aria-current="${i === c}" aria-label="${esc(heftLabel(i))}">${i === EXTRA ? 'Extra' : i + 1}</button>`).join('')}</nav>`;
    const where = c === FIN ? 'das Finale' : c === EXTRA ? 'der Extrafall' : caseLabel(c);
    const body = open
      ? `<div class="heft-sheet" id="heftSheet"><p class="heft-k">${heftLabel(c)}</p><h2 id="cardTitle">${esc(h.titel)}</h2><p class="heft-q">Regel: ${esc(h.frage)}</p>
          <ol class="heft-list">${h.regeln.map(r => `<li><p>${esc(r.regel)}</p><p class="heft-bsp"><span>Beispiel:</span> ${markupHTML(r.beispiel)}</p></li>`).join('')}</ol></div>
        <p class="small">Abschreiben und die Kommas im Heft farbig markieren.</p>`
      : `<h2 id="cardTitle">${heftLabel(c)}: noch leer</h2><p>Dieser Eintrag erscheint, sobald ${where} gelöst ist.</p>`;
    const nav = after
      ? `<button type="button" class="btn" id="hMap">Alle Fälle</button><button type="button" class="btn ${after.gold ? 'gold' : 'primary'} big" data-primary id="hGo">${esc(after.label)}</button>`
      : `<button type="button" class="btn" data-close>Schließen</button>`;
    openOverlay(`<div class="kicker">Hefteintrag</div>${toc}${body}
      <div class="row end acts"><span class="small" id="heftMsg" aria-live="polite"></span>${open ? '<button type="button" class="btn" id="hCopy">Text kopieren</button>' : ''}${nav}</div>`,
    { closable: !after, paper: true, cls: 'heft', quiet: true });
    document.querySelectorAll('#card .heft-toc .btn').forEach(b => { b.onclick = () => { c = +b.dataset.k; Sound.sfx('page'); render(); document.querySelector('#card .heft-toc [aria-current="true"]')?.focus({ preventScroll: true }); }; });
    if (open) $('hCopy').onclick = () => {
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($('heftSheet')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('heftMsg').textContent = 'Markiert – jetzt kopieren.'; };
      try { navigator.clipboard.writeText(heftPlain(c)).then(() => { $('heftMsg').textContent = 'Kopiert.'; }, fallback); } catch (e) { fallback(); }
    };
    if (after) { $('hMap').onclick = () => showMenu(); $('hGo').onclick = after.go; }
    wireClose();
  };
  Sound.sfx('page');
  render();
}

/* ---------- Einstellungen, Info ---------- */
function showSettings(confirmReset) {
  const sw = (id, label, hint, on) => `<label for="${id}"><span>${esc(label)}${hint ? `<br><span class="hint">${esc(hint)}</span>` : ''}</span><input type="checkbox" class="switch" id="${id}" ${on ? 'checked' : ''}></label>`;
  openOverlay(`<div class="kicker">Einstellungen</div><h2 id="cardTitle">Einstellungen</h2>
    <div class="sec"><h3>Ton und Bild</h3><div class="set">
      ${sw('oMusic', 'Musik', '', S.settings.music)}
      ${sw('oSfx', 'Geräusche', '', S.settings.sfx)}
      ${sw('oQuiet', 'Musik beim Lesen ausschalten', 'Sonst wird sie beim Prüfen nur leiser.', S.settings.quietRead)}
      ${sw('oCalm', 'Weniger Bewegung', 'Ohne kleine Animationen.', S.settings.calm)}
    </div></div>
    <div class="sec"><h3>Hilfe beim Spielen</h3><div class="set">
      ${sw('oQuick', 'Sofort genaue Hilfe', 'Hinweise zeigen gleich die genaue Stelle. Gut für den Anfang.', S.settings.quickHints)}
      ${sw('oCount', 'Zahl der Fälschungen und Kommas zeigen', 'Stufe 2: wie viele Fälschungen versteckt sind. Stufe 3 und Training: wie viele Kommas ein Satz braucht.', S.settings.showCount)}
      ${sw('oHeft', 'Hefteinträge', 'Nach jedem Fall erscheint ein Eintrag mit Regel und Beispielsatz zum Abschreiben. Alle Einträge stehen dann unter „Alle Fälle“ → „Hefter“.', S.settings.heft)}
    </div></div>
    <div class="sec"><h3>Für Lehrkräfte</h3><div class="set">
      ${sw('oKann', 'Extrafall „Goldene Kommas“ sofort öffnen', 'Kann-Kommas: Beide Fassungen sind richtig.', S.settings.kann)}
      ${sw('oOpen', 'Alle Fälle und Buchseiten öffnen', '', S.settings.allOpen)}
    </div></div>
    <div class="sec"><h3>Speichern</h3><div class="set">
      ${sw('oSave', 'Spielstand auf diesem Gerät speichern', 'Aus: Nichts wird gespeichert. An: Der Spielstand bleibt nur in diesem Browser.', S.settings.save)}
    </div>
      <p><b>Aktenzeichen</b> – dein Code zum Weiterspielen, auch auf einem anderen Gerät. Schreib ihn dir auf!</p>
      <div class="row"><span class="code" id="codeOut">${Core.encode(S.prog)}</span><button type="button" class="btn" id="copyCode">Kopieren</button></div>
      <div class="row"><label for="codeIn" class="small">Code eingeben:</label><input class="codein" id="codeIn" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX-X"><button type="button" class="btn" id="loadCode">Laden</button></div>
      <p class="small" id="codeMsg" aria-live="polite"></p></div>
    <div class="sec"><h3>Neu beginnen</h3>${confirmReset ? '<p>Wirklich den ganzen Fortschritt löschen?</p><div class="row"><button type="button" class="btn" id="resetYes">Ja, löschen</button><button type="button" class="btn" id="resetNo">Abbrechen</button></div>' : '<div class="row"><button type="button" class="btn" id="resetAsk">Fortschritt löschen</button></div>'}</div>
    <div class="row end acts"><button type="button" class="btn primary" data-primary data-close>Fertig</button></div>`, { closable: true });
  const bind = (id, k, after) => { $(id).onchange = e => { S.settings[k] = e.target.checked; if (after) after(); persist(); }; };
  bind('oMusic', 'music', applySound); bind('oSfx', 'sfx', applySound); bind('oQuiet', 'quietRead', applySound);
  bind('oCalm', 'calm'); bind('oCount', 'showCount', () => { if (S.D) renderAll(); }); bind('oQuick', 'quickHints'); bind('oHeft', 'heft');
  bind('oKann', 'kann', () => checkBookNews(true)); bind('oOpen', 'allOpen', () => checkBookNews(true));
  $('oSave').onchange = e => { S.settings.save = e.target.checked; if (S.settings.save) persist(); else clearStore(); };
  $('copyCode').onclick = () => {
    const t = $('codeOut').textContent;
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('codeOut')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('codeMsg').textContent = 'Markiert – jetzt kopieren oder abschreiben.'; };
    try { navigator.clipboard.writeText(t).then(() => { $('codeMsg').textContent = 'Kopiert.'; }, fallback); } catch (e) { fallback(); }
  };
  $('loadCode').onclick = () => {
    const prog = Core.decode($('codeIn').value);
    if (!prog) { $('codeMsg').textContent = 'Dieser Code stimmt nicht. Prüfe jedes Zeichen.'; return; }
    S.prog = prog; updateAlbumCount(); persist(); checkBookNews(true);
    S.c = -1; S.D = null; setMode('title'); renderRoom();
    $('codeMsg').textContent = 'Spielstand geladen.';
    $('codeOut').textContent = Core.encode(S.prog);
  };
  if (confirmReset) {
    $('resetYes').onclick = () => { S.prog = { d: [0, 0, 0, 0, 0, 0, 0], st: 0, intro: false }; S.stats = newStats(); S.settings.tips = []; S.c = -1; S.D = null; setMode('title'); updateAlbumCount(); persist(); checkBookNews(true); renderRoom(); showSettings(false); $('codeMsg').textContent = 'Fortschritt gelöscht.'; };
    $('resetNo').onclick = () => showSettings(false);
  } else $('resetAsk').onclick = () => showSettings(true);
  wireClose();
}
function showInfo() {
  openOverlay(`<div class="kicker">Info</div><h2 id="cardTitle">Über das Spiel</h2>
    <div class="sec"><h3>Regelgrundlage</h3><p>Amtliches Regelwerk der deutschen Rechtschreibung, Fassung 2024, Kapitel „Komma“ (§ 70–73, Abschnitte 2.4 und 2.5). Infinitivgruppen werden seit 2024 verbindlich mit Komma abgetrennt. Alle Regeln stehen im Kommabuch.</p><p class="small">Begriffe im Spiel: Die fünf Kommaregeln heißen wie in den Schulbüchern – Aufzählung, Gegensatz, Nebensatz, Infinitivgruppe (Infinitivkonstruktion) und Zusatz. „Zusatz“ umfasst Einschub, Beisatz (Apposition), Nachtrag, Anrede, Ausruf und Herausstellung. Fachwörter wie Personalform, Einleitewort und Prädikat werden im Kommabuch erklärt.</p></div>
    <div class="sec"><h3>So wird gespielt</h3><p>Komma prüft ein Dokument Satz für Satz. Jeder Satz erscheint groß in der Lupe. Tippe auf eine verdächtige Lücke, wähle die Kommaregel und belege deinen Verdacht mit einem Beweiswort aus dem Satz. Mit „Nächster Satz“ geht es weiter, nach dem letzten Satz stempelst du: echt oder gefälscht. In Stufe 3 setzt du alle Kommas selbst.</p><div class="row"><button type="button" class="btn" id="iTut">Anleitung starten</button></div><p class="small">Tastatur: Pfeil hoch und runter wechselt den Satz, Pfeil links und rechts wandert durch die Lupe, die Tasten 1 bis 6 wählen die Regel, Escape bricht ab.</p></div>
    <div class="row end acts"><button type="button" class="btn" data-close>Schließen</button></div>`, { closable: true });
  $('iTut').onclick = () => startTutorial(false);
  wireClose();
}

/* ---------- Start ---------- */
function start(data) {
  document.documentElement.lang = 'de';
  loadStore();
  if (data && data.prog) S.prog = data.prog;
  if (data && data.settings) Object.assign(S.settings, data.settings);
  if (data && data.stats) S.stats = data.stats;
  updateAlbumCount();
  applySound();
  checkBookNews(true);
  $('cat').innerHTML = catSVG(4); $('noteCat').innerHTML = catSVG(3);
  const go = () => { showTitle(); };
  if (document.fonts && document.fonts.load) document.fonts.load("20px 'Komma Pixel'").then(go, go); else go();
}
window.claude?.hot?.snapshot?.(() => ({ prog: S.prog, settings: S.settings, stats: S.stats }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
</body>
</html>
