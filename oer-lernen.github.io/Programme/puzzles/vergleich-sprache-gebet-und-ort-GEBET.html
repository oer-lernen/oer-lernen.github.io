:root{
  --paper:#F4EFFD;--ink:#2D2545;--ink-2:#5E5480;--shadow:#CDBDF0;
  --mint:#A6E3C8;--peach:#FFCBA9;--rose:#F6AECB;--sky:#AED6F3;--butter:#FFE99A;--lilac:#CDB9F4;
  --accent:#CDB9F4;--focus-bg:#FFFBEA;--desk:#E4F0FB;--desk-line:#D3E5F6;
  --px:3px;
  --pixel-border:0 calc(-1 * var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1 * var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink);
  --pixel-shadow:3px 9px 0 0 var(--shadow),9px 3px 0 0 var(--shadow),6px 6px 0 0 var(--shadow);
  --font-pixel:"Kachel",ui-monospace,monospace;
  --font-text:"Puzzle Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font:16px/1.4 var(--font-text)}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{display:block;flex:none}

.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 18px 6px}
.titlebox{margin:var(--px);padding:9px 14px 8px;background:var(--accent);box-shadow:var(--pixel-border);font:400 30px/1.1 var(--font-pixel);max-width:calc(100% - 6px)}
.instr{flex:1 1 300px;margin:0;font-size:clamp(15px,1.45vw,21px);line-height:1.35}
.right{display:flex;align-items:center;gap:14px;margin-left:auto}
.count{display:flex;align-items:center;gap:10px;font:400 30px/1 var(--font-pixel);white-space:nowrap;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;min-width:50px;margin:var(--px);padding:10px 14px 9px;border:0;border-radius:0;background:#fff;font:400 20px/1 var(--font-pixel);cursor:pointer;white-space:nowrap;
  box-shadow:var(--pixel-border),inset -3px -4px 0 0 rgba(45,37,69,.14),inset 3px 3px 0 0 rgba(255,255,255,.6)}
.btn:active{transform:translateY(2px);box-shadow:var(--pixel-border),inset 3px 4px 0 0 rgba(45,37,69,.14)}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:7px}
.btn-check{background:var(--mint)}
.btn.warn{background:var(--rose)}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.tray-bg{position:absolute;margin:0;background-color:var(--desk);background-image:linear-gradient(var(--desk-line) 2px,transparent 2px),linear-gradient(90deg,var(--desk-line) 2px,transparent 2px);background-size:24px 24px;box-shadow:var(--pixel-border)}
.board{position:absolute;background:#fff;box-shadow:0 0 0 3px var(--ink),9px 9px 0 3px rgba(45,37,69,.14)}
.cell{position:absolute;margin:0;padding:0;border:0;border-radius:0;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);display:flex;flex-direction:column;align-items:stretch;justify-content:center;cursor:default;overflow:hidden}
.cell:focus-visible{outline:4px dashed var(--ink);outline-offset:-9px;z-index:1}
.stage.choosing .cell{cursor:pointer}
.stage.choosing .cell:hover,.cell.target{background:var(--focus-bg);box-shadow:inset 0 0 0 1px var(--ink),inset 0 0 0 6px var(--butter)}
.cell.wrong{animation:wrong .7s}
.cell.filled{background:transparent;box-shadow:none}
@keyframes wrong{0%,100%{background:#fff}30%{background:#FBD3E3}}
.qimg{flex:1 1 0;min-height:0;width:100%;object-fit:contain;pointer-events:none}
.q{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;pointer-events:none}
.q span{display:block;width:100%;line-height:1.2;overflow-wrap:normal;word-break:normal}
.q.squeeze span{overflow-wrap:anywhere;hyphens:auto}

.tile{position:absolute;left:0;top:0;transform-origin:0 0;cursor:grab;touch-action:none;background-color:#EEE8FA;box-shadow:0 0 0 2px var(--ink);
  transition:transform .34s cubic-bezier(.2,.8,.25,1),box-shadow .2s;will-change:transform;outline:none}
.tile.pixelated{image-rendering:pixelated}
.tile:focus-visible{box-shadow:0 0 0 2px var(--ink),0 0 0 6px #fff,0 0 0 9px var(--ink)}
.tile.selected{box-shadow:0 0 0 2px var(--ink),0 0 0 8px var(--butter),0 0 0 11px var(--ink)}
.tile.drag{transition:box-shadow .2s;cursor:grabbing;box-shadow:0 0 0 2px var(--ink),12px 14px 0 0 rgba(45,37,69,.22)}
.tile.locked{cursor:default;box-shadow:none}
.tile.ok::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 7px var(--mint);animation:okfade 1s forwards;pointer-events:none}
@keyframes okfade{0%{opacity:1}60%{opacity:1}100%{opacity:0}}
.tile.nope{animation:shake .4s}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
.instant .tile{transition:none!important}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;font-weight:700;text-align:center;line-height:1.15;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.pill.mid{top:50%;transform:translate(-50%,-50%)}
.hide-pills .pill{opacity:0}

.done{position:absolute;z-index:5000;margin:var(--px);padding:22px 26px 24px;background:#fff;box-shadow:var(--pixel-border),var(--pixel-shadow);text-align:center;max-width:calc(100% - 24px)}
.done h2{margin:0 0 8px;font:400 50px/1.1 var(--font-pixel);text-shadow:5px 5px 0 var(--rose)}
.done p{margin:0 0 16px;font-size:18px}
.done .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.done.pop{animation:pop .45s steps(5)}
.done.narrow h2{font-size:30px;text-shadow:3px 3px 0 var(--rose)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.confetti{position:absolute;inset:0;pointer-events:none;z-index:4000;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:12px;height:12px;animation:fall var(--dur) steps(14) var(--delay) forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--fy)) rotate(var(--rot))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:700px),(max-height:560px){
  .bar{padding:8px 12px 4px;gap:6px 12px}
  .titlebox{font-size:20px;padding:6px 10px 5px}
  .count{font-size:20px}
  .btn{min-height:44px;min-width:44px;font-size:16px;padding:8px 10px 7px}
  .btn .lbl{display:none}
  .done h2{font-size:30px;text-shadow:3px 3px 0 var(--rose)}
}
@media (prefers-reduced-motion:reduce){
  .tile{transition:none}
  .tile.nope,.cell.wrong,.done.pop{animation:none}
}
</style>
</head>
<body>
<header class="bar">
  <h1 class="titlebox" id="title"></h1>
  <p class="instr" id="instr"></p>
  <div class="right">
    <span class="count" id="count"></span>
    <button type="button" class="btn btn-check" id="btnCheck" hidden></button>
    <button type="button" class="btn" id="btnShuffle"></button>
    <button type="button" class="btn" id="btnFull" hidden></button>
  </div>
</header>
<main class="stage" id="stage">
  <div class="tray-bg" id="trayBg"></div>
  <div class="board" id="board" role="group" aria-label="Fragen"></div>
  <div class="done" id="done" hidden role="dialog" aria-labelledby="doneTitle">
    <h2 id="doneTitle">Geschafft!</h2>
    <p>Alle Teile liegen richtig – das Bild ist fertig.</p>
    <div class="row">
      <button type="button" class="btn" id="btnAnswers">Antworten zeigen</button>
      <button type="button" class="btn btn-check" id="btnAgain">Nochmal</button>
    </div>
  </div>
</main>
<p class="sr" id="live" aria-live="polite"></p>

  check: ['........XX', '.......XX.', '......XX..', 'XX...XX...', '.XX.XX....', '..XXX.....', '...X......'],
  full: ['XXXX..XXXX', 'X........X', 'X........X', 'X........X', '..........', '..........', 'X........X', 'X........X', 'X........X', 'XXXX..XXXX'],
  piece: ['........XXXXXXX', '........XyyyyyX', 'XXXXXXXdXyyyyyX', 'XrrrrrXdXyyyyyX', 'XhrrrrXdXyyyyyX', 'XrrrrrXdXyyyyyX', 'XrrrrrXdXXXXXXX', 'XrrrrrXddddd...', 'XXXXXXXXXXXXX..', 'XmmmmmXsssssX..', 'XhmmmmXhssssX..', 'XmmmmmXsssssX..', 'XmmmmmXsssssX..', 'XmmmmmXsssssX..', 'XXXXXXXXXXXXX..'],
};
const PAL = { X:'#2D2545', w:'#FFFFFF', r:'#F6AECB', m:'#A6E3C8', s:'#AED6F3', y:'#FFE99A', d:'#E2D6F8', h:'#FFFFFF' };
function icon(name, scale) {
  const rows = ICONS[name], h = rows.length, w = rows[0].length;
  let r = '';
  rows.forEach((row, y) => { let x = 0; while (x < w) { const ch = row[x]; if (ch === '.') { x++; continue; } let x2 = x; while (x2 < w && row[x2] === ch) x2++; r += `<rect x="${x}" y="${y}" width="${x2 - x}" height="1" fill="${PAL[ch]}"/>`; x = x2; } });
  return `<svg width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${r}</svg>`;
}

/* ---------- Kopf ---------- */
document.documentElement.style.setProperty('--accent', D.accent || '#CDB9F4');
document.title = D.title || 'Puzzle';
$('#title').textContent = D.title || 'Puzzle';
const instrEl = $('#instr');
instrEl.textContent = D.instruction || '';
instrEl.hidden = !D.instruction;
const countEl = $('#count');
const btnShuffle = $('#btnShuffle'), btnCheck = $('#btnCheck'), btnFull = $('#btnFull');
btnShuffle.innerHTML = icon('dice', 3) + '<span class="lbl">Neu mischen</span>';
btnShuffle.setAttribute('aria-label', 'Neu mischen');
if (!INSTANT) { btnCheck.hidden = false; btnCheck.innerHTML = icon('check', 3) + '<span class="lbl">Prüfen</span>'; btnCheck.setAttribute('aria-label', 'Prüfen'); }
if (document.fullscreenEnabled) { btnFull.hidden = false; btnFull.innerHTML = icon('full', 3); btnFull.setAttribute('aria-label', 'Vollbild'); btnFull.title = 'Vollbild'; }

/* ---------- Bild ---------- */
const imgStyle = document.createElement('style');
imgStyle.textContent = `.tile{background-image:url("${D.image}");background-size:${COLS * 100}% ${ROWS * 100}%}`
  + `.board{background:#fff url("${D.image}") 0 0/100% 100% no-repeat${D.pixelated ? ';image-rendering:pixelated' : ''}}`;
document.head.append(imgStyle);

/* ---------- Brett und Teile ---------- */
const norm = s => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const cells = [];
D.pairs.forEach((p, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'cell'; b.dataset.i = i;
  b.setAttribute('aria-label', `Frage ${i + 1}: ${p.q || (p.img ? 'Bild' : 'leer')}`);
  if (p.img) { const im = new Image(); im.src = p.img; im.alt = ''; im.className = 'qimg'; b.append(im); }
  if (p.q) { const q = document.createElement('span'); q.className = 'q'; const s = document.createElement('span'); s.textContent = p.q; q.append(s); b.append(q); }
  b.addEventListener('click', () => onCell(i));
  boardEl.append(b); cells.push(b);
});

const tiles = [];
for (let t = 0; t < N; t++) {
  const el = document.createElement('div');
  el.className = 'tile' + (D.pixelated ? ' pixelated' : '');
  el.tabIndex = 0; el.setAttribute('role', 'button');
  const a = D.pairs[t].a;
  el.setAttribute('aria-label', a ? `Puzzleteil „${a}“` : 'Puzzleteil ohne Antwort');
  if (a) { const pill = document.createElement('span'); pill.className = 'pill' + (D.pillPos === 'mid' ? ' mid' : ''); pill.textContent = a; el.append(pill); }
  const T = { el, i: t, piece: t, at: -1, locked: false, busy: false, x: 0, y: 0, f: 1 };
  el.addEventListener('pointerdown', e => onDown(e, T));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!T.locked && !done) select(T, true); }
    if (e.key === 'Escape') deselect();
  });
  stage.append(el); tiles.push(T);
}
function setPiece(T, p) {
  T.piece = p;
  const c = p % COLS, r = Math.floor(p / COLS);
  T.el.style.backgroundPosition = `${(c / (COLS - 1)) * 100}% ${(r / (ROWS - 1)) * 100}%`;
}
tiles.forEach(T => setPiece(T, T.piece));

const occ = new Array(N).fill(-1);
let order = [], L = null, zTop = 10, done = false, selected = null;

function shuffleOrder() {
  order = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
}

/* ---------- Layout: Brett und Ablage so groß wie möglich, ohne Scrollen ---------- */
function computeLayout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const pad = Math.max(10, Math.min(22, W * 0.018)), gap = Math.max(16, Math.min(34, W * 0.025));
  const iw = W - 2 * pad, ih = H - 2 * pad, A = D.aspect;
  const tg = Math.max(8, Math.min(16, W * 0.01)), tpad = tg + 4;
  let best = null;
  for (const orient of ['row', 'col']) {
    for (let p = 0.4; p <= 0.78; p += 0.02) {
      let bw, bh, tray;
      if (orient === 'row') {
        bw = Math.min(iw * p - gap / 2, ih * A); bh = bw / A;
        tray = { w: iw - bw - gap, h: ih };
      } else {
        bh = Math.min(ih * p - gap / 2, iw / A); bw = bh * A;
        tray = { w: iw, h: ih - bh - gap };
      }
      if (bw < 40 || tray.w < 40 || tray.h < 40) continue;
      const cw = bw / COLS, ch = bh / ROWS;
      let f = 0, K = 1;
      for (let k = 1; k <= N; k++) {
        const r = Math.ceil(N / k);
        const fk = Math.min((tray.w - 2 * tpad - (k - 1) * tg) / (k * cw), (tray.h - 2 * tpad - (r - 1) * tg) / (r * ch));
        if (fk > f) { f = fk; K = k; }
      }
      if (f <= 0) continue;
      f = Math.min(f, 0.92);
      const score = bw * Math.min(1, f / 0.62);
      if (!best || score > best.score + 0.5) best = { score, orient, bw, bh, cw, ch, tray, f, K };
    }
  }
  if (!best) { const bw = Math.min(iw, ih * A); best = { orient: 'col', bw, bh: bw / A, cw: bw / COLS, ch: bw / A / ROWS, tray: { w: iw, h: 1 }, f: 0.3, K: N }; }
  const b = best;
  // ganze Pixel, damit fertige Teile ohne Nähte aneinanderstoßen
  b.cw = Math.max(1, Math.floor(b.bw / COLS));
  b.ch = Math.max(1, Math.min(Math.floor(b.bh / ROWS), Math.round(b.cw * COLS / A / ROWS)));
  b.bw = b.cw * COLS; b.bh = b.ch * ROWS;
  let bx, by, tx, ty;
  if (b.orient === 'row') {
    b.tray.w = iw - b.bw - gap;
    bx = Math.round(pad); by = Math.round(pad + (ih - b.bh) / 2);
    tx = bx + b.bw + gap; ty = pad;
  } else {
    b.tray.h = ih - b.bh - gap;
    bx = Math.round(pad + (iw - b.bw) / 2); by = Math.round(pad);
    tx = pad; ty = by + b.bh + gap;
  }
  const rowsK = Math.ceil(N / b.K);
  const gw = b.K * b.cw * b.f + (b.K - 1) * tg, gh = rowsK * b.ch * b.f + (rowsK - 1) * tg;
  L = { bx, by, bw: b.bw, bh: b.bh, cw: b.cw, ch: b.ch, f: b.f, K: b.K, tg,
        tray: { x: tx, y: ty, w: b.tray.w, h: b.tray.h },
        sx0: tx + (b.tray.w - gw) / 2, sy0: ty + (b.tray.h - gh) / 2,
        k: b.cw / D.cellMm };
}
function applyLayout() {
  computeLayout();
  Object.assign(boardEl.style, { left: L.bx + 'px', top: L.by + 'px', width: L.bw + 'px', height: L.bh + 'px' });
  Object.assign(trayBg.style, { left: L.tray.x + 'px', top: L.tray.y + 'px', width: L.tray.w + 'px', height: L.tray.h + 'px' });
  const pad = Math.min(2.4 * L.k, L.cw * 0.07, L.ch * 0.08);
  cells.forEach((c, i) => {
    Object.assign(c.style, { left: (i % COLS) * L.cw + 'px', top: Math.floor(i / COLS) * L.ch + 'px', width: L.cw + 'px', height: L.ch + 'px', padding: pad + 'px' });
    const im = c.querySelector('.qimg'), q = c.querySelector('.q');
    if (im) im.style.flexGrow = q ? '1.5' : '1';
    if (q) fitQuestion(q, Math.max(11, D.textSize.q * PT * L.k), 9);
  });
  tiles.forEach(T => {
    T.el.style.width = L.cw + 'px'; T.el.style.height = L.ch + 'px';
    const pill = T.el.querySelector('.pill');
    if (pill) fitPill(pill);
  });
  stage.classList.add('instant');
  tiles.forEach(T => { if (!T.drag) place(T); });
  stage.getBoundingClientRect();
  requestAnimationFrame(() => stage.classList.remove('instant'));
  if (done) positionDone();
}
function fitQuestion(q, base, min) {
  const s = q.firstChild;
  q.classList.remove('squeeze');
  let px = base;
  const over = () => s.scrollWidth > q.clientWidth + 1 || s.offsetHeight > q.clientHeight + 1;
  s.style.fontSize = px + 'px';
  while (over() && px > min) { px -= 0.5; s.style.fontSize = px + 'px'; }
  if (over()) q.classList.add('squeeze');
}
function fitPill(pill) {
  const k = L.k, inset = 1.6 * k;
  const maxW = L.cw - 2 * inset, maxH = Math.min(L.ch * 0.46, 16 * k);
  const base = Math.max(10, D.textSize.a * PT * k), min = 8;
  pill.style.padding = `${Math.max(2, 1.1 * k)}px ${Math.max(5, 2.2 * k)}px`;
  pill.style.borderWidth = Math.max(1.5, 0.35 * k) + 'px';
  pill.style.width = 'max-content'; pill.style.maxWidth = maxW + 'px';
  const ins = Math.max(4, 1.8 * k) + 'px';
  pill.style.top = D.pillPos === 'top' ? ins : (D.pillPos === 'mid' ? '50%' : 'auto');
  pill.style.bottom = D.pillPos === 'bottom' ? ins : 'auto';
  const fits = () => pill.scrollWidth <= pill.clientWidth + 1 && pill.offsetHeight <= maxH;
  pill.style.whiteSpace = 'nowrap'; pill.style.overflowWrap = 'normal';
  for (let px = base; px >= Math.max(min, base * 0.7); px -= 0.5) { pill.style.fontSize = px + 'px'; if (fits()) return; }
  pill.style.whiteSpace = 'normal';
  for (let px = base; px >= min; px -= 0.5) { pill.style.fontSize = px + 'px'; if (fits()) return; }
  pill.style.overflowWrap = 'anywhere';
}

/* ---------- Teile bewegen ---------- */
function slotRect(T) {
  const k = order.indexOf(T.i), c = k % L.K, r = Math.floor(k / L.K);
  return { x: L.sx0 + c * (L.cw * L.f + L.tg), y: L.sy0 + r * (L.ch * L.f + L.tg), f: L.f };
}
function cellRect(i) { return { x: L.bx + (i % COLS) * L.cw, y: L.by + Math.floor(i / COLS) * L.ch, f: 1 }; }
function apply(T) { T.el.style.transform = `translate(${T.x}px, ${T.y}px) scale(${T.f})`; }
function place(T) {
  const r = T.at >= 0 ? cellRect(T.at) : slotRect(T);
  T.x = r.x; T.y = r.y; T.f = r.f; apply(T);
}
function toTray(T) { if (T.at >= 0 && occ[T.at] === T.i) occ[T.at] = -1; T.at = -1; place(T); }
function putOnCell(T, ci) {
  if (T.at >= 0 && occ[T.at] === T.i) occ[T.at] = -1;
  T.at = ci; occ[ci] = T.i; place(T);
}
function cellAt(px, py) {
  if (!L || px < L.bx || py < L.by || px >= L.bx + L.bw || py >= L.by + L.bh) return -1;
  return Math.floor((py - L.by) / L.ch) * COLS + Math.floor((px - L.bx) / L.cw);
}
let targetCell = -1;
function setTarget(ci) {
  if (ci === targetCell) return;
  if (targetCell >= 0) cells[targetCell].classList.remove('target');
  targetCell = ci;
  if (ci >= 0) cells[ci].classList.add('target');
}
function say(msg) { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 30); }

/* Antworten gleich? Dann dürfen die Teile ihre Bildstücke tauschen, damit das Bild stimmt. */
function matches(T, ci) {
  if (T.piece === ci) return true;
  const a = norm(D.pairs[T.piece].a);
  if (!a || a !== norm(D.pairs[ci].a)) return false;
  const U = tiles.find(u => u.piece === ci);
  if (!U || U.locked) return false;
  const p = T.piece; setPiece(T, ci); setPiece(U, p);
  return true;
}

/* ---------- Ziehen mit Maus, Finger oder Stift (auch mehrere gleichzeitig) ---------- */
const drags = new Map();
function stagePoint(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function onDown(e, T) {
  if (T.locked || T.busy || done) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { T.el.setPointerCapture(e.pointerId); } catch (_) {}
  const p = stagePoint(e);
  drags.set(e.pointerId, { T, sx: p.x, sy: p.y, px: p.x, py: p.y, gx: (p.x - T.x) / T.f, gy: (p.y - T.y) / T.f, f0: T.f, moved: false, t0: 0 });
  T.el.focus({ preventScroll: true });
}
function startDrag(d) {
  const T = d.T;
  d.moved = true; d.t0 = performance.now(); T.drag = true;
  if (selected === T) deselect();
  if (T.at >= 0 && occ[T.at] === T.i) occ[T.at] = -1;
  T.at = -2;
  T.el.classList.add('drag'); T.el.style.zIndex = ++zTop;
}
let ticking = false;
function tick() {
  ticking = false;
  const now = performance.now();
  let again = false;
  drags.forEach(d => {
    if (!d.moved) return;
    const u = reduceMotion.matches ? 1 : Math.min(1, (now - d.t0) / 150);
    const f = d.f0 + (1 - d.f0) * u;
    d.T.f = f; d.T.x = d.px - d.gx * f; d.T.y = d.py - d.gy * f; apply(d.T);
    if (u < 1) again = true;
  });
  if (again) { ticking = true; requestAnimationFrame(tick); }
}
stage.addEventListener('pointermove', e => {
  const d = drags.get(e.pointerId); if (!d) return;
  const p = stagePoint(e); d.px = p.x; d.py = p.y;
  if (!d.moved) { if (Math.hypot(p.x - d.sx, p.y - d.sy) < 7) return; startDrag(d); }
  const ci = cellAt(p.x, p.y);
  setTarget(ci >= 0 && (!INSTANT || occ[ci] < 0) ? ci : -1);
  if (!ticking) { ticking = true; requestAnimationFrame(tick); }
});
function endPointer(e, cancelled) {
  const d = drags.get(e.pointerId); if (!d) return;
  drags.delete(e.pointerId);
  const T = d.T;
  if (!d.moved) { if (!cancelled) select(T, false); return; }
  T.drag = false; T.el.classList.remove('drag');
  setTarget(-1);
  const p = stagePoint(e);
  dropOn(T, cancelled ? -1 : cellAt(p.x, p.y));
}
stage.addEventListener('pointerup', e => endPointer(e, false));
stage.addEventListener('pointercancel', e => endPointer(e, true));

function dropOn(T, ci) {
  if (ci < 0) { toTray(T); return; }
  if (INSTANT) {
    if (occ[ci] >= 0 || !matches(T, ci)) { reject(T, ci); return; }
    putOnCell(T, ci); lock(T);
    say(`Richtig! ${count()} von ${N} Teilen liegen.`);
    progress();
  } else {
    const o = occ[ci];
    if (o >= 0 && o !== T.i) { const U = tiles[o]; if (U.locked) { toTray(T); return; } toTray(U); }
    putOnCell(T, ci);
    say(`Teil auf Frage ${ci + 1} gelegt.`);
  }
}
function reject(T, ci, quiet) {
  T.busy = true;
  T.at = -1;
  const r = cellRect(ci);
  T.x = r.x; T.y = r.y; T.f = 1; apply(T);
  cells[ci].classList.remove('wrong'); void cells[ci].offsetWidth; cells[ci].classList.add('wrong');
  if (!quiet) say('Das passt noch nicht. Das Teil liegt wieder in der Ablage.');
  const back = () => { T.el.classList.remove('nope'); place(T); T.busy = false; };
  if (reduceMotion.matches) { setTimeout(back, 350); return; }
  setTimeout(() => { T.el.classList.add('nope'); }, 300);
  setTimeout(back, 760);
}
function lock(T) {
  if (T.at >= 0) cells[T.at].classList.add('filled');
  T.locked = true; T.el.classList.add('locked', 'ok'); T.el.tabIndex = -1; T.el.setAttribute('aria-disabled', 'true');
  setTimeout(() => T.el.classList.remove('ok'), 1100);
}
const count = () => tiles.filter(T => T.locked).length;
function progress() {
  const c = count();
  countEl.innerHTML = icon('piece', 2) + `<span>${c} / ${N}</span>`;
  countEl.setAttribute('aria-label', `${c} von ${N} Teilen richtig`);
  if (c === N && !done) finish();
}

/* ---------- Tippen statt Ziehen, Tastatur ---------- */
function select(T, viaKeyboard) {
  if (T.locked || done) return;
  if (selected === T) { deselect(); return; }
  deselect();
  selected = T; T.el.classList.add('selected'); stage.classList.add('choosing');
  T.el.style.zIndex = ++zTop;
  const a = D.pairs[T.piece].a;
  say(`${a ? 'Teil „' + a + '“' : 'Teil'} ausgewählt. Wähle jetzt die passende Frage.`);
  if (viaKeyboard) { const free = cells.findIndex((c, i) => occ[i] < 0); if (free >= 0) cells[free].focus(); }
}
function deselect() {
  if (selected) selected.el.classList.remove('selected');
  selected = null; stage.classList.remove('choosing');
}
function onCell(ci) {
  if (!selected || done) return;
  const T = selected; deselect();
  if (T.busy) return;
  if (T.at >= 0 && occ[T.at] === T.i) occ[T.at] = -1;
  T.at = -1;
  dropOn(T, ci);
  if (document.activeElement && document.activeElement.classList.contains('cell')) {
    const next = tiles.find(u => !u.locked && u.at < 0 && !u.busy && u !== T) || (!T.locked && T);
    if (next) next.el.focus({ preventScroll: true });
  }
}
trayBg.addEventListener('click', () => { if (selected && selected.at >= 0) { const T = selected; deselect(); toTray(T); } else deselect(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') deselect(); });

/* ---------- Prüfen ---------- */
btnCheck.addEventListener('click', () => {
  const onBoard = tiles.filter(T => T.at >= 0 && !T.locked);
  if (!onBoard.length) { say('Lege zuerst Teile auf die Fragen.'); flashBtn(btnCheck); return; }
  let right = 0, wrong = 0;
  onBoard.forEach(T => { if (matches(T, T.at)) { lock(T); right++; } });
  onBoard.filter(T => !T.locked).forEach((T, k) => {
    wrong++;
    const ci = T.at;
    if (occ[ci] === T.i) occ[ci] = -1;
    T.at = -1; T.busy = true;
    setTimeout(() => reject(T, ci, true), 120 * k);
  });
  progress();
  if (count() < N) say(wrong ? `${right} richtig, ${wrong} ${wrong === 1 ? 'Teil passt' : 'Teile passen'} noch nicht.` : `Alles richtig! ${count()} von ${N} Teilen liegen.`);
});
function flashBtn(b) { b.classList.add('warn'); setTimeout(() => b.classList.remove('warn'), 600); }

/* ---------- Neu mischen (zweimal tippen, damit nichts aus Versehen verloren geht) ---------- */
let armed = null;
btnShuffle.addEventListener('click', () => {
  const started = tiles.some(T => T.at >= 0 || T.locked);
  if (started && !done && !armed) {
    btnShuffle.classList.add('warn');
    btnShuffle.querySelector('.lbl').textContent = 'Sicher? Nochmal tippen';
    say('Alle Teile kommen zurück in die Ablage. Zum Bestätigen nochmal tippen.');
    armed = setTimeout(disarm, 3500);
    return;
  }
  disarm(); restart();
});
function disarm() { clearTimeout(armed); armed = null; btnShuffle.classList.remove('warn'); btnShuffle.querySelector('.lbl').textContent = 'Neu mischen'; }
function restart() {
  done = false; deselect();
  $('#done').hidden = true; stage.classList.remove('hide-pills');
  occ.fill(-1);
  cells.forEach(c => c.classList.remove('filled', 'target', 'wrong'));
  tiles.forEach(T => { T.locked = false; T.at = -1; T.busy = false; T.el.className = 'tile' + (D.pixelated ? ' pixelated' : ''); T.el.tabIndex = 0; T.el.removeAttribute('aria-disabled'); setPiece(T, T.i); });
  shuffleOrder();
  tiles.forEach(place);
  progress();
  say('Neu gemischt.');
}

/* ---------- Geschafft ---------- */
function positionDone() {
  const box = $('#done'), area = L.tray;
  box.style.left = '0px'; box.style.top = '0px';
  box.style.maxWidth = area.w >= 240 ? Math.min(460, area.w - 24) + 'px' : '';
  box.classList.toggle('narrow', area.w >= 240 && area.w - 24 < 320);
  const w = box.offsetWidth, h = box.offsetHeight;
  let x, y;
  if (area.w >= 240 && area.h >= h + 16) { x = area.x + (area.w - w) / 2; y = area.y + (area.h - h) / 2; }
  else { box.style.maxWidth = ''; x = L.bx + (L.bw - box.offsetWidth) / 2; y = L.by + L.bh - box.offsetHeight / 2; }
  box.style.left = Math.max(8, x) + 'px'; box.style.top = Math.max(8, Math.min(y, stage.clientHeight - box.offsetHeight - 8)) + 'px';
}
function finish() {
  done = true; deselect();
  setTimeout(() => {
    stage.classList.add('hide-pills');
    $('#btnAnswers').textContent = 'Antworten zeigen';
    const box = $('#done'); box.hidden = false; positionDone();
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    $('#btnAgain').focus({ preventScroll: true });
    say('Geschafft! Alle Teile liegen richtig.');
    if (!reduceMotion.matches) confetti();
  }, 650);
}
$('#btnAnswers').addEventListener('click', () => {
  const hidden = stage.classList.toggle('hide-pills');
  $('#btnAnswers').textContent = hidden ? 'Antworten zeigen' : 'Antworten ausblenden';
});
$('#btnAgain').addEventListener('click', restart);
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#F6AECB', '#A6E3C8', '#AED6F3', '#FFE99A', '#CDB9F4', '#FFCBA9'];
  const H = stage.clientHeight;
  for (let i = 0; i < 56; i++) {
    const c = document.createElement('i');
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', ((Math.random() - 0.5) * 160) + 'px');
    c.style.setProperty('--fy', (H + 40) + 'px');
    c.style.setProperty('--rot', (Math.round(Math.random() * 4) * 90) + 'deg');
    c.style.setProperty('--dur', (1.6 + Math.random() * 1.2) + 's');
    c.style.setProperty('--delay', (Math.random() * 0.5) + 's');
    box.append(c);
  }
  stage.append(box);
  setTimeout(() => box.remove(), 3600);
}

/* ---------- Vollbild ---------- */
btnFull.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

/* ---------- Start ---------- */
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(applyLayout, 60); });
document.addEventListener('fullscreenchange', () => setTimeout(applyLayout, 60));
shuffleOrder();
progress();
const ready = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('20px Kachel'), document.fonts.load('16px "Puzzle Text"'), document.fonts.load('700 16px "Puzzle Text"')]).catch(() => {})
  : Promise.resolve();
ready.then(() => { applyLayout(); });
applyLayout();
})();
</script>
